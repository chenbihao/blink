[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
description = "Blink 构建编排工具（编译插件 / 打包入口 / release 资源校验）"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
