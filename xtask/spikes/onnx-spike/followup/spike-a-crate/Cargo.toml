[package]
name = "onnx-spike-a"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# ort: ONNX Runtime Rust binding
# 使用 load-dynamic feature: 运行时通过 LoadLibrary 加载 onnxruntime.dll
# 不使用 download-binaries, 避免构建期偷偷下载另一套 ORT
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "tracing"] }

# oar-ocr: 纯 Rust PaddleOCR ONNX 实现
# 禁用默认的 download-binaries, 避免构建期下载 ORT
oar-ocr = { version = "=0.9.2", default-features = false, features = ["simd"] }

# 辅助依赖
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"

# Windows API 用于获取真实进程内存和线程数
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"] }

[features]
default = []

# 独立于 Blink 主 workspace
[workspace]
