[package]
name = "onnx-spike-e"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# in-process 模式: 直接使用 ort Session
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "tracing"] }
oar-ocr = { version = "=0.9.2", default-features = false, features = ["simd"] }

# Real inference: fbank + audio loading
kaldi-native-fbank = "0.1"
hound = "3"
ndarray = "0.17"

# 辅助
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windows API 用于获取真实进程内存和线程数
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# 独立于 Blink 主 workspace
[workspace]
