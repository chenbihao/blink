[package]
name = "blink-domain-stt"
version = "0.25.3"
edition = "2024"
description = "Blink STT 语音转文字域（0.25.3 自 bin crate 拆出，17K 行整体：引擎 trait + 伪流式 + VAD + wav）"
license = "MIT"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
blink-domain-capability = { path = "../blink-domain-capability" }
blink-domain-config = { path = "../blink-domain-config" }
blink-infra = { path = "../blink-infra" }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "1"
tokio = { version = "1.52.3", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
