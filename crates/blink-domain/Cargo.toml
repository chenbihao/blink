[package]
name = "blink-domain"
version = "0.25.4"
edition = "2024"
description = "Blink 领域层主体（0.25.4 自 bin crate 整体拆出：能力协议+builtins、搜索、意图、插件、配置、便签等）"
license = "MIT"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
blink-domain-capability = { path = "../blink-domain-capability" }
blink-domain-config = { path = "../blink-domain-config" }
blink-domain-local-engine = { path = "../blink-domain-local-engine" }
blink-domain-stt = { path = "../blink-domain-stt" }
blink-infra = { path = "../blink-infra" }
bytes = "1"
chrono = "0.4.45"
dirs-next = "2.0"
evalexpr = "13.1.0"
futures = "0.3"
getrandom = "0.3"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "service"] }
inventory = "0.3"
jsonpath-rust = "0.7"
nucleo = "0.5.0"
once_cell = "1.21"
open = "5.3.5"
pinyin = "0.11.0"
regex = "1.11"
reqwest = { version = "0.13", features = ["json", "stream"] }
# rig-core/agent/rmcp：AI/MCP 域（与根同版本/feature；0.43 起 MCP 集成走 rig-rmcp）
rig-agent = { version = "0.43", features = ["test-utils"] }
rig-core = { version = "0.43", features = ["test-utils"] }
rig-rmcp = { version = "0.43" }
rmcp = { version = "2", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
sse-stream = "0.2.5"
thiserror = "1"
tokio = { version = "1.52.3", features = ["sync", "time", "process", "io-util", "net", "macros", "rt", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"
unicode-normalization = "0.1"
urlencoding = "2.1"
walkdir = "2.5"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
# 只读系统目录回放与快照耗时报告
tracing-subscriber = "0.3"
keyring-core = "1"
tempfile = "3"
