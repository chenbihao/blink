[package]
name = "blink-infra"
version = "0.25.1"
edition = "2024"
description = "Blink 基础设施层：平台调用、数据持久化、通用工具（0.25.1 自 bin crate 拆出，bin 侧 src/infra/mod.rs re-export shim 保持旧路径）"
license = "MIT"

[lints]
workspace = true

# 依赖对齐根 Cargo.toml（版本/feature 同源，workspace 统一解析）；
# windows 的 feature 集与 bin 完全一致，保证 `cargo test -p blink-infra` 单独构建时 API 齐全。
[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = "0.4.45"
cpal = "0.18"
dirs-next = "2.0"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "4", features = ["v1"] }
# keyring-core: secret/store.rs 生产代码直接使用（v2 命名的 Entry::new_with_modifiers target modifier，
# 0.25.15 起从 dev-deps 转正式依赖；单测内存 store 也基于其 api traits）
keyring-core = "1"
# nucleo: fuzzy 匹配（search 相关 infra 工具用，与根同版本）
nucleo = "0.5.0"
# oar-ocr: PP-OCRv6 pipeline（与根同款锁定，禁 download-binaries）
oar-ocr = { version = "=0.9.2", default-features = false, features = ["simd"] }
once_cell = "1.21"
# ort: ONNX Runtime binding（与根同款锁定，load-dynamic 运行时加载 DLL）
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "tracing"] }
png = "0.17"
quick-xml = "0.39.4"
pinyin = "0.11.0"
# reqwest: infra HTTP 工具（与根同款 rustls 默认后端）
reqwest = { version = "0.13", features = ["json", "stream"] }
# rig-core: conversations.rs 存取 rig_core::completion::Message（与根同版本）
rig-core = "0.43"
# rig-reqwest: http_log.rs 的 LoggingHttpClient 内核（rig 0.43 起默认 transport 拆出）
rig-reqwest = "0.43"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
thiserror = "1"
tokio = { version = "1.52.3", features = ["sync", "time", "process", "io-util", "net", "macros", "rt", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winreg = "0.55"
zeroize = { version = "1.9", features = ["derive"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Devices_Bluetooth",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_Registry",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Security_Credentials",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Globalization",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }
zip = "2.2"

[dev-dependencies]
tempfile = "3"
