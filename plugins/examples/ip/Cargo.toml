[package]
name = "blink-plugin-ip"
version = "0.2.0"
edition = "2024"

[lints]
workspace = true  # 继承 workspace 级别的 lint（如禁止 UTF-8 字节切片）

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
winreg = "0.55"
