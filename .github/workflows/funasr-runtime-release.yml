name: FunASR Runtime Release

permissions:
  contents: write

on:
  push:
    paths:
      - "xtask/src/funasr_worker.rs"
      - "xtask/funasr-worker/**"
      - "resources/stt/funasr-gguf/worker-lock.json"
      - ".github/workflows/funasr-runtime-release.yml"
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "Runtime version; must match artifact-matrix.json"
        required: true
        default: "0.22.16.3"
        type: string
      cuda_archs:
        description: "Explicit CUDA architectures, separated by semicolons"
        required: true
        default: "75;86;89;90"
        type: string
      require_hardware:
        description: "Fail instead of recording pending for missing GPU hardware"
        required: true
        default: false
        type: boolean

env:
  RUNTIME_VERSION: ${{ inputs.runtime_version || '0.22.16.3' }}
  CUDA_ARCHS: ${{ inputs.cuda_archs || '75;86;89;90' }}

jobs:
  build:
    name: Build ${{ matrix.flavor }} runtime
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, vulkan, cuda]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        if: matrix.flavor == 'vulkan'
        shell: pwsh
        run: |
          $version = "1.3.296.0"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait -NoNewWindow
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:VULKAN_SDK\Bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install CUDA Toolkit
        if: matrix.flavor == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas"]'

      - name: Build immutable runtime artifact
        shell: pwsh
        env:
          BLINK_CUDA_ARCHS: ${{ env.CUDA_ARCHS }}
        run: |
          $args = @("xtask", "funasr-worker", "--flavor", "${{ matrix.flavor }}", "--version", "$env:RUNTIME_VERSION", "--cuda-archs", "$env:BLINK_CUDA_ARCHS")
          if ("${{ inputs.require_hardware }}" -eq "true") { $args += "--require-hardware" }
          cargo @args

      - name: Verify artifact closure and checksums
        shell: pwsh
        run: |
          $id = switch ("${{ matrix.flavor }}") {
            "base" { "funasr-runtime-windows-x64-base" }
            "vulkan" { "funasr-runtime-windows-x64-vulkan" }
            "cuda" { "funasr-runtime-windows-x64-cuda" }
          }
          $dir = "target/funasr-runtime/$id"
          if (-not (Test-Path "$dir/manifest.json")) { throw "missing $dir/manifest.json" }
          $manifest = Get-Content "$dir/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 2) { throw "unexpected manifest schema" }
          if ($manifest.artifact.id -ne $id) { throw "artifact id mismatch" }
          $zip = "target/funasr-runtime/$id-v$env:RUNTIME_VERSION.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "target/funasr-runtime/SHA256SUMS-$id.txt"
          "$hash  $(Split-Path $zip -Leaf)" | Out-File $checksum -Encoding ascii
          New-Item -ItemType Directory -Force target/upload | Out-Null
          Copy-Item $zip target/upload/
          Copy-Item $checksum target/upload/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: funasr-runtime-${{ matrix.flavor }}-${{ env.RUNTIME_VERSION }}
          path: |
            target/upload/*.zip
            target/upload/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Publish immutable runtime release
    needs: build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: funasr-runtime-*-${{ env.RUNTIME_VERSION }}
          path: publish
          merge-multiple: true

      - name: Publish versioned release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "funasr-runtime-v$env:RUNTIME_VERSION"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "immutable runtime release already exists: $tag" }
          $assets = @(Get-ChildItem publish -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -lt 6) { throw "expected three zip assets and three checksum assets" }
          gh release create $tag $assets --repo "${{ github.repository }}" --title "Blink FunASR runtime $env:RUNTIME_VERSION" --notes "Immutable FunASR/llama.cpp runtime artifacts. See each manifest and SHA256SUMS file." --prerelease
