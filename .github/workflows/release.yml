name: Release

permissions:
  contents: write

# 两种触发方式：
#   1. 推送 v* tag → 自动构建并创建草稿 Release
#   2. Actions 页手动 Run workflow → 传入已存在的 tag（如 v0.2.0）重新构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建/发布的已存在 tag（如 v0.2.0）'
        required: true
        type: string

jobs:
  publish:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动触发时 checkout 指定 tag；tag push 时默认即该 tag
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'  # workspace root（根目录 Cargo.toml 即 workspace）

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      # ── 编译 Rust 插件（独立 step，日志清晰、命中 rust-cache）──────────────
      # echo/ip/weather 编译为 release exe 并拷贝到 plugins/builtin/<id>/bin/。
      # 这些 *.exe 不入 git，必须现场生成；tauri 打包时作为 resources 随 MSI/NSIS。
      - name: 编译 Rust 插件
        run: cargo xtask plugins

      - name: 拷贝插件到 bin
        run: cargo xtask copy

      # ── 同步版本号：用 Git Tag 覆盖 tauri.conf.json 中的版本 ───────────────────
      - name: Sync version from Git tag
        shell: bash
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          echo "同步版本号为: $VERSION"

          # 用 PowerShell 修改 tauri.conf.json
          powershell -Command "
            \$content = Get-Content 'tauri.conf.json' -Raw | ConvertFrom-Json
            \$content.version = '$VERSION'
            \$content | ConvertTo-Json -Depth 10 | Set-Content 'tauri.conf.json' -NoNewline
          "

          # 验证修改
          cat tauri.conf.json | grep version

      # ── 构建 ───────────────────────
      - name: Build Tauri app
        run: cargo tauri build

      # ── 验证产物 ────────────────────────────────────────────────────────────
      - name: 列出构建产物
        run: |
          echo "=== 查找 MSI ==="
          dir target\release\bundle\msi\*.msi 2>$null || echo "未找到 MSI"
          echo "=== 查找 NSIS ==="
          dir target\release\bundle\nsis\*.exe 2>$null || echo "未找到 EXE"

      # ── 创建/更新 Release 并上传产物（使用官方 action，更可靠）────────────────
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 'Blink ${{ inputs.tag || github.ref_name }}'
          body: |
            ## Blink ${{ inputs.tag || github.ref_name }}

            ### 下载
            - **MSI 安装包**（`.msi`）：推荐，标准 Windows 安装程序
            - **NSIS 安装包**（`-setup.exe`）：轻量安装程序

            > 首次运行未签名，Windows SmartScreen 可能拦截，点击「更多信息 → 仍要运行」即可。

            ### 更新日志
            见下方自动生成的 Release Notes。
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
