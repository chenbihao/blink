name: Release

permissions:
  contents: write

# 两种触发方式：
#   1. 推送 v* tag → 自动构建并创建草稿 Release
#   2. Actions 页手动 Run workflow → 传入已存在的 tag（如 v0.2.0）重新构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建/发布的已存在 tag（如 v0.2.0）'
        required: true
        type: string

jobs:
  publish:
    name: Build & Release
    # FunASR/llama.cpp worker 的已验证工具链；避免 windows-latest 漂移到新 VS。
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动触发时 checkout 指定 tag；tag push 时默认即该 tag
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'  # workspace root（根目录 Cargo.toml 即 workspace）

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.11.4" --locked

      # ── 同步版本号：用 Git Tag 同时覆盖 tauri.conf.json 和 Cargo.toml 中的版本 ──
      - name: Sync version from Git tag
        shell: bash
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          echo "同步版本号为: $VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

          # 用 PowerShell 修改 tauri.conf.json
          powershell -Command "
            \$content = Get-Content 'tauri.conf.json' -Raw | ConvertFrom-Json
            \$content.version = '$VERSION'
            \$content | ConvertTo-Json -Depth 10 | Set-Content 'tauri.conf.json' -NoNewline
          "

          # 同步 Cargo.toml（[package] 段的 version 字段）
          sed -i '0,/^version\s*=\s*".*"/s//version = "'"$VERSION"'"/' Cargo.toml

          # 验证修改
          echo "--- tauri.conf.json ---"
          grep '"version"' tauri.conf.json | head -1
          echo "--- Cargo.toml ---"
          grep '^version' Cargo.toml | head -1

      # 本地与 CI 共用唯一发布入口：worker → 插件 → 校验 → Tauri 打包。
      - name: Build release
        run: cargo xtask release

      # ── 验证产物 ────────────────────────────────────────────────────────────
      - name: 校验构建产物
        id: release-artifacts
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -Path "target/release/bundle/msi/Blink_${env:RELEASE_VERSION}_*.msi" -File -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem -Path "target/release/bundle/nsis/Blink_${env:RELEASE_VERSION}_*-setup.exe" -File -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 1) { throw "当前版本 MSI 数量异常：$($msi.Count)" }
          if ($nsis.Count -ne 1) { throw "当前版本 NSIS 数量异常：$($nsis.Count)" }
          "msi=$($msi[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "nsis=$($nsis[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "MSI: $($msi[0].FullName)"
          Write-Host "NSIS: $($nsis[0].FullName)"

      # ── 创建/更新 Release 并上传产物（使用官方 action，更可靠）────────────────
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 'Blink ${{ inputs.tag || github.ref_name }}'
          body: |
            ## Blink ${{ inputs.tag || github.ref_name }}

            ### 下载
            - **MSI 安装包**（`.msi`）：标准 Windows 安装程序
            - **NSIS 安装包**（`-setup.exe`）：轻量安装程序

            > 首次运行未签名，Windows SmartScreen 可能拦截，点击「更多信息 → 仍要运行」即可。

            ### 更新日志
            
            见下方自动生成的 Release Notes。
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release-artifacts.outputs.msi }}
            ${{ steps.release-artifacts.outputs.nsis }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
