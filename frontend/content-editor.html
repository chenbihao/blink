<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>编辑内容</title>
    <link href="css/entries/content-editor.css" rel="stylesheet"/>
</head>
<body>
<div class="editor-root">
    <!-- 顶部一体化区域（0.23.7）：任务标题 + 来源信息 + 原文/MD 切换 + 更多 + 窗口控制
         同处一条 40px 顶栏，只有一层背景/描边，不再拆成 titlebar + toolbar 两层。 -->
    <header class="editor-header" data-tauri-drag-region>
        <div class="editor-header-main" data-tauri-drag-region>
            <span class="editor-titlebar-title" data-tauri-drag-region id="editor-title">编辑内容</span>
            <!-- 来源信息（空白/剪贴板/便签/选区/能力结果），随会话快照刷新 -->
            <span class="editor-source-chip hidden" id="editor-source"></span>
        </div>
        <div class="editor-header-tools">
            <!-- 0.23.1：原文/MD 双视图切换（同一文本的双视图，风险门在 JS 侧拦截） -->
            <div class="editor-view-switch" id="editor-view-switch" role="tablist">
                <button aria-controls="editor-textarea" aria-selected="true" class="editor-view-btn is-active"
                        data-i18n="editor.view.source" id="btn-view-source" role="tab" tabindex="0"
                        type="button">原文
                </button>
                <button aria-controls="editor-tiptap-container" aria-selected="false" class="editor-view-btn"
                        data-i18n="editor.view.markdown" id="btn-view-md" role="tab" tabindex="-1"
                        type="button">MD
                </button>
            </div>
            <!-- 修复：无法保证无损修改的 MD 结构安全降级为只读预览（明确提示原因） -->
            <span class="editor-readonly-badge hidden" id="md-readonly-badge" role="note"
                  data-i18n="editor.md.readOnlyBadge" data-i18n-title="editor.md.readOnly"
                  title="MD 只读预览">只读预览</span>
        </div>
        <div class="editor-header-window">
            <!-- 0.23.2：更多动作（保存到/另存副本/复制/创建便签/发送到 AI 对话） -->
            <div class="editor-menu-anchor">
                <button aria-controls="more-menu" aria-expanded="false" aria-haspopup="menu"
                        aria-label="更多操作" class="editor-more-btn" data-i18n-aria-label="editor.more"
                        data-i18n-title="editor.more" id="btn-more" title="更多操作" type="button">
                    <svg class="icon">
                        <use href="#icon-ellipsis"/>
                    </svg>
                </button>
                <div class="editor-more-menu hidden" id="more-menu" role="menu"></div>
            </div>
            <div class="editor-titlebar-btns">
                <button aria-label="最小化" class="editor-titlebar-btn" data-i18n-aria-label="window.minimize"
                        data-i18n-title="window.minimize" id="titlebar-minimize" title="最小化" type="button">
                    <svg aria-hidden="true" class="icon">
                        <use href="#icon-chevron-down"/>
                    </svg>
                </button>
                <button aria-label="最大化" class="editor-titlebar-btn" data-i18n-aria-label="window.maximize"
                        data-i18n-title="window.maximize" id="titlebar-maximize" title="最大化" type="button">
                    <svg class="icon">
                        <use href="#icon-square"/>
                    </svg>
                </button>
                <button aria-label="关闭" class="editor-titlebar-btn editor-titlebar-btn-close"
                        data-i18n-aria-label="common.close" data-i18n-title="common.close" id="titlebar-close"
                        title="关闭" type="button">
                    <svg class="icon">
                        <use href="#icon-x"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- MD 格式工具栏（与便签共用 components/md-toolbar.css；仅 MD 视图占一行） -->
    <div class="md-toolbar editor-md-toolbar" hidden id="md-toolbar"></div>

    <!-- Editor body -->
    <div class="editor-body">
        <!-- 纯文本编辑区（format=plain 时使用） -->
        <textarea aria-label="编辑内容" aria-labelledby="btn-view-source" class="editor-textarea" data-i18n-aria-label="editor.body"
                  data-i18n-ph="editor.placeholder" id="editor-textarea" role="tabpanel"
                  placeholder="输入或编辑内容..." spellcheck="false"></textarea>
        <!-- Tiptap IR 编辑器容器（0.18.3：format=markdown 时使用，替换 Cherry 双栏） -->
        <div aria-label="Markdown 编辑内容" aria-labelledby="btn-view-md" class="editor-tiptap-container"
             data-i18n-aria-label="editor.bodyMarkdown" hidden id="editor-tiptap-container" role="tabpanel"></div>
    </div>

    <!-- 0.23.3：本次听写动作（定位/整理）+ 0.23.4：整理选中入口（按上下文出现）
         0.23.7：由第二条完整横栏改为 footer 上方轻量浮层——不占布局高度，
         出现/消失不会改变正文可视高度。 -->
    <div class="editor-voice-chips hidden" id="voice-chips">
        <button class="editor-chip" id="chip-locate" type="button"></button>
        <button class="editor-chip" id="chip-tidy" type="button"></button>
        <button class="editor-chip" id="chip-tidy-selection" type="button"></button>
        <button class="editor-chip editor-chip-dismiss" id="chip-dismiss" type="button"
                data-i18n-aria-label="editor.voice.dismiss" data-i18n-title="editor.voice.dismiss" title="关闭">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-x"/>
            </svg>
        </button>
    </div>

    <!-- 0.23.4：整理候选卡（非模态，完成事件驱动；未经确认不改正文 §3.7） -->
    <aside aria-labelledby="transform-title" aria-live="polite" class="editor-diff-card hidden"
           id="transform-card" role="region">
        <div class="editor-diff-head">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-sparkles"/>
            </svg>
            <span class="editor-diff-title" id="transform-title"></span>
            <button aria-label="关闭" class="editor-diff-close"
                    data-i18n-aria-label="editor.transform.close" data-i18n-title="editor.transform.close"
                    id="transform-close" title="关闭" type="button">
                <svg aria-hidden="true" class="icon">
                    <use href="#icon-x"/>
                </svg>
            </button>
        </div>
        <div class="editor-diff-stale hidden" id="transform-stale"></div>
        <div class="editor-diff-body" id="transform-body"></div>
        <div class="editor-diff-actions">
            <button class="editor-diff-btn editor-diff-btn-primary" id="transform-apply" type="button"></button>
            <button class="editor-diff-btn" id="transform-copy" type="button"></button>
            <button class="editor-diff-btn" id="transform-discard" type="button"></button>
            <span class="editor-diff-hint" id="transform-hint"></span>
        </div>
    </aside>

    <!-- 0.23.2：底部保存区——单一稳定命令栏（0.23.7）
         左：目标信息 + 紧邻目标的 dirty 点；中：保存/处理状态；右：录音 + 保存。 -->
    <footer class="editor-savebar">
        <div class="editor-savebar-left">
            <span class="editor-target-zone" id="target-zone" title="">
                <svg class="icon" id="target-icon">
                    <use href="#icon-copy"/>
                </svg>
                <span class="editor-target-label" id="target-label"></span>
            </span>
            <span class="editor-dirty-dot hidden" id="dirty-dot"></span>
        </div>
        <span aria-atomic="true" aria-live="polite" class="editor-status" id="editor-status" role="status"></span>
        <div class="editor-savebar-right">
            <!-- 0.23.3：常驻连续听写按钮（§3.8） -->
            <button aria-label="连续听写" aria-pressed="false" class="editor-mic-btn"
                    data-i18n-aria-label="editor.voice.start" data-i18n-title="editor.voice.start" id="btn-mic"
                    title="连续听写" type="button">
                <svg aria-hidden="true" class="icon">
                    <use href="#icon-mic"/>
                </svg>
            </button>
            <button class="editor-save-btn" id="btn-save" type="button"></button>
        </div>
    </footer>
</div>

<!-- Vendor -->
<!-- Tiptap IIFE（0.18.3：替换 Cherry Markdown 双栏，改为 IR 即时渲染） -->
<script src="vendor/tiptap.bundle.min.js"></script>

<!-- 入口 -->
<script src="js/content-editor/main.js" type="module"></script>
</body>
</html>
