<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>编辑内容</title>
    <link href="css/entries/content-editor.css" rel="stylesheet"/>
</head>
<body>
<div class="editor-root">
    <!-- Titlebar（无边框窗口自绘标题栏） -->
    <div class="editor-titlebar" data-tauri-drag-region>
        <span class="editor-titlebar-title" data-tauri-drag-region id="editor-title">编辑内容</span>
        <div class="editor-titlebar-btns">
            <button class="editor-titlebar-btn" id="titlebar-minimize" title="最小化">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <line x1="5" x2="19" y1="12" y2="12"/>
                </svg>
            </button>
            <button class="editor-titlebar-btn" id="titlebar-maximize" title="最大化">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect height="14" rx="2" width="14" x="5" y="5"/>
                </svg>
            </button>
            <button class="editor-titlebar-btn editor-titlebar-btn-close" id="titlebar-close" title="关闭">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <line x1="6" x2="18" y1="6" y2="18"/>
                    <line x1="6" x2="18" y1="18" y2="6"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="editor-toolbar">
        <div class="editor-toolbar-left">
            <!-- 0.23.1：原文/MD 双视图切换（同一文本的双视图，风险门在 JS 侧拦截） -->
            <div class="editor-view-switch" id="editor-view-switch" role="tablist">
                <button class="editor-view-btn is-active" data-i18n="editor.view.source" id="btn-view-source"
                        type="button">原文
                </button>
                <button class="editor-view-btn" data-i18n="editor.view.markdown" id="btn-view-md" type="button">MD
                </button>
            </div>
            <!-- MD 格式工具栏（与便签共用 components/md-toolbar.css；MD 视图时展示） -->
            <div class="md-toolbar editor-md-toolbar" hidden id="md-toolbar"></div>
        </div>
        <div class="editor-toolbar-right">
            <!-- 0.23.2：更多动作（保存到/另存副本/复制/创建便签/发送到 AI 对话） -->
            <div class="editor-menu-anchor">
                <button class="editor-more-btn" data-i18n-title="editor.more" id="btn-more" title="更多操作"
                        type="button">
                    <svg class="icon">
                        <use href="#icon-ellipsis"/>
                    </svg>
                </button>
                <div class="editor-more-menu hidden" id="more-menu" role="menu"></div>
            </div>
        </div>
    </div>

    <!-- Editor body -->
    <div class="editor-body">
        <!-- 纯文本编辑区（format=plain 时使用） -->
        <textarea class="editor-textarea" data-i18n-ph="editor.placeholder" id="editor-textarea"
                  placeholder="输入或编辑内容..." spellcheck="false"></textarea>
        <!-- Tiptap IR 编辑器容器（0.18.3：format=markdown 时使用，替换 Cherry 双栏） -->
        <div class="editor-tiptap-container" hidden id="editor-tiptap-container"></div>
    </div>

    <!-- 0.23.3：本次听写动作（定位/整理，录音结束且存在追加范围时出现） -->
    <div class="editor-voice-chips hidden" id="voice-chips">
        <button class="editor-chip" id="chip-locate" type="button"></button>
        <button class="editor-chip" id="chip-tidy" type="button"></button>
        <button class="editor-chip editor-chip-dismiss" id="chip-dismiss" type="button"
                data-i18n-title="editor.voice.dismiss" title="关闭">
            <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="6" x2="18" y1="6" y2="18"/>
                <line x1="6" x2="18" y1="18" y2="6"/>
            </svg>
        </button>
    </div>

    <!-- 0.23.2：底部保存区——当前保存目标 + 保存（§3.8：主保存区始终显示真实去向） -->
    <footer class="editor-savebar">
        <span class="editor-target-zone" id="target-zone" title="">
            <svg class="icon" id="target-icon">
                <use href="#icon-copy"/>
            </svg>
            <span class="editor-target-label" id="target-label"></span>
        </span>
        <span class="editor-dirty-dot hidden" id="dirty-dot"></span>
        <span class="editor-status" id="editor-status"></span>
        <!-- 0.23.3：常驻连续听写按钮（§3.8） -->
        <button class="editor-mic-btn" data-i18n-title="editor.voice.start" id="btn-mic" title="连续听写"
                type="button">
            <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
        </button>
        <button class="editor-save-btn" id="btn-save" type="button"></button>
    </footer>
</div>

<!-- Vendor -->
<!-- Tiptap IIFE（0.18.3：替换 Cherry Markdown 双栏，改为 IR 即时渲染） -->
<script src="vendor/tiptap.bundle.min.js"></script>

<!-- 入口 -->
<script src="js/content-editor/main.js" type="module"></script>
</body>
</html>
