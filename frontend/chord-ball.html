<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink Chord</title>
    <link rel="stylesheet" href="css/entries/chord-ball.css" />
  </head>
  <body>
    <div id="ball">划词翻译</div>
    <script type="module">
      import { confirmChordSelection, pollChordSelection } from "./js/api.js";

      const ball = document.getElementById("ball");
      let resolved = false;

      // 点球 → 读选区缓存 + 主窗显示翻译结果 + 球 hide
      ball.addEventListener("click", () => {
        confirmChordSelection();
      });

      // 轮询选区：200ms 一次，检测划词是否成功
      const pollId = setInterval(async () => {
        if (resolved) return;
        try {
          const text = await pollChordSelection();
          if (text) {
            resolved = true;
            clearInterval(pollId);
            ball.classList.add("ready");
            ball.textContent = "已选词";
          }
        } catch (_) { /* ignore */ }
      }, 200);

      // 清理：窗口隐藏/关闭时停止轮询
      window.addEventListener("beforeunload", () => clearInterval(pollId));
    </script>
  </body>
</html>
