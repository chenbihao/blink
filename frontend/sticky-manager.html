<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>便签管理</title>
    <link href="css/entries/sticky-manager.css" rel="stylesheet"/>
</head>
<body>
<div class="manager-root">
    <!-- Titlebar -->
    <div class="manager-titlebar" data-tauri-drag-region>
        <span class="manager-titlebar-title" data-tauri-drag-region>便签管理</span>
        <div class="manager-titlebar-btns">
            <button class="manager-titlebar-btn" id="titlebar-minimize" title="最小化">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <line x1="5" x2="19" y1="12" y2="12"/>
                </svg>
            </button>
            <button class="manager-titlebar-btn" id="titlebar-maximize" title="最大化">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect height="14" rx="2" width="14" x="5" y="5"/>
                </svg>
            </button>
            <button class="manager-titlebar-btn manager-titlebar-btn-close" id="titlebar-close" title="关闭">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <line x1="6" x2="18" y1="6" y2="18"/>
                    <line x1="6" x2="18" y1="18" y2="6"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="manager-toolbar">
        <div class="manager-tabs">
            <button class="manager-tab active" data-tab="active" id="tab-active">便签</button>
            <button class="manager-tab" data-tab="trash" id="tab-trash">回收站</button>
        </div>
        <div class="manager-toolbar-right">
            <button class="manager-new-btn" id="btn-new-sticky">
                <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24">
                    <line x1="12" x2="12" y1="5" y2="19"/>
                    <line x1="5" x2="19" y1="12" y2="12"/>
                </svg>
                <span>新建</span>
            </button>
            <button class="manager-clear-trash-btn" hidden id="btn-clear-trash">清空回收站</button>
        </div>
    </div>

    <!-- Active list -->
    <div class="manager-list" id="sticky-list"></div>

    <!-- Trash list -->
    <div class="manager-list" hidden id="trash-list"></div>

    <!-- Empty state -->
    <div class="manager-empty" hidden id="empty-state">
        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
             viewBox="0 0 24 24">
            <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
            <path d="M5 8V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/>
        </svg>
        <p class="manager-empty-text" id="empty-text">还没有便签</p>
        <button class="manager-empty-btn" id="btn-empty-new">新建便签</button>
    </div>
</div>

<!-- Entry -->
<script src="js/sticky-manager/main.js" type="module"></script>
</body>
</html>
