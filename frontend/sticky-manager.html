<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>便签管理</title>
  <link rel="stylesheet" href="css/entries/sticky-manager.css" />
</head>
<body>
  <div class="manager-root">
    <!-- Titlebar -->
    <div class="manager-titlebar" data-tauri-drag-region>
      <span class="manager-titlebar-title" data-tauri-drag-region>便签管理</span>
      <div class="manager-titlebar-btns">
        <button class="manager-titlebar-btn" id="titlebar-minimize" title="最小化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="manager-titlebar-btn" id="titlebar-maximize" title="最大化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        </button>
        <button class="manager-titlebar-btn manager-titlebar-btn-close" id="titlebar-close" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="manager-toolbar">
      <button class="manager-new-btn" id="btn-new-sticky">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>新建便签</span>
      </button>
      <span class="manager-count" id="sticky-count"></span>
    </div>

    <!-- List -->
    <div class="manager-list" id="sticky-list"></div>

    <!-- Empty state -->
    <div class="manager-empty" id="empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
        <path d="M5 8V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/>
      </svg>
      <p class="manager-empty-text">还没有便签</p>
      <button class="manager-empty-btn" id="btn-empty-new">新建便签</button>
    </div>
  </div>

  <!-- Entry -->
  <script type="module" src="js/sticky-manager/main.js"></script>
</body>
</html>
