<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Blink Screenshot</title>
    <link rel="stylesheet" href="css/entries/chord-screenshot.css" />
  </head>
  <body>
    <!-- 主 canvas：全屏截图 + 暗色蒙版 + 亮区 -->
    <canvas id="canvas"></canvas>

    <!-- 标注 canvas：覆盖在裁剪区上，显示标注内容（0.11.7-b） -->
    <canvas id="annot-canvas"></canvas>

    <!-- 选区尺寸提示 -->
    <div id="size-hint"></div>

    <!-- 错误提示 -->
    <div id="error-hint"></div>

    <!-- 工具栏（0.11.7-a/b，0.11.8 收起化）：选区完成后显示 -->
    <div id="toolbar" role="toolbar" aria-label="截图工具栏">
      <!-- 图形下拉（默认框选）：矩形/椭圆/箭头/铅笔 -->
      <div class="dropdown-wrap">
        <button class="tool-btn dropdown-trigger active" id="tool-trigger" title="标注工具">
          <span id="tool-trigger-icon">▭</span><span class="caret">▾</span>
        </button>
        <div class="dropdown" id="tool-dropdown" data-open="false">
          <button class="dropdown-item active" data-tool="rect"><span class="item-icon">▭</span><span class="item-label">矩形</span></button>
          <button class="dropdown-item" data-tool="ellipse"><span class="item-icon">○</span><span class="item-label">椭圆</span></button>
          <button class="dropdown-item" data-tool="arrow"><span class="item-icon">➘</span><span class="item-label">箭头</span></button>
          <button class="dropdown-item" data-tool="pencil"><span class="item-icon">✎</span><span class="item-label">铅笔</span></button>
        </div>
      </div>

      <!-- 文本（一级按钮，单击直接选中） -->
      <button class="tool-btn tool-direct" data-tool="text" title="文本">A</button>

      <!-- 模糊下拉（默认马赛克）：马赛克/涂抹 -->
      <div class="dropdown-wrap">
        <button class="tool-btn dropdown-trigger" id="blur-trigger" title="模糊工具">
          <span id="blur-trigger-icon">🗯</span><span class="caret">▾</span>
        </button>
        <div class="dropdown" id="blur-dropdown" data-open="false">
          <button class="dropdown-item active" data-tool="pixelate"><span class="item-icon">🗯</span><span class="item-label">马赛克</span></button>
          <button class="dropdown-item" data-tool="mosaic"><span class="item-icon">▦</span><span class="item-label">涂抹</span></button>
        </div>
      </div>

      <!-- 橡皮擦（一级按钮） -->
      <button class="tool-btn tool-direct" data-tool="eraser" title="橡皮擦">⌫</button>

      <div class="toolbar-divider"></div>

      <!-- 颜色下拉触发器 -->
      <div class="dropdown-wrap">
        <button class="tool-btn dropdown-trigger" id="color-trigger" title="颜色">
          <span class="color-dot" id="color-trigger-dot" style="color:#ff0000">●</span><span class="caret">▾</span>
        </button>
        <div class="dropdown dropdown-color" id="color-dropdown" data-open="false">
          <div class="color-grid">
            <button class="color-swatch active" data-color="#ff0000" title="红色" style="color:#ff0000">●</button>
            <button class="color-swatch" data-color="#ff8c00" title="橙色" style="color:#ff8c00">●</button>
            <button class="color-swatch" data-color="#ffd700" title="黄色" style="color:#ffd700">●</button>
            <button class="color-swatch" data-color="#00cc00" title="绿色" style="color:#00cc00">●</button>
            <button class="color-swatch" data-color="#00cccc" title="青色" style="color:#00cccc">●</button>
            <button class="color-swatch" data-color="#0088ff" title="蓝色" style="color:#0088ff">●</button>
            <button class="color-swatch" data-color="#aa44ff" title="紫色" style="color:#aa44ff">●</button>
            <button class="color-swatch" data-color="#ffffff" title="白色" style="color:#ffffff">●</button>
          </div>
          <label class="custom-color-row" title="自定义颜色">
            <span class="item-label">自定义</span>
            <input type="color" id="color-picker" class="color-input" value="#ff0000" />
          </label>
        </div>
      </div>

      <!-- 粗细下拉触发器 -->
      <div class="dropdown-wrap">
        <button class="tool-btn dropdown-trigger" id="width-trigger" title="粗细">
          <span id="width-trigger-icon">━</span><span class="caret">▾</span>
        </button>
        <div class="dropdown" id="width-dropdown" data-open="false">
          <button class="dropdown-item" data-width="2"><span class="item-icon">──</span><span class="item-label">细</span></button>
          <button class="dropdown-item active" data-width="4"><span class="item-icon">━</span><span class="item-label">中</span></button>
          <button class="dropdown-item" data-width="8"><span class="item-icon">━━</span><span class="item-label">粗</span></button>
        </div>
      </div>

      <div class="toolbar-divider"></div>

      <!-- 操作区 -->
      <div class="toolbar-group" data-group="ops">
        <button class="tool-btn" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>↶</button>
        <button class="tool-btn" id="btn-redo" title="重做 (Ctrl+Y)" disabled>↷</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- 输出区 -->
      <div class="toolbar-group" data-group="output">
        <button class="tool-btn" id="btn-ocr" title="OCR 文字识别">🔍</button>
        <button class="tool-btn" id="btn-save" title="保存为文件">💾</button>
        <button class="tool-btn" id="btn-pin" title="钉图">📌</button>
        <button class="tool-btn tool-btn-primary" id="btn-copy" title="复制 (双击选区)">✓</button>
        <button class="tool-btn" id="btn-cancel" title="取消 (ESC)">✕</button>
      </div>
    </div>

    <script type="module" src="js/chord-screenshot.js"></script>
  </body>
</html>
