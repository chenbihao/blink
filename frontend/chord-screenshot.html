<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>Blink Screenshot</title>
    <link href="css/entries/chord-screenshot.css" rel="stylesheet"/>
</head>
<body>
<!-- 主 canvas：静态底图层——截图原图，只在 session 初始化/来源切换时绘制 -->
<canvas id="canvas"></canvas>

<!-- 0.20.5：动态交互层——选区外遮罩、边框、手柄、尺寸提示，拖动/缩放只清理此层 -->
<canvas id="interaction-canvas"></canvas>

<!-- 标注 canvas：覆盖在裁剪区上，显示标注内容（0.11.7-b） -->
<canvas class="hidden" id="annot-canvas"></canvas>

<!-- OCR 命中 canvas（0.11.9-c）：阅读模式下画 word 高亮层 -->
<canvas aria-hidden="true" id="ocr-hit-canvas"></canvas>

<!-- 选区尺寸提示 -->
<div class="hidden" id="size-hint"></div>

<!-- 错误提示 -->
<div class="hidden" id="error-hint"></div>

<!-- 0.20.6：精调状态提示（取色冻结/跟随模式提示） -->
<div class="precision-hint hidden" id="precision-hint"></div>

<!-- 选区中央加载转圈（OCR/翻译进行中） -->
<div class="sel-loading" hidden id="sel-loading">
    <div class="sel-loading-spinner"></div>
    <span class="sel-loading-text"></span>
</div>

<!-- 笔画预览虚圈（0.11.8-c）：铅笔/荧光笔/橡皮擦 hover 时显示笔尖大小 -->
<div aria-hidden="true" class="stroke-cursor" id="stroke-cursor"></div>

<!-- 0.15.8：像素放大镜——选区拖拽阶段跟随鼠标，显示 9×16 像素网格 + 坐标 + 色值 -->
<div aria-hidden="true" class="pixel-magnifier hidden" id="pixel-magnifier">
    <canvas class="pm-grid" height="81" width="144"></canvas>
    <div class="pm-info">
        <span class="pm-coord"></span>
        <span class="pm-color"><span aria-hidden="true" class="pm-color-swatch"></span><span
                class="pm-color-text"></span></span>
        <span class="pm-hint">Shift 切换格式</span>
        <span class="pm-hint">C 复制颜色</span>
    </div>
</div>

<!-- 0.15.7：长截图专属工具栏（拼接中阶段显示，默认隐藏） -->
<div aria-label="长截图工具栏" class="scroll-toolbar hidden" id="scroll-toolbar" role="toolbar">
    <button class="tool-btn hidden" id="scroll-direction" title="当前仅支持纵向长截图">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-rectangle-vertical"/>
        </svg>
    </button>
    <button class="tool-btn" id="scroll-auto" title="自动滚动">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-gallery-vertical-end"/>
        </svg>
    </button>
    <button class="tool-btn" id="scroll-edit" title="编辑长图">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-pencil-sparkles"/>
        </svg>
    </button>
    <div class="toolbar-divider"></div>
    <button class="tool-btn" id="scroll-pin" title="钉图">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-pin"/>
        </svg>
    </button>
    <button class="tool-btn" id="scroll-save" title="保存为文件">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-save"/>
        </svg>
    </button>
    <button class="tool-btn tool-btn-primary" id="scroll-copy" title="复制长图">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-check"/>
        </svg>
    </button>
    <button class="tool-btn" id="scroll-cancel" title="取消">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-x"/>
        </svg>
    </button>
</div>

<!-- 0.15.7：长截图实时预览缩略图（右侧 fixed 定位） -->
<canvas aria-hidden="true" class="scroll-preview hidden" height="200" id="scroll-preview" width="120"></canvas>

<div aria-live="polite" class="scroll-diagnostics hidden" id="scroll-diagnostics">
    <span id="scroll-diagnostics-text">等待首帧</span>
    <button id="scroll-diagnostics-export" type="button">导出回放</button>
</div>

<!-- 长截图采集边界：overlay 已从 BitBlt 排除，仅用于范围提示。 -->
<div aria-hidden="true" class="scroll-capture-frame hidden" id="scroll-capture-frame"></div>

<!-- 工具栏（0.11.7-a/b，0.11.8-a 分组重组 + 圆润化 + 拖动 handle） -->
<div aria-label="截图工具栏" class="hidden" id="toolbar" role="toolbar">
    <!-- 拖动 handle（左侧）：mousedown 拖动整条工具栏 -->
    <div class="toolbar-drag-handle" id="toolbar-drag" title="拖动工具栏">
        <span class="drag-dots"></span>
    </div>

    <div class="toolbar-divider"></div>

    <!-- 选取工具（0.11.10-a/k）：默认工具，负责选区重选、移动和缩放。
         有识别结果时，选区内文字由 #ocr-hit-canvas 优先承接拖选；边缘仍保留缩放热区。
         切到其它工具时把 #ocr-hit-canvas pointer-events 让渡给标注层。 -->
    <button class="tool-btn tool-direct active" data-tool="select" id="select-main" title="选取（默认） Alt+`">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-mouse-pointer-2"/>
        </svg>
        <span class="kbd-hint">`</span></button>

    <div class="toolbar-divider"></div>

    <!-- 图形分组：矩形/椭圆
         0.15.8-fix：移除 caret，改为 hover 自动展开 dropdown
         按住 Shift 时约束长宽等比（矩形→正方形、椭圆→圆） -->
    <!-- 0.15.8-fix：移除 caret 按钮，改为 hover 自动展开 dropdown -->
    <div class="dropdown-wrap">
        <button class="tool-btn split-main" data-tool="rect" id="shape-main" title="图形 Alt+1">
            <span id="shape-main-icon"><svg aria-hidden="true" class="icon"><use href="#icon-square"/></svg></span>
            <span class="kbd-hint">1</span>
        </button>
        <div class="dropdown" data-open="false" id="shape-dropdown">
            <button class="dropdown-item active" data-tool="rect"><span class="item-icon"><svg aria-hidden="true"
                                                                                               class="icon"><use
                    href="#icon-square"/></svg></span><span class="item-label">矩形</span></button>
            <button class="dropdown-item" data-tool="ellipse"><span class="item-icon"><svg aria-hidden="true"
                                                                                           class="icon"><use
                    href="#icon-circle"/></svg></span><span class="item-label">椭圆</span></button>
            <div class="dropdown-separator"></div>
            <button class="dropdown-item" data-tool="spotlight"><span class="item-icon"><svg aria-hidden="true"
                                                                                             class="icon"><use
                    href="#icon-spotlight"/></svg></span><span class="item-label">聚光灯</span></button>
            <button class="dropdown-item" data-tool="spotlight-multi"><span class="item-icon"><svg aria-hidden="true"
                                                                                                   class="icon"><use
                    href="#icon-spotlight"/></svg></span><span class="item-label">多次聚光灯</span></button>
            <button class="dropdown-item" data-tool="magnifier"><span class="item-icon"><svg aria-hidden="true"
                                                                                             class="icon"><use
                    href="#icon-search"/></svg></span><span class="item-label">局部放大</span></button>
            <div class="dropdown-separator magnifier-zoom-sep" hidden></div>
            <div class="magnifier-zoom-row" hidden>
                <span class="wm-label">倍率</span>
                <button class="mode-btn zoom-btn active" data-zoom="1.3">1.3×</button>
                <button class="mode-btn zoom-btn" data-zoom="1.5">1.5×</button>
                <button class="mode-btn zoom-btn" data-zoom="2.0">2.0×</button>
            </div>
        </div>
    </div>

    <!-- 画笔分组：铅笔/箭头/荧光笔（正片叠底/半透明）
         0.15.0：箭头从一级默认降为下拉子项，画笔（pencil）作组默认
         0.15.8-fix：hover 自动展开 -->
    <div class="dropdown-wrap">
        <button class="tool-btn split-main" data-tool="pencil" id="stroke-main" title="画笔 Alt+2">
            <span id="stroke-main-icon"><svg aria-hidden="true" class="icon"><use href="#icon-pencil"/></svg></span>
            <span class="kbd-hint">2</span>
        </button>
        <div class="dropdown" data-open="false" id="stroke-dropdown">
            <button class="dropdown-item active" data-tool="pencil"><span class="item-icon"><svg aria-hidden="true"
                                                                                                 class="icon"><use
                    href="#icon-pencil"/></svg></span><span class="item-label">铅笔</span></button>
            <button class="dropdown-item" data-tool="arrow"><span class="item-icon"><svg aria-hidden="true"
                                                                                         class="icon"><use
                    href="#icon-move-up-right"/></svg></span><span class="item-label">箭头</span></button>
            <button class="dropdown-item" data-tool="highlight-multiply"><span class="item-icon"><svg aria-hidden="true"
                                                                                                      class="icon"><use
                    href="#icon-ticket-slash"/></svg></span><span class="item-label">荧光笔・正片叠底</span></button>
            <button class="dropdown-item" data-tool="highlight-translucent"><span class="item-icon"><svg aria-hidden="true"
                                                                                                         class="icon"><use
                    href="#icon-ticket-slash"/></svg></span><span class="item-label">荧光笔・半透明</span></button>
        </div>
    </div>

    <!-- 文字分组：文本/数字标号/水印
         0.15.11：二级菜单内容移至工具栏下方 sub-panel，hover dropdown 只保留工具选择
         0.15.8-fix：hover 自动展开 -->
    <div class="dropdown-wrap">
        <button class="tool-btn split-main" data-tool="text" id="text-main" title="文字 Alt+3">
            <span id="text-main-icon">A</span>
            <span class="kbd-hint">3</span>
        </button>
        <div class="dropdown dropdown-text" data-open="false" id="text-dropdown">
            <!-- 0.15.14：移除多余的 dropdown-view 包裹，与其他 dropdown 结构一致 -->
            <button class="dropdown-item active" data-tool="text"><span class="item-icon">A</span><span
                    class="item-label">文本</span></button>
            <button class="dropdown-item" data-tool="number"><span class="item-icon">#</span><span class="item-label">数字标号</span>
            </button>
            <button class="dropdown-item" data-tool="watermark"><span class="item-icon"><svg aria-hidden="true"
                                                                                             class="icon"><use
                    href="#icon-stamp"/></svg></span><span class="item-label">水印</span></button>
        </div>
    </div>

    <!-- 马赛克分组：马赛克/高斯模糊（框选与画笔均使用像素块马赛克，覆盖形状不同）
         0.15.8-fix：hover 自动展开 -->
    <div class="dropdown-wrap">
        <button class="tool-btn split-main" data-tool="pixelate" id="blur-main" title="马赛克 Alt+4">
            <span id="blur-main-icon"><span aria-hidden="true" class="icon-mask icon-mask-mosaic"></span></span>
            <span class="kbd-hint">4</span>
        </button>
        <div class="dropdown" data-open="false" id="blur-dropdown">
            <div class="mode-switcher">
                <button class="mode-btn active" data-mode="brush">画笔</button>
                <button class="mode-btn" data-mode="box">框选</button>
            </div>
            <div class="dropdown-separator"></div>
            <button class="dropdown-item active" data-tool="pixelate"><span class="item-icon"><span
                    aria-hidden="true" class="icon-mask icon-mask-mosaic"></span></span><span
                    class="item-label">马赛克</span></button>
            <button class="dropdown-item" data-tool="blur"><span class="item-icon"><svg aria-hidden="true" class="icon"><use
                    href="#icon-paintbrush"/></svg></span><span class="item-label">高斯模糊</span></button>
            <div class="dropdown-separator"></div>
            <label class="wm-row" title="效果强度（马赛克块大小/模糊半径）">
                <span class="wm-label">强度</span>
                <input class="blur-intensity" max="30" min="1" type="range" value="8"/>
                <span class="blur-intensity-val">8</span>
            </label>
        </div>
    </div>

    <!-- 橡皮（0.15.1：转 dropdown，含模式切换器。0.15.8-fix：hover 自动展开） -->
    <div class="dropdown-wrap">
        <button class="tool-btn split-main" data-tool="eraser" id="eraser-main" title="橡皮 Alt+5">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-eraser"/>
            </svg>
            <span class="kbd-hint">5</span></button>
        <div class="dropdown" data-open="false" id="eraser-dropdown">
            <div class="mode-switcher">
                <button class="mode-btn active" data-mode="brush">画笔</button>
                <button class="mode-btn" data-mode="box">框选</button>
            </div>
        </div>
    </div>

    <div class="toolbar-divider"></div>

    <!-- 颜色下拉触发器（0.15.4：完整色盘 + 取色器）
         触发器圆点用 background 填色 -->
    <div class="dropdown-wrap">
        <button aria-controls="color-dropdown" aria-expanded="false" class="tool-btn dropdown-trigger" id="color-trigger"
                title="颜色">
            <span class="color-dot" id="color-trigger-dot" style="background:#ff0000"></span>
        </button>
        <div class="dropdown dropdown-color" data-open="false" id="color-dropdown">
            <div class="color-panel-drag" title="拖动颜色面板">
                <span class="color-panel-title">颜色与配色</span>
                <span class="color-panel-drag-hint">拖动</span>
            </div>
            <!-- 预设色阵列 -->
            <div class="color-presets">
                <button class="color-swatch active" data-color="#ff0000" style="background:#ff0000"
                        title="红色"></button>
                <button class="color-swatch" data-color="#ffd700" style="background:#ffd700" title="黄色"></button>
                <button class="color-swatch" data-color="#00cc00" style="background:#00cc00" title="绿色"></button>
                <button class="color-swatch" data-color="#0088ff" style="background:#0088ff" title="蓝色"></button>
                <button class="color-swatch" data-color="#ffffff" style="background:#ffffff" title="白色"></button>
                <button class="color-swatch" data-color="#000000" style="background:#000000" title="黑色"></button>
            </div>
            <div class="dropdown-separator"></div>
            <!-- SV 色盘 -->
            <canvas class="sv-canvas" height="120" width="206"></canvas>
            <!-- 色相条 + 透明度条 + 取色按钮（左按钮右2条） -->
            <div class="color-bars">
                <button class="eyedropper-btn tool-btn" title="从截图取色">
                    <svg aria-hidden="true" class="icon">
                        <use href="#icon-pipette"/>
                    </svg>
                </button>
                <div class="bars-right">
                    <canvas class="hue-bar" height="12" width="170"></canvas>
                    <canvas class="alpha-bar" height="12" width="170"></canvas>
                </div>
            </div>
            <!-- HEX/RGB/HSL 输入 -->
            <div class="color-input-row">
                <select class="color-format" title="色彩格式">
                    <option value="hex">HEX</option>
                    <option value="rgb">RGB</option>
                    <option value="hsl">HSL</option>
                </select>
                <input class="color-value" spellcheck="false" type="text" value="#FF0000"/>
            </div>
            <!-- 0.20.7：来源无关配色核心（OKLab 聚类 + 角色色 + harmony + 对比度） -->
            <div class="palette-divider"></div>
            <div class="palette-section-heading palette-source-heading">
                <span>配色分析</span>
                <button class="palette-extract-btn" title="分析截图选区的主题色与配色">提取配色</button>
            </div>
            <div class="palette-theme-summary" hidden></div>
            <div class="palette-actions-row" hidden>
                <span class="palette-selection-hint">Ctrl + 单击可多选</span>
                <div class="dropdown-wrap palette-copy-wrap">
                    <button class="palette-copy-all" disabled title="复制 Ctrl+左键多选的颜色">
                        <svg aria-hidden="true" class="icon">
                            <use href="#icon-copy"/>
                        </svg>
                        <span>复制所选</span></button>
                    <div class="dropdown palette-copy-menu" data-open="false">
                        <button class="dropdown-item" data-copy-mode="format"><span
                                class="item-label">按当前格式复制</span></button>
                        <div class="dropdown-separator"></div>
                        <button class="dropdown-item" data-copy-mode="list"><span class="item-label">每行一个</span>
                        </button>
                        <button class="dropdown-item" data-copy-mode="css"><span class="item-label">CSS 变量</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="palette-harmony" hidden>
                <div class="palette-section-heading">
                    <span>图片取色</span>
                    <button class="palette-more-toggle palette-extract-btn" title="基于当前颜色生成配色方案">
                        生成当前色配色方案
                    </button>
                </div>
                <div class="palette-extracted harmony-scheme-card" hidden></div>
                <div class="harmony-swatches"></div>
                <div class="palette-more-schemes" hidden></div>
            </div>
            <div aria-live="polite" class="palette-copy-status" role="status"></div>
        </div>
    </div>

    <!-- 笔画下拉触发器（粗细 5 档 + 实线/虚线样式）
         0.15.0：DOM 拆分，笔画类专用 -->
    <div class="dropdown-wrap">
        <button class="tool-btn dropdown-trigger" id="stroke-width-trigger" title="笔画粗细">
            <span id="stroke-width-trigger-icon"><span class="width-bar width-bar-medium"></span></span>
        </button>
        <div class="dropdown" data-open="false" id="stroke-width-dropdown">
            <button class="dropdown-item" data-stroke-width="1"><span class="item-icon"><span
                    class="width-bar width-bar-thin"></span></span><span class="item-label">1</span></button>
            <button class="dropdown-item" data-stroke-width="2"><span class="item-icon"><span
                    class="width-bar width-bar-thin"></span></span><span class="item-label">2</span></button>
            <button class="dropdown-item active" data-stroke-width="4"><span class="item-icon"><span
                    class="width-bar width-bar-medium"></span></span><span class="item-label">4</span></button>
            <button class="dropdown-item" data-stroke-width="6"><span class="item-icon"><span
                    class="width-bar width-bar-thick"></span></span><span class="item-label">6</span></button>
            <button class="dropdown-item" data-stroke-width="8"><span class="item-icon"><span
                    class="width-bar width-bar-thick"></span></span><span class="item-label">8</span></button>
            <div class="dropdown-separator"></div>
            <button class="dropdown-item" data-stroke-style="solid"><span class="item-icon"><span
                    class="width-bar width-bar-medium" style="width:18px"></span></span><span
                    class="item-label">实线</span></button>
            <button class="dropdown-item active" data-stroke-style="dashed"><span class="item-icon"><span
                    class="width-bar width-bar-medium dashed" style="width:18px"></span></span><span class="item-label">虚线</span>
            </button>
        </div>
    </div>

    <!-- 画笔粗下拉触发器
         0.15.0：DOM 新增，画笔类专用。0.15.1 前与笔画共用 currentWidth -->
    <div class="dropdown-wrap">
        <button class="tool-btn dropdown-trigger" id="brush-size-trigger" title="画笔粗细">
            <span id="brush-size-trigger-icon"><span class="width-bar width-bar-medium"></span></span>
        </button>
        <div class="dropdown" data-open="false" id="brush-size-dropdown">
            <button class="dropdown-item" data-brush-size="8"><span class="item-icon"><span
                    class="width-bar width-bar-thin"></span></span><span class="item-label">8</span></button>
            <button class="dropdown-item active" data-brush-size="16"><span class="item-icon"><span
                    class="width-bar width-bar-medium"></span></span><span class="item-label">16</span></button>
            <button class="dropdown-item" data-brush-size="24"><span class="item-icon"><span
                    class="width-bar width-bar-thick"></span></span><span class="item-label">24</span></button>
            <button class="dropdown-item" data-brush-size="32"><span class="item-icon"><span
                    class="width-bar width-bar-thick"></span></span><span class="item-label">32</span></button>
            <button class="dropdown-item" data-brush-size="48"><span class="item-icon"><span
                    class="width-bar width-bar-thick"></span></span><span class="item-label">48</span></button>
        </div>
    </div>

    <div class="toolbar-divider"></div>

    <!-- 操作区（0.15.9：undo/redo 始终可见 + 重置按钮，三键一组） -->
    <div class="toolbar-group undo-group" data-group="ops">
        <button class="tool-btn" disabled id="btn-undo" title="撤销 (Alt+Z)">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-undo-2"/>
            </svg>
            <span class="kbd-hint">Z</span></button>
        <button class="tool-btn" disabled id="btn-redo" title="重做 (Ctrl+Y)">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-redo-2"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-reset" title="重置全部标注 (Alt+R)">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-refresh-cw"/>
            </svg>
            <span class="kbd-hint">R</span></button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- 输出区 -->
    <div class="toolbar-group" data-group="output">
        <button class="tool-btn" id="btn-scroll" title="长截图">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-gallery-vertical"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-ocr" title="识别 (OCR + 面板)">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-scan-text"/>
            </svg>
        </button>
        <button class="tool-btn" hidden id="btn-ocr-diag" title="OCR 诊断">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-lightbulb"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-translate" title="翻译 (OCR + 翻译 + 图上嵌译文)">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-languages"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-translate-pin" title="翻译并 pin (OCR + 翻译 + 钉图)">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-bookmark-check"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-save" title="保存为文件">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-save"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-pin" title="钉图">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-pin"/>
            </svg>
        </button>
        <button class="tool-btn tool-btn-primary" id="btn-copy" title="复制截图 (双击选区)">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-check"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-cancel" title="取消 (ESC)">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-x"/>
            </svg>
        </button>
    </div>
</div>

<!-- 0.15.12：二级面板——水印表单/文字配置直接显示在工具组下方，支持关闭 -->
<div aria-label="二级菜单" class="sub-panel hidden" id="sub-panel" role="region">
    <button class="sub-panel-close" title="关闭">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-x"/>
        </svg>
    </button>
    <!-- 文字配置视图 -->
    <div class="sub-panel-view sub-panel-text-config" data-view="text-config">
        <label class="wm-row">
            <span class="wm-label">字号</span>
            <input class="text-font-size" max="72" min="5" type="range" value="24"/>
            <span class="text-font-size-val">24</span>
        </label>
        <label class="wm-row">
            <span class="wm-label">字体</span>
            <div class="font-picker" id="font-picker">
                <input autocomplete="off" class="font-search" placeholder="搜索字体…" type="text"/>
                <div class="font-dropdown hidden" id="font-dropdown"></div>
            </div>
        </label>
        <div class="wm-row text-style-toggles">
            <span class="wm-label">样式</span>
            <button class="tool-btn text-bold-btn" title="粗体">B</button>
            <button class="tool-btn text-italic-btn" style="font-style:italic" title="斜体">I</button>
            <button class="tool-btn text-shadow-btn" title="阴影">S</button>
        </div>
    </div>
    <!-- 水印表单视图 -->
    <div class="sub-panel-view sub-panel-watermark" data-view="watermark">
        <label class="wm-row">
            <span class="wm-label">文字</span>
            <input class="wm-text" maxlength="60" placeholder="水印文字…" type="text"/>
        </label>
        <label class="wm-row">
            <span class="wm-label">位置</span>
            <select class="wm-layout">
                <option value="diagonal">斜向铺满</option>
                <option value="top-left">左上角</option>
                <option value="top-right">右上角</option>
                <option value="bottom-left">左下角</option>
                <option value="bottom-right">右下角</option>
                <option value="top-center">顶部居中</option>
                <option value="bottom-center">底部居中</option>
            </select>
        </label>
        <label class="wm-row">
            <span class="wm-label">透明度</span>
            <input class="wm-opacity" max="100" min="0" type="range" value="35"/>
            <span class="wm-opacity-val">35%</span>
        </label>
        <!-- 0.15.12：水印密度（控制斜向铺满时的行间距/间距） -->
        <label class="wm-row">
            <span class="wm-label">密度</span>
            <input class="wm-density" max="300" min="50" type="range" value="150"/>
            <span class="wm-density-val">150%</span>
        </label>
        <div class="wm-form-footer">
            <button class="wm-clear tool-btn" disabled title="清除当前水印">清除</button>
            <button class="wm-apply tool-btn tool-btn-primary">应用</button>
        </div>
    </div>
</div>

<!--
  以下 <script> 块在 ES module 加载/执行失败时提供最小逃生通道。
  如果 index.js 成功加载，这些 handler 会被其 preventDefault 覆盖或共存（ESC/cancel 重复调用幂等）。
  问题背景：0.15 新增 ss-scroll.js / ss-hover.js 等模块，若任一 import 失败或运行时抛异常，
  整个 module 不执行 → 无 keydown/contextmenu/blur handler → 用户被 always_on_top 全屏遮罩困住。
-->
<script>
    // 1. 禁用 WebView2 原生右键菜单（模块成功加载后 contextmenu 上的 preventDefault 与此共存）
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // 2. ESC 兜底退出：模块加载失败时用户仍可 ESC 关闭 overlay
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            e.preventDefault();
            // 直接调 invoke，不走 api.js（api.js 也可能因模块加载失败而不可用）
            if (window.__TAURI_INTERNALS__) {
                window.__TAURI_INTERNALS__.invoke('hide_screenshot_overlay');
            }
        }
    });

    // 3. 模块加载超时检测：5 秒后若 __blinkScreenMeta 未被注入，说明模块未成功执行
    //    主动调后端隐藏 overlay，避免用户被困
    //    豁免 preheat 窗口——preheat 模式本身就不加载截图，不注入 meta 是正常的
    setTimeout(function () {
        if (!window.__blinkScreenMeta && !window.location.search.includes('preheat=1')) {
            console.error('[screenshot] 模块加载超时，自动隐藏 overlay');
            if (window.__TAURI_INTERNALS__) {
                window.__TAURI_INTERNALS__.invoke('hide_screenshot_overlay');
            }
        }
    }, 5000);
</script>

<script src="js/screenshot/index.js" type="module"></script>
</body>
</html>
