<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Blink Screenshot</title>
    <link rel="stylesheet" href="css/entries/chord-screenshot.css" />
  </head>
  <body>
    <!-- 主 canvas：全屏截图 + 暗色蒙版 + 亮区 -->
    <canvas id="canvas"></canvas>

    <!-- 标注 canvas：覆盖在裁剪区上，显示标注内容（0.11.7-b） -->
    <canvas id="annot-canvas"></canvas>

    <!-- 选区尺寸提示 -->
    <div id="size-hint"></div>

    <!-- 错误提示 -->
    <div id="error-hint"></div>

    <!-- 工具栏（0.11.7-a/b）：选区完成后显示 -->
    <div id="toolbar" role="toolbar" aria-label="截图工具栏">
      <!-- 标注工具区 -->
      <div class="toolbar-group" data-group="tools">
        <button class="tool-btn active" data-tool="rect" title="矩形">▭</button>
        <button class="tool-btn" data-tool="ellipse" title="椭圆">○</button>
        <button class="tool-btn" data-tool="arrow" title="箭头">➘</button>
        <button class="tool-btn" data-tool="pencil" title="铅笔">✎</button>
        <button class="tool-btn" data-tool="text" title="文本">A</button>
        <button class="tool-btn" data-tool="mosaic" title="马赛克">▦</button>
        <button class="tool-btn" data-tool="eraser" title="橡皮擦">⌫</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- 颜色区 -->
      <div class="toolbar-group" data-group="colors">
        <button class="tool-btn color-swatch active" data-color="#ff0000" title="红色" style="color:#ff0000">●</button>
        <button class="tool-btn color-swatch" data-color="#ff8c00" title="橙色" style="color:#ff8c00">●</button>
        <button class="tool-btn color-swatch" data-color="#ffd700" title="黄色" style="color:#ffd700">●</button>
        <button class="tool-btn color-swatch" data-color="#00cc00" title="绿色" style="color:#00cc00">●</button>
        <button class="tool-btn color-swatch" data-color="#00cccc" title="青色" style="color:#00cccc">●</button>
        <button class="tool-btn color-swatch" data-color="#0088ff" title="蓝色" style="color:#0088ff">●</button>
        <button class="tool-btn color-swatch" data-color="#aa44ff" title="紫色" style="color:#aa44ff">●</button>
        <button class="tool-btn color-swatch" data-color="#ffffff" title="白色" style="color:#ffffff">●</button>
        <input type="color" id="color-picker" class="color-input" value="#ff0000" title="自定义颜色" />
      </div>

      <div class="toolbar-divider"></div>

      <!-- 粗细区 -->
      <div class="toolbar-group" data-group="widths">
        <button class="tool-btn width-btn" data-width="2" title="细">──</button>
        <button class="tool-btn width-btn active" data-width="4" title="中">━</button>
        <button class="tool-btn width-btn" data-width="8" title="粗">━━</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- 操作区 -->
      <div class="toolbar-group" data-group="ops">
        <button class="tool-btn" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>↶</button>
        <button class="tool-btn" id="btn-redo" title="重做 (Ctrl+Y)" disabled>↷</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- 输出区 -->
      <div class="toolbar-group" data-group="output">
        <button class="tool-btn" id="btn-ocr" title="OCR 文字识别">🔍</button>
        <button class="tool-btn" id="btn-save" title="保存为文件">💾</button>
        <button class="tool-btn" id="btn-pin" title="钉图">📌</button>
        <button class="tool-btn tool-btn-primary" id="btn-copy" title="复制 (双击选区)">✓</button>
        <button class="tool-btn" id="btn-cancel" title="取消 (ESC)">✕</button>
      </div>
    </div>

    <script type="module" src="js/chord-screenshot.js"></script>
  </body>
</html>
