<!DOCTYPE html>
<html class="screenshot-session-inactive" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>Blink Screenshot</title>
    <link href="css/entries/chord-screenshot.css" rel="stylesheet"/>
</head>
<body>
<!-- 主 canvas：静态底图层——截图原图，只在 session 初始化/来源切换时绘制 -->
<canvas id="canvas" tabindex="-1"></canvas>

<!-- 0.20.5：动态交互层——选区外遮罩、边框、手柄、尺寸提示，拖动/缩放只清理此层 -->
<canvas id="interaction-canvas"></canvas>

<!-- 0.25.14：预选挖洞遮罩层——智能吸附预选阶段的「预选框外暗、框内透」。
     四块遮罩组合出挖洞效果，几何与 #preselection-hint 同一 rect，
     由 js/screenshot/ss-preselection-hint.js 在 show/hide/reset 时同步驱动
     （开关 preselection_cutout 默认开，关闭时不激活、维持整屏暗罩）。
     层级在 #interaction-canvas（z=1）之上、#live-selection 与 #annot-canvas 之下，
     与 #live-selection 互斥：拖动/吸附/取消路径的 canvas 提交函数会强制隐藏本层。
     aria-hidden + pointer-events:none：不进入可访问性树，也不截获指针。 -->
<div aria-hidden="true" class="preselection-mask hidden" id="preselection-mask">
    <div class="preselection-mask-block" id="pre-mask-top"></div>
    <div class="preselection-mask-block" id="pre-mask-bottom"></div>
    <div class="preselection-mask-block" id="pre-mask-left"></div>
    <div class="preselection-mask-block" id="pre-mask-right"></div>
</div>

<!-- 0.23.15：实线选区实时 DOM 层——拖动（新建/移动/缩放）期间的选区预览。
     四块遮罩组合出「选区外暗、选区内透明」，实线边框只有这一个元素。
     层级固定在 interaction-canvas 之后、annot-canvas 之前：
     拖动期间 interaction-canvas 不参与绘制，本层承担全部实时几何。
     几何是 CSS 像素，由 js/screenshot/ss-live-selection.js 逐帧写入。
     aria-hidden + pointer-events:none：不进入可访问性树，也不截获指针。 -->
<div aria-hidden="true" class="live-selection hidden" id="live-selection">
    <div class="live-selection-mask" id="live-mask-top"></div>
    <div class="live-selection-mask" id="live-mask-bottom"></div>
    <div class="live-selection-mask" id="live-mask-left"></div>
    <div class="live-selection-mask" id="live-mask-right"></div>
    <div class="live-selection-border" id="live-border"></div>
</div>

<!-- 0.28.23：录制范围框——overlay 录制叠层模式下替代原 gif-region 窗口。
     边框画在录制区域外侧（窗口 DOM，不入 BitBlt 采集矩形内的成品——边框
     中心线落在区域边界上、外半在区域外）；随区域移动由 JS 同步。 -->
<div aria-hidden="true" class="gif-region-frame hidden" id="gif-region-frame" data-resizable="false">
    <span class="gif-prep-size" id="gif-prep-size"></span>
    <span class="gif-prep-edge" data-recording-edge="n"></span>
    <span class="gif-prep-edge" data-recording-edge="e"></span>
    <span class="gif-prep-edge" data-recording-edge="s"></span>
    <span class="gif-prep-edge" data-recording-edge="w"></span>
    <span class="gif-prep-handle" data-recording-resize="nw"></span>
    <span class="gif-prep-handle" data-recording-resize="n"></span>
    <span class="gif-prep-handle" data-recording-resize="ne"></span>
    <span class="gif-prep-handle" data-recording-resize="e"></span>
    <span class="gif-prep-handle" data-recording-resize="se"></span>
    <span class="gif-prep-handle" data-recording-resize="s"></span>
    <span class="gif-prep-handle" data-recording-resize="sw"></span>
    <span class="gif-prep-handle" data-recording-resize="w"></span>
</div>

<!-- 标注 canvas：覆盖在裁剪区上，显示标注内容（0.11.7-b）。
     录制叠层模式下兼作实时涂画层：底图已清、透明区域透出桌面，
     涂画内容经 DWM 合成进入采集帧（仅一次）。 -->
<canvas class="hidden" id="annot-canvas"></canvas>

<!-- OCR 命中 canvas（0.11.9-c）：阅读模式下画 word 高亮层 -->
<canvas aria-hidden="true" id="ocr-hit-canvas"></canvas>

<!-- 选区尺寸提示 -->
<div class="hidden" id="size-hint"></div>

<!-- 错误提示 -->
<div class="hidden" id="error-hint"></div>

<!-- 0.20.6：精调状态提示（取色冻结/跟随模式提示） -->
<div class="precision-hint hidden" id="precision-hint"></div>

<!-- 选区中央加载转圈（OCR/翻译进行中） -->
<div class="sel-loading" hidden id="sel-loading">
    <div class="sel-loading-spinner"></div>
    <span class="sel-loading-text"></span>
</div>

<!-- 笔画预览虚圈（0.11.8-c）：铅笔/荧光笔/橡皮擦 hover 时显示笔尖大小 -->
<div aria-hidden="true" class="stroke-cursor" id="stroke-cursor"></div>

<!-- 0.15.8：像素放大镜——选区拖拽阶段跟随鼠标，显示 9×16 像素网格 + 坐标 + 色值 -->
<div aria-hidden="true" class="pixel-magnifier hidden" id="pixel-magnifier">
    <canvas class="pm-grid" height="81" width="144"></canvas>
    <div class="pm-info">
        <span class="pm-coord"></span>
        <span class="pm-color"><span aria-hidden="true" class="pm-color-swatch"></span><span
                class="pm-color-text"></span></span>
        <span class="pm-hint">Shift 切换格式</span>
        <span class="pm-hint">C 复制颜色</span>
    </div>
</div>

<!-- 0.15.7：长截图专属工具栏（拼接中阶段显示，默认隐藏） -->
<div aria-label="长截图工具栏" class="scroll-toolbar hidden" id="scroll-toolbar" role="toolbar">
    <button class="tool-btn hidden" id="scroll-direction" title="当前仅支持纵向长截图">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-rectangle-vertical"/>
        </svg>
    </button>
    <button class="tool-btn" id="scroll-auto" title="自动滚动">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-gallery-vertical-end"/>
        </svg>
    </button>
    <button class="tool-btn" id="scroll-edit" title="编辑长图">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-pencil-sparkles"/>
        </svg>
    </button>
    <div class="toolbar-divider"></div>
    <button class="tool-btn" id="scroll-pin" title="钉图">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-pin"/>
        </svg>
    </button>
    <button class="tool-btn" id="scroll-save" title="保存为文件">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-save"/>
        </svg>
    </button>
    <button class="tool-btn tool-btn-primary" id="scroll-copy" title="复制长图">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-check"/>
        </svg>
    </button>
    <button class="tool-btn" id="scroll-cancel" title="取消">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-x"/>
        </svg>
    </button>
</div>

<!-- 0.15.7：长截图实时预览缩略图（右侧 fixed 定位） -->
<canvas aria-hidden="true" class="scroll-preview hidden" height="200" id="scroll-preview" width="120"></canvas>

<div aria-live="polite" class="scroll-diagnostics hidden" id="scroll-diagnostics">
    <span id="scroll-diagnostics-text">等待首帧</span>
    <button id="scroll-diagnostics-export" type="button">导出回放</button>
</div>

<!-- 长截图采集边界：overlay 已从 BitBlt 排除，仅用于范围提示。 -->
<div aria-hidden="true" class="scroll-capture-frame hidden" id="scroll-capture-frame"></div>

<!-- 截图与录制共用工具栏：只由 data-mode / data-drawing 投影显隐，不搬移控件。 -->
<div aria-label="截图工具栏" class="hidden" id="toolbar" role="toolbar" data-mode="screenshot" data-drawing="false">
    <!-- 拖动 handle（左侧）：mousedown 拖动整条工具栏 -->
    <div class="toolbar-drag-handle" id="toolbar-drag" title="拖动工具栏">
        <span class="drag-dots"></span>
    </div>

    <div class="toolbar-divider"></div>

    <!-- 录制只替换输出区；原标注工具始终留在 #toolbar 内。 -->
    <div id="gif-recording-bar" class="toolbar-group recording-bar">
        <button type="button" class="tool-btn" id="gif-rec-move" aria-label="拖动录制区域与工具栏"><svg aria-hidden="true" class="icon"><use href="#icon-hand-grab"/></svg></button>
        <span class="toolbar-divider"></span>
        <input type="hidden" id="gif-prep-fps" value="15"/>
        <div class="recording-split recording-fps-select" role="group" aria-label="录制帧率">
            <button type="button" class="tool-btn recording-select" data-recording-select="gif-prep-fps" aria-label="切换录制帧率"><span class="recording-select-label">15 fps</span></button>
            <button type="button" class="tool-btn recording-menu-toggle" data-recording-menu="gif-prep-fps" aria-haspopup="listbox" aria-expanded="false" aria-label="展开帧率选项"><svg aria-hidden="true" class="icon"><use href="#icon-chevron-down"/></svg></button>
        </div>
        <span class="toolbar-divider"></span>
        <div class="recording-split recording-sound" role="group" aria-label="录制声音来源">
            <button type="button" class="tool-btn recording-sound-main" id="gif-audio-open" aria-label="切换声音来源"><span id="gif-audio-label">无声</span><span class="gif-audio-meters" id="gif-audio-meters"><span class="audio-source audio-inactive" data-source="0"><span class="audio-level" aria-hidden="true"><i class="audio-level-fill"></i><i class="audio-level-peak"></i></span></span><span class="audio-source audio-inactive" data-source="1"><span class="audio-level" aria-hidden="true"><i class="audio-level-fill"></i><i class="audio-level-peak"></i></span></span></span></button>
            <button type="button" class="tool-btn recording-menu-toggle" id="gif-audio-menu" aria-haspopup="dialog" aria-controls="gif-audio-settings" aria-expanded="false" aria-label="展开声音来源设置"><svg aria-hidden="true" class="icon"><use href="#icon-chevron-down"/></svg></button>
        </div>
        <span class="toolbar-divider"></span>
        <button type="button" class="tool-btn recording-summary" id="gif-recording-status" aria-haspopup="dialog" aria-expanded="false">
            <span class="recording-time-line"><span class="gif-rec-dot"></span><span class="gif-rec-time" id="gif-rec-time">00:00</span></span>
        </button>
        <span class="toolbar-divider"></span>
        <button type="button" class="tool-btn recording-start" id="gif-record-toggle"><svg aria-hidden="true" class="icon hidden"><use href="#icon-pause"/></svg><svg aria-hidden="true" class="icon"><use href="#icon-play"/></svg><span id="gif-record-toggle-label">开始</span></button>
        <span class="toolbar-divider"></span>
        <div class="recording-finish">
            <button type="button" class="tool-btn recording-stop" id="gif-rec-stop" hidden aria-haspopup="menu" aria-controls="gif-recording-finish-menu" aria-expanded="false" aria-label="完成"><svg aria-hidden="true" class="icon"><use href="#icon-square"/></svg><span id="gif-rec-stop-label">完成</span></button>
            <button type="button" class="tool-btn" id="gif-record-exit" aria-label="退出录制"><svg aria-hidden="true" class="icon"><use href="#icon-x"/></svg><span id="gif-record-exit-label">退出</span></button>
        </div>
        <span class="toolbar-divider"></span>
        <button type="button" class="tool-btn" id="gif-rec-draw" aria-pressed="false" aria-expanded="false" aria-label="展开涂画工具"><svg aria-hidden="true" class="icon"><use href="#icon-paintbrush"/></svg><svg aria-hidden="true" class="icon recording-draw-chevron"><use href="#icon-chevron-right"/></svg></button>
    </div>

    <!-- 选取工具（0.11.10-a/k）：默认工具，负责选区重选、移动和缩放。
         有识别结果时，选区内文字由 #ocr-hit-canvas 优先承接拖选；边缘仍保留缩放热区。
         切到其它工具时把 #ocr-hit-canvas pointer-events 让渡给标注层。 -->
    <button class="tool-btn tool-direct active" data-tool="select" id="select-main" data-toolbar-part="selection" title="选取（默认） Alt+`">
        <svg aria-hidden="true" class="icon">
            <use href="#icon-mouse-pointer-2"/>
        </svg>
        <span class="kbd-hint">`</span></button>

    <div class="toolbar-divider" data-toolbar-part="selection"></div>

    <!-- 图形分组：矩形/椭圆
         0.15.8-fix：移除 caret，改为 hover 自动展开 dropdown
         按住 Shift 时约束长宽等比（矩形→正方形、椭圆→圆） -->
    <!-- 0.15.8-fix：移除 caret 按钮，改为 hover 自动展开 dropdown -->
    <div class="dropdown-wrap" data-toolbar-part="drawing">
        <button class="tool-btn split-main" data-tool="rect" id="shape-main" title="图形 Alt+1">
            <span id="shape-main-icon"><svg aria-hidden="true" class="icon"><use href="#icon-square"/></svg></span>
            <span class="kbd-hint">1</span>
        </button>
        <div class="dropdown" data-open="false" id="shape-dropdown">
            <button class="dropdown-item active" data-tool="rect"><span class="item-icon"><svg aria-hidden="true"
                                                                                               class="icon"><use
                    href="#icon-square"/></svg></span><span class="item-label">矩形</span></button>
            <button class="dropdown-item" data-tool="ellipse"><span class="item-icon"><svg aria-hidden="true"
                                                                                           class="icon"><use
                    href="#icon-circle"/></svg></span><span class="item-label">椭圆</span></button>
            <div class="dropdown-separator"></div>
            <button class="dropdown-item" data-tool="spotlight"><span class="item-icon"><svg aria-hidden="true"
                                                                                             class="icon"><use
                    href="#icon-spotlight"/></svg></span><span class="item-label">聚光灯</span></button>
            <button class="dropdown-item" data-tool="spotlight-multi"><span class="item-icon"><svg aria-hidden="true"
                                                                                                   class="icon"><use
                    href="#icon-spotlight"/></svg></span><span class="item-label">多次聚光灯</span></button>
            <button class="dropdown-item" data-tool="magnifier"><span class="item-icon"><svg aria-hidden="true"
                                                                                             class="icon"><use
                    href="#icon-search"/></svg></span><span class="item-label">局部放大</span></button>
            <div class="dropdown-separator magnifier-zoom-sep" hidden></div>
            <div class="magnifier-zoom-row" hidden>
                <span class="wm-label">倍率</span>
                <button class="mode-btn zoom-btn active" data-zoom="1.3">1.3×</button>
                <button class="mode-btn zoom-btn" data-zoom="1.5">1.5×</button>
                <button class="mode-btn zoom-btn" data-zoom="2.0">2.0×</button>
            </div>
        </div>
    </div>

    <!-- 画笔分组：铅笔/箭头/荧光笔（正片叠底/半透明）
         0.15.0：箭头从一级默认降为下拉子项，画笔（pencil）作组默认
         0.15.8-fix：hover 自动展开 -->
    <div class="dropdown-wrap" data-toolbar-part="drawing">
        <button class="tool-btn split-main" data-tool="pencil" id="stroke-main" title="画笔 Alt+2">
            <span id="stroke-main-icon"><svg aria-hidden="true" class="icon"><use href="#icon-pencil"/></svg></span>
            <span class="kbd-hint">2</span>
        </button>
        <div class="dropdown" data-open="false" id="stroke-dropdown">
            <button class="dropdown-item active" data-tool="pencil"><span class="item-icon"><svg aria-hidden="true"
                                                                                                 class="icon"><use
                    href="#icon-pencil"/></svg></span><span class="item-label">铅笔</span></button>
            <button class="dropdown-item" data-tool="arrow"><span class="item-icon"><svg aria-hidden="true"
                                                                                         class="icon"><use
                    href="#icon-move-up-right"/></svg></span><span class="item-label">箭头</span></button>
            <button class="dropdown-item" data-tool="highlight-multiply"><span class="item-icon"><svg aria-hidden="true"
                                                                                                      class="icon"><use
                    href="#icon-ticket-slash"/></svg></span><span class="item-label">荧光笔・正片叠底</span></button>
            <button class="dropdown-item" data-tool="highlight-translucent"><span class="item-icon"><svg
                    aria-hidden="true"
                    class="icon"><use
                    href="#icon-ticket-slash"/></svg></span><span class="item-label">荧光笔・半透明</span></button>
        </div>
    </div>

    <!-- 文字分组：文本/数字标号/水印
         0.15.11：二级菜单内容移至工具栏下方 sub-panel，hover dropdown 只保留工具选择
         0.15.8-fix：hover 自动展开 -->
    <div class="dropdown-wrap" data-toolbar-part="drawing">
        <button class="tool-btn split-main" data-tool="text" id="text-main" title="文字 Alt+3">
            <span id="text-main-icon">A</span>
            <span class="kbd-hint">3</span>
        </button>
        <div class="dropdown dropdown-text" data-open="false" id="text-dropdown">
            <!-- 0.15.14：移除多余的 dropdown-view 包裹，与其他 dropdown 结构一致 -->
            <button class="dropdown-item active" data-tool="text"><span class="item-icon">A</span><span
                    class="item-label">文本</span></button>
            <button class="dropdown-item" data-tool="number"><span class="item-icon">#</span><span class="item-label">数字标号</span>
            </button>
            <button class="dropdown-item" data-tool="watermark"><span class="item-icon"><svg aria-hidden="true"
                                                                                             class="icon"><use
                    href="#icon-stamp"/></svg></span><span class="item-label">水印</span></button>
        </div>
    </div>

    <!-- 马赛克分组：马赛克/高斯模糊（框选与画笔均使用像素块马赛克，覆盖形状不同）
         0.15.8-fix：hover 自动展开 -->
    <div class="dropdown-wrap" data-toolbar-part="drawing">
        <button class="tool-btn split-main" data-tool="pixelate" id="blur-main" title="马赛克 Alt+4">
            <span id="blur-main-icon"><span aria-hidden="true" class="icon-mask icon-mask-mosaic"></span></span>
            <span class="kbd-hint">4</span>
        </button>
        <div class="dropdown" data-open="false" id="blur-dropdown">
            <div class="mode-switcher">
                <button class="mode-btn active" data-mode="brush">画笔</button>
                <button class="mode-btn" data-mode="box">框选</button>
            </div>
            <div class="dropdown-separator"></div>
            <button class="dropdown-item active" data-tool="pixelate"><span class="item-icon"><span
                    aria-hidden="true" class="icon-mask icon-mask-mosaic"></span></span><span
                    class="item-label">马赛克</span></button>
            <button class="dropdown-item" data-tool="blur"><span class="item-icon"><svg aria-hidden="true" class="icon"><use
                    href="#icon-paintbrush"/></svg></span><span class="item-label">高斯模糊</span></button>
            <div class="dropdown-separator"></div>
            <label class="wm-row" title="效果强度（马赛克块大小/模糊半径）">
                <span class="wm-label">强度</span>
                <input class="blur-intensity" max="30" min="1" type="range" value="8"/>
                <span class="blur-intensity-val">8</span>
            </label>
        </div>
    </div>

    <!-- 橡皮（0.15.1：转 dropdown，含模式切换器。0.15.8-fix：hover 自动展开） -->
    <div class="dropdown-wrap" data-toolbar-part="drawing">
        <button class="tool-btn split-main" data-tool="eraser" id="eraser-main" title="橡皮 Alt+5">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-eraser"/>
            </svg>
            <span class="kbd-hint">5</span></button>
        <div class="dropdown" data-open="false" id="eraser-dropdown">
            <div class="mode-switcher">
                <button class="mode-btn active" data-mode="brush">画笔</button>
                <button class="mode-btn" data-mode="box">框选</button>
            </div>
        </div>
    </div>

    <div class="toolbar-divider" data-toolbar-part="drawing"></div>

    <!-- 颜色下拉触发器（0.15.4：完整色盘 + 取色器）
         触发器圆点用 background 填色 -->
    <div class="dropdown-wrap" data-toolbar-part="drawing">
        <button aria-controls="color-dropdown" aria-expanded="false" class="tool-btn dropdown-trigger"
                id="color-trigger"
                title="颜色">
            <span class="color-dot" id="color-trigger-dot" style="--swatch-overlay:#ff0000"></span>
        </button>
        <div class="dropdown dropdown-color" data-open="false" id="color-dropdown">
            <div class="color-panel-drag" title="拖动颜色面板">
                <span class="color-panel-title">颜色与配色</span>
                <span class="color-panel-drag-hint">拖动</span>
            </div>
            <!-- 预设色阵列 -->
            <div class="color-presets">
                <button class="color-swatch active" data-color="#ff0000" style="background-color:#ff0000"
                        title="红色"></button>
                <button class="color-swatch" data-color="#ffd700" style="background-color:#ffd700"
                        title="黄色"></button>
                <button class="color-swatch" data-color="#00cc00" style="background-color:#00cc00"
                        title="绿色"></button>
                <button class="color-swatch" data-color="#0088ff" style="background-color:#0088ff"
                        title="蓝色"></button>
                <button class="color-swatch" data-color="#ffffff" style="background-color:#ffffff"
                        title="白色"></button>
                <button class="color-swatch" data-color="#000000" style="background-color:#000000"
                        title="黑色"></button>
            </div>
            <div class="dropdown-separator"></div>
            <!-- 0.23.19：取色按钮行 + 色彩格式行移到 SV 色盘上方，方便高频点击 -->
            <!-- 色相条 + 透明度条 + 取色按钮（左按钮右2条） -->
            <div class="color-bars">
                <button class="eyedropper-btn tool-btn" title="从截图取色">
                    <svg aria-hidden="true" class="icon">
                        <use href="#icon-pipette"/>
                    </svg>
                </button>
                <div class="bars-right">
                    <canvas class="hue-bar" height="12" width="170"></canvas>
                    <canvas class="alpha-bar" height="12" width="170"></canvas>
                </div>
            </div>
            <!-- HEX/RGB/HSL 输入（0.23.19：原生 select 弹层由浏览器定位，多屏 +

<!--
  以下 <script> 块在 ES module 加载/执行失败时提供最小逃生通道。
  如果 index.js 成功加载，它会在交互绑定完成后移除 ESC 容灾 handler；contextmenu 禁用可幂等共存。
  问题背景：0.15 新增 ss-scroll.js / ss-hover.js 等模块，若任一 import 失败或运行时抛异常，
  整个 module 不执行 → 无 keydown/contextmenu/blur handler → 用户被 always_on_top 全屏遮罩困住。
-->
<script>
    // 1. 禁用 WebView2 原生右键菜单（模块成功加载后 contextmenu 上的 preventDefault 与此共存）
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // 2. ESC 兜底退出：只在正常模块尚未完成初始化时生效。
    //    正常模块就绪后会移除该 handler，避免绕过前端会话清理直接 hide。
    const emergencyEscapeHandler = (e) => {
        if (e.key === 'Escape') {
            e.preventDefault();
            // 即使模块失败，也先隐藏旧 surface；下次复用窗口时不会闪回旧图层。
            document.documentElement.classList.add('screenshot-session-inactive');
            // 直接调 invoke，不走 api.js（api.js 也可能因模块加载失败而不可用）
            if (window.__TAURI_INTERNALS__) {
                window.__TAURI_INTERNALS__.invoke('hide_screenshot_overlay');
            }
        }
    };
    document.addEventListener('keydown', emergencyEscapeHandler);
    window.__blinkDisableEmergencyScreenshotEscape = function () {
        document.removeEventListener('keydown', emergencyEscapeHandler);
        window.__blinkDisableEmergencyScreenshotEscape = null;
    };

    // 3. 模块加载超时检测：5 秒后若 __blinkScreenMeta 未被注入，说明模块未成功执行
    //    主动调后端隐藏 overlay，避免用户被困
    //    豁免 preheat 窗口——preheat 模式本身就不加载截图，不注入 meta 是正常的
    setTimeout(function () {
        if (!window.__blinkScreenMeta && !window.location.search.includes('preheat=1')) {
            console.error('[screenshot] 模块加载超时，自动隐藏 overlay');
            if (window.__TAURI_INTERNALS__) {
                window.__TAURI_INTERNALS__.invoke('hide_screenshot_overlay');
            }
        }
    }, 5000);
</script>
