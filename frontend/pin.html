<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>Blink Pin</title>
    <link href="css/entries/pin.css" rel="stylesheet"/>
</head>
<body>
<!--
  统一几何模型（多屏混合 DPI 安全）：
  - 图片 CSS 尺寸 = baseCss × zoom，跨屏保持视觉大小不变。
  - 窗口物理矩形由 pin-geometry.js::computeWindowRect 算出，随目标屏 DPR 变化。
  - 拖动用 Tauri 原生 startDragging()，系统处理鼠标捕获和跨屏移动。
  - DPI 变化通过 onScaleChanged 监听，reconcile 回读窗口实际物理矩形。
  - 滚轮缩放围绕鼠标锚点，鼠标下内容保持稳定。
  - 窗口尺寸和位置在同一 rAF 内合并提交，无透明空壳。
-->
<div id="container">
    <!-- 0.20.x：crossorigin 必须配合 blink-pin 协议的 CORS 头，否则把 img 画进 canvas
         （保存到剪贴板/另存为/OCR）时 canvas 会被污染，toBlob 抛 SecurityError。 -->
    <img alt="钉图" crossorigin="anonymous" draggable="false" id="pin-img" src=""/>
    <div id="zoom-level">100%</div>
    <!-- 0.18.3：翻译中指示器（不随 img transform: scale 缩放，独立固定视觉大小） -->
    <div class="hidden" id="pin-translating-indicator">
        <div class="pin-spinner"></div>
        <span class="pin-translating-text">翻译中</span>
    </div>
</div>

<!-- 右键菜单 -->
<div class="hidden" id="ctx-menu">
    <button id="ctx-edit-image">编辑图片</button>
    <div class="ctx-sep"></div>
    <button class="hidden" id="ctx-copy-text">复制选中文字</button>
    <button id="ctx-ocr">识别文字</button>
    <button id="ctx-translate">翻译图片</button>
    <div class="ctx-sep"></div>
    <button id="ctx-copy">保存到剪贴板</button>
    <button id="ctx-save-as">另存为</button>
    <div class="ctx-sep"></div>
    <button id="ctx-reset-zoom">重置缩放</button>
    <button id="ctx-close">关闭</button>
</div>

<!-- 0.23.12：轻量提示（OCR 无文字 / 识别失败 / 翻译失败等），替代已移除的文本面板 -->
<div class="hidden" id="pin-toast"></div>

<script type="module">
    import {
        invoke,
        screenshotPinTransform,
        screenshotPinGetRect,
        pinWorkArea,
        win32LeftButtonDown,
        ocrImage,
        translateText,
        pinSpareReady,
        pinSaveClipboard,
        copyToClipboard,
        pinSaveAs,
        openImageEditorFromPin,
        translateLines,
        screenshotPinRefreshByLabel
    } from "./js/shared/api.js";
    import {normalizeError, getCurrentWindow} from "./js/shared/tauri.js";
    import {applyThemeFromConfig} from "./js/shared/theme.js";
    // 0.23.12：嵌图渲染引擎复用——独立模块（仅依赖 ss-state 的 TOOL_CAPS 常量），
    // pin 窗口 import 得到独立实例，与截图窗口互不影响
    import * as annotEngine from "./js/screenshot/annotation-engine.js";
    import {
        PIN_PAD_CSS,
        baseCssSize,
        computeWindowRect,
        expandRectForMenu,
        reconcileDpi,
        clampZoom,
    } from "./js/pin/pin-geometry.js";
    // 0.23.12：图上文字图层（识别文字/翻译覆盖后划词），纯函数共用
    // shared/text-selection.js——与截图阅读模式同一套"空白放行"语义
    import {
        enterPinTextLayer,
        exitPinTextLayer,
        relayoutPinTextLayer,
        setPinTextLayerHidden,
        getPinTextLayerSelection,
        getPinTextLayerKind,
        clearPinTextSelection,
        sourceItemsFromOcrResult,
        translatedItemsFromLines,
    } from "./js/pin/pin-text-layer.js";

    // 应用主题（右键菜单 / OCR 面板的 token 引用随用户主题切换）
    applyThemeFromConfig();

    const MINI_MAX_SIDE = 160; // 缩小态最长边（CSS 像素）
    const MINI_ENTER_MS = 140;  // 进入 mini 动画时长
    const MINI_EXIT_MS = 170;   // 退出 mini 动画时长
    const MINI_EASING = 'cubic-bezier(.2, .8, .2, 1)';

    const img = document.getElementById('pin-img');
    const zoomLabel = document.getElementById('zoom-level');
    const ctxMenu = document.getElementById('ctx-menu');

    // ── 多 Pin：当前窗口 label ──
    const myLabel = getCurrentWindow()?.label || 'pin-unknown';
    const tauriWin = getCurrentWindow();

    // ── 预热模式：?preheat=1 时不加载图片，初始化完成后通知后端就绪 ──
    const params = new URLSearchParams(location.search);
    const isPreheat = params.get('preheat') === '1';

    // ── 统一几何状态 ──
    // 图片资源像素（只读）
    let sourcePixelW = 0, sourcePixelH = 0;
    // 100% zoom 时的视觉 CSS 尺寸（只读，= sourcePixel / sourceDpr）
    let baseCssW = 0, baseCssH = 0;
    // 用户显式缩放 (0.1..8)
    let zoom = 1;
    // 图片左上角屏幕物理坐标
    let imageScreenX = 0, imageScreenY = 0;
    // 当前窗口目标屏 DPR
    let monitorDpr = 1;
    // 缩小态
    let isMinimized = false;
    let savedZoom = 1;
    // reconcile generation（防止旧异步回调覆盖新状态）
    let reconcileGen = 0;
    // 窗口尺寸提交 generation
    let commitGen = 0;

    // mini mode 动画状态机：normal → entering → mini → exiting → normal
    let miniState = 'normal';
    let miniAnimGen = 0;
    let pendingReconcileDpr = null; // 动画期间延后的 reconcile

    let isCtxOpen = false;
    let dragEndTime = 0;
    // ── 右键菜单临时扩窗状态 ──
    // 菜单打开期间窗口临时扩大到菜单完整可见；关闭即还原。不引入常驻的
    // 隐形挡点击区域，也不参与 mini 动画（动画开始前先关菜单）。
    // shiftX/shiftY：为避让屏幕边缘把窗口左/上移的物理像素；图片用
    // menuShiftCss 的 CSS 偏移补偿，视觉位置不动。
    let ctxExpand = null;
    let menuShiftCss = {x: 0, y: 0};

    // 每次后端装载/回收一张 Pin 都递增；异步 OCR/翻译只能提交到启动时所属会话。
    let pinSessionGeneration = 0;
    let ocrBusy = false;
    let activePinOcrHandle = null;
    let activeOverlayOcrHandle = null;
    let pinOriginalPng = null;
    let pinOverlayBusy = false;

    function currentPinImageSeq() {
        try {
            // `src` 在赋值时同步更新；`currentSrc` 要等新资源完成选择/加载，可能仍指向旧 seq。
            const url = new URL(img.src || img.currentSrc);
            const seq = Number(url.pathname.split('/').filter(Boolean).pop());
            return Number.isSafeInteger(seq) && seq >= 0 ? seq : null;
        } catch (_) {
            return null;
        }
    }

    function invalidatePinSession() {
        pinSessionGeneration++;
        activePinOcrHandle?.cancel?.().catch(() => {});
        activeOverlayOcrHandle?.cancel?.().catch(() => {});
        activePinOcrHandle = null;
        activeOverlayOcrHandle = null;
        ocrBusy = false;
        pinOverlayBusy = false;
        pinOriginalPng = null;
        const translateBtn = document.getElementById('ctx-translate');
        if (translateBtn) {
            translateBtn.disabled = false;
            translateBtn.textContent = '翻译图片';
        }
    }

    // ── 0.23.12：文字图层几何 provider + 轻量 toast ─────────────
    /** 文字图层几何：pad（含菜单扩窗平移补偿）+ 图片 CSS 尺寸（baseCss × zoom）+ 资源像素尺寸。 */
    function pinTextLayerGeometry() {
        return {
            padX: PIN_PAD_CSS + menuShiftCss.x,
            padY: PIN_PAD_CSS + menuShiftCss.y,
            cssW: baseCssW * zoom,
            cssH: baseCssH * zoom,
            srcW: sourcePixelW,
            srcH: sourcePixelH,
        };
    }

    const pinToast = document.getElementById('pin-toast');

    /** 轻量提示（替代已移除的 OCR 文本面板），自动消失。 */
    function showPinToast(text, ms = 2500) {
        if (!text) return;
        pinToast.textContent = text;
        pinToast.classList.remove('hidden');
        clearTimeout(pinToast._hideTimer);
        pinToast._hideTimer = setTimeout(() => pinToast.classList.add('hidden'), ms);
    }

    // ── 几何计算辅助 ──────────────────────────────────────────

    /** 只更新 img 的 transform（GPU 合成层，丝滑，不动窗口）。
     *  同时反向补偿 box-shadow / border / border-radius。 */
    function applyTransformOnly() {
        img.style.transform = `scale(${zoom})`;
        const s = zoom;
        if (isMinimized) {
            const bw = 2 / s;
            const br = 6 / s;
            img.style.border = `${bw}px dashed rgba(74, 158, 255, 0.6)`;
            img.style.borderRadius = `${br}px`;
            img.style.boxShadow = 'none';
        } else {
            img.style.border = '';
            img.style.borderRadius = '';
            img.style.boxShadow =
                `0 0 0 ${1 / s}px rgba(74, 158, 255, 0.55), ` +
                `0 0 ${14 / s}px ${3 / s}px rgba(74, 158, 255, 0.28)`;
        }
        updatePinIndicatorPosition();
    }

    /** 更新翻译中指示器中心（图片 CSS 中心 + pad/菜单平移补偿）。 */
    function updatePinIndicatorPosition() {
        const cx = PIN_PAD_CSS + menuShiftCss.x + baseCssW * zoom / 2;
        const cy = PIN_PAD_CSS + menuShiftCss.y + baseCssH * zoom / 2;
        document.documentElement.style.setProperty('--pin-cx', cx + 'px');
        document.documentElement.style.setProperty('--pin-cy', cy + 'px');
    }

    /** 图片锚点：正常 = PIN_PAD_CSS；菜单扩窗平移期间补偿 shift，图片视觉位置不动。 */
    function setImgAnchor() {
        img.style.left = (PIN_PAD_CSS + menuShiftCss.x) + 'px';
        img.style.top = (PIN_PAD_CSS + menuShiftCss.y) + 'px';
    }

    /** 一步提交窗口位置和尺寸（物理像素，通过 SetWindowPos 原子设置）。
     *  菜单扩窗激活时矩形先经 expandRectForMenu 放大（关闭菜单即还原）。
     *  @param {number} [zoomOverride] 显式 zoom（用于 mini 动画期间提交不同 zoom 的窗口尺寸）
     *  @returns {Promise<void>} */
    function commitWindowRect(zoomOverride) {
        const myGen = ++commitGen;
        const z = zoomOverride ?? zoom;
        const rect = expandRectForMenu(
            computeWindowRect(
                {baseCssW, baseCssH, zoom: z, imageScreenX, imageScreenY},
                monitorDpr,
            ),
            ctxExpand,
            monitorDpr,
        );
        lastCommitAt = performance.now();
        return screenshotPinTransform(myLabel, rect.winX, rect.winY, rect.winW, rect.winH).catch((e) => {
            const err = normalizeError(e);
            console.error(`screenshotPinTransform 失败 [${err.code}] ${err.message}`);
            throw e;
        });
    }

    // ── 滚轮缩放提交合流 ─────────────────────────────────────
    // 窗口 resize 是重操作（WebView2 重建合成表面），逐 wheel tick SetWindowPos
    // 会卡顿。CSS transform 仍即时生效（视觉零延迟），窗口提交合流到最快
    // COMMIT_MIN_INTERVAL 一次，拖尾保证最终 zoom 一定落盘。
    const COMMIT_MIN_INTERVAL = 60;
    let commitTimer = 0;
    let lastCommitAt = 0;

    function scheduleCommitWindowRect() {
        if (commitTimer) return;
        const delay = Math.max(0, COMMIT_MIN_INTERVAL - (performance.now() - lastCommitAt));
        commitTimer = setTimeout(() => {
            commitTimer = 0;
            commitWindowRect();
        }, delay);
    }

    function cancelPendingCommit() {
        clearTimeout(commitTimer);
        commitTimer = 0;
    }

    function isMiniAnimating() {
        return miniState === 'entering' || miniState === 'exiting';
    }

    /** 从后端回读窗口实际物理矩形并 reconcile 状态。
     *  用于 DPI 变化、原生拖动结束后、或任何需要与 Win32 真源对齐的场景。
     *  @param {number} [newDprOverride] 如果已知新 DPR（如 onScaleChanged payload），直接传入。 */
    async function reconcileFromBackend(newDprOverride) {
        if (isMiniAnimating()) {
            pendingReconcileDpr = newDprOverride ?? null;
            return;
        }
        const myGen = ++reconcileGen;
        try {
            const rect = await screenshotPinGetRect(myLabel);
            if (!rect || myGen !== reconcileGen) return;

            const newDpr = newDprOverride ?? rect.dpr;
            monitorDpr = newDpr;

            const result = reconcileDpi(
                {baseCssW, baseCssH, zoom},
                newDpr,
                {winX: rect.x, winY: rect.y, winW: rect.w, winH: rect.h},
            );

            // 菜单扩窗期间窗口 origin 含 shift 平移，reconcileDpi 按
            // imageScreen = winX + pad 反推会偏差 shift；加回纠正
            const shiftX = ctxExpand?.shiftX || 0;
            const shiftY = ctxExpand?.shiftY || 0;
            imageScreenX = result.imageScreenX + shiftX;
            imageScreenY = result.imageScreenY + shiftY;

            // 用新矩形重设窗口（Windows 可能已改了位置或尺寸不对）；
            // 与回读矩形一致时跳过——纯状态同步不需要多余的 SetWindowPos。
            // 比较和提交都要应用菜单扩窗，否则安全网会把扩着的窗口缩回去
            const final = expandRectForMenu(result, ctxExpand, newDpr);
            const rectUnchanged = final.winX === rect.x && final.winY === rect.y
                && final.winW === rect.w && final.winH === rect.h;
            if (!rectUnchanged) {
                screenshotPinTransform(myLabel, final.winX, final.winY, final.winW, final.winH).catch(() => {
                });
            }

            // 刷新 CSS（baseCss 不变，只刷 transform 和 indicator）
            applyTransformOnly();
            // 0.23.12：DPI 变化后重绘文字图层 backing store（防高分屏描边模糊）
            relayoutPinTextLayer();

            if (rect.dpr !== newDpr || newDprOverride) {
                tracing_debug('reconcile', {oldDpr: monitorDpr, newDpr, rect});
            }
        } catch (e) {
            const err = normalizeError(e);
            console.error(`reconcileFromBackend 失败 [${err.code}] ${err.message}`);
        }
    }

    function tracing_debug(label, data) {
        // 开发诊断日志（生产不输出）
        console.debug(`[pin] ${label}`, data);
    }

    function showZoomLabel() {
        zoomLabel.textContent = Math.round(zoom * 100) + '%';
        zoomLabel.style.left = '8px';
        zoomLabel.style.top = '8px';
        zoomLabel.style.right = 'auto';
        zoomLabel.style.bottom = 'auto';
        zoomLabel.style.opacity = '1';
        clearTimeout(zoomLabel._hideTimer);
        zoomLabel._hideTimer = setTimeout(() => {
            zoomLabel.style.opacity = '0';
        }, 1200);
    }

    // ── 缩小/还原模式（双击切换）──────────────────────────────
    function computeMiniZoom() {
        const longestCss = Math.max(baseCssW, baseCssH);
        if (longestCss <= 0) return 1;
        return Math.min(1, MINI_MAX_SIDE / longestCss);
    }

    function enterMiniMode() {
        if (miniState !== 'normal') return;
        if (isCtxOpen) hideCtxMenu();
        const gen = ++miniAnimGen;
        miniState = 'entering';
        savedZoom = zoom;
        const miniZoom = computeMiniZoom();
        cancelPendingCommit();
        // 0.23.12：层不跟随 mini 缩放动画，进入即隐藏（退出时恢复）
        setPinTextLayerHidden(true);

        // 左上角固定：imageScreenX/Y 不变，只改 zoom 和窗口尺寸

        // reduced-motion：直接到最终状态
        if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) {
            zoom = miniZoom;
            isMinimized = true;
            miniState = 'mini';
            document.body.classList.add('mini-mode');
            applyTransformOnly();
            commitWindowRect();
            zoomLabel.style.opacity = '0';
            return;
        }

        // Phase 1：CSS transform 纯 scale 动画（窗口不动，左上角固定）
        img.style.transition = `transform ${MINI_ENTER_MS}ms ${MINI_EASING}`;
        img.style.transform = `scale(${miniZoom})`;

        // Phase 2：动画结束后收窗口（只裁右侧和下侧透明区域）
        const finishEnter = () => {
            if (gen !== miniAnimGen) return;
            img.removeEventListener('transitionend', onTransEnd);
            clearTimeout(fallback);
            img.style.transition = '';
            zoom = miniZoom;
            isMinimized = true;
            miniState = 'mini';
            document.body.classList.add('mini-mode');
            applyTransformOnly();
            commitWindowRect();
            zoomLabel.style.opacity = '0';
            if (pendingReconcileDpr !== null) {
                const dpr = pendingReconcileDpr;
                pendingReconcileDpr = null;
                reconcileFromBackend(dpr);
            }
        };
        const onTransEnd = (e) => {
            if (e.target !== img || e.propertyName !== 'transform') return;
            finishEnter();
        };
        img.addEventListener('transitionend', onTransEnd);
        const fallback = setTimeout(finishEnter, MINI_ENTER_MS + 250);
    }

    function exitMiniMode() {
        if (miniState !== 'mini') return;
        if (isCtxOpen) hideCtxMenu();
        const gen = ++miniAnimGen;
        miniState = 'exiting';
        cancelPendingCommit();

        const targetZoom = savedZoom;

        // 左上角固定：imageScreenX/Y 不变，只改 zoom 和窗口尺寸

        // reduced-motion：直接到最终状态
        if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) {
            zoom = targetZoom;
            isMinimized = false;
            miniState = 'normal';
            document.body.classList.remove('mini-mode');
            applyTransformOnly();
            commitWindowRect();
            showZoomLabel();
            // 0.23.12：mini 退出后恢复文字图层
            setPinTextLayerHidden(false);
            relayoutPinTextLayer();
            return;
        }

        // Phase 1：先扩窗口（位置不变，imageScreenX/Y 不变）
        // transform 保持 scale(miniZoom)，用显式 zoom 提交大窗口
        img.style.transition = '';
        // 切换边框为 normal 补偿（基于 targetZoom）
        const s = targetZoom;
        img.style.border = '';
        img.style.borderRadius = '';
        img.style.boxShadow =
            `0 0 0 ${1 / s}px rgba(74, 158, 255, 0.55), ` +
            `0 0 ${14 / s}px ${3 / s}px rgba(74, 158, 255, 0.28)`;
        commitWindowRect(targetZoom);

        // Phase 2：等窗口稳定后 CSS transform 纯 scale 展开
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                if (gen !== miniAnimGen) return;
                zoom = targetZoom;
                img.style.transition = `transform ${MINI_EXIT_MS}ms ${MINI_EASING}`;
                img.style.transform = `scale(${targetZoom})`;
                const finishExit = () => {
                    if (gen !== miniAnimGen) return;
                    img.removeEventListener('transitionend', onTransEnd);
                    clearTimeout(fallback);
                    img.style.transition = '';
                    isMinimized = false;
                    miniState = 'normal';
                    document.body.classList.remove('mini-mode');
                    applyTransformOnly();
                    showZoomLabel();
                    // 0.23.12：mini 退出后恢复文字图层
                    setPinTextLayerHidden(false);
                    relayoutPinTextLayer();
                    if (pendingReconcileDpr !== null) {
                        const dpr = pendingReconcileDpr;
                        pendingReconcileDpr = null;
                        reconcileFromBackend(dpr);
                    }
                };
                const onTransEnd = (e) => {
                    if (e.target !== img || e.propertyName !== 'transform') return;
                    finishExit();
                };
                img.addEventListener('transitionend', onTransEnd);
                const fallback = setTimeout(finishExit, MINI_EXIT_MS + 250);
            });
        });
    }

    // ── 后端 eval 入口 ──────────────────────────────────────

    // 后端复用窗口时通过 eval 调用此函数重置状态
    // sourceDpr 由后端从图片初始落点显示器算出，不依赖 window.devicePixelRatio
    window.__blinkResetPin = function (dataUrl, pngW, pngH, screenX, screenY, showTranslating, sourceDpr) {
        invalidatePinSession();
        resetCtxExpansion();
        sourcePixelW = pngW;
        sourcePixelH = pngH;
        const sdpr = sourceDpr || 1;
        monitorDpr = sdpr;
        const {baseCssW: bw, baseCssH: bh} = baseCssSize(pngW, pngH, sdpr);
        baseCssW = bw;
        baseCssH = bh;
        zoom = 1;
        // 0.23.12：新会话清空上一图的文字图层
        exitPinTextLayer();
        isMinimized = false;
        savedZoom = 1;
        miniState = 'normal';
        miniAnimGen++;
        pendingReconcileDpr = null;
        reconcileGen = 0;
        commitGen = 0;
        cancelPendingCommit();
        img.style.transition = '';
        document.body.classList.remove('mini-mode');
        imageScreenX = screenX || 0;
        imageScreenY = screenY || 0;
        zoomLabel.textContent = '100%';
        zoomLabel.style.opacity = '0';
        // CSS 布局：left/top = padding（CSS 逻辑像素，含菜单扩窗补偿位），width/height = baseCss
        setImgAnchor();
        img.style.width = baseCssW + 'px';
        img.style.height = baseCssH + 'px';
        img.style.transformOrigin = '0 0';
        img.style.transform = 'scale(1)';
        img.style.boxShadow = '';
        img.style.border = '';
        img.style.borderRadius = '';
        img.src = dataUrl;
        commitWindowRect();
        if (showTranslating) {
            showTranslatingIndicator();
        } else {
            hideTranslatingIndicator();
        }
        updatePinIndicatorPosition();
    };

    // 原地刷新 pin 图片（不重定位、不重置缩放）
    window.__blinkRefreshPinImage = function (dataUrl, w, h, showTranslating, expectedSeq) {
        if (Number.isSafeInteger(expectedSeq) && currentPinImageSeq() !== expectedSeq) {
            console.warn('[pin] 丢弃过期图片刷新', {expectedSeq, currentSeq: currentPinImageSeq()});
            return;
        }
        if (w === sourcePixelW && h === sourcePixelH) {
            img.src = dataUrl;
        } else {
            console.warn('[pin] 译文 PNG 尺寸与原图不一致，重置缩放', {
                old: {w: sourcePixelW, h: sourcePixelH},
                new: {w, h}
            });
            sourcePixelW = w;
            sourcePixelH = h;
            const {baseCssW: bw, baseCssH: bh} = baseCssSize(w, h, monitorDpr);
            baseCssW = bw;
            baseCssH = bh;
            img.style.width = baseCssW + 'px';
            img.style.height = baseCssH + 'px';
            img.src = dataUrl;
            updatePinIndicatorPosition();
        }
        if (!showTranslating) {
            hideTranslatingIndicator();
        } else {
            showTranslatingIndicator();
        }
    };

    // N+1 回收时后端 eval 调用，清空图片和状态
    window.__blinkClearPin = function () {
        invalidatePinSession();
        resetCtxExpansion();
        img.src = '';
        sourcePixelW = 0;
        sourcePixelH = 0;
        baseCssW = 0;
        baseCssH = 0;
        zoom = 1;
        isMinimized = false;
        savedZoom = 1;
        miniState = 'normal';
        miniAnimGen++;
        pendingReconcileDpr = null;
        monitorDpr = 1;
        cancelPendingCommit();
        document.body.classList.remove('mini-mode');
        img.style.transition = '';
        img.style.transform = 'scale(1)';
        img.style.boxShadow = '';
        img.style.border = '';
        img.style.borderRadius = '';
        zoomLabel.style.opacity = '0';
        hideTranslatingIndicator();
        // 0.23.12：回收清空文字图层
        exitPinTextLayer();
        // 通知后端：回收完成，可被借用
        pinSpareReady().catch((e) => {
            const err = normalizeError(e);
            console.error(`pin_spare_ready (recycle) 调用失败: [${err.code}] ${err.message}`);
        });
    };

    img.addEventListener('load', () => {
        if (sourcePixelW === 0 || sourcePixelH === 0) {
            sourcePixelW = img.naturalWidth;
            sourcePixelH = img.naturalHeight;
            const dpr = monitorDpr || 1;
            const {baseCssW: bw, baseCssH: bh} = baseCssSize(sourcePixelW, sourcePixelH, dpr);
            baseCssW = bw;
            baseCssH = bh;
            img.style.width = baseCssW + 'px';
            img.style.height = baseCssH + 'px';
        }
        showZoomLabel();
        // 0.23.12：图片（重）加载后层几何保底重算（翻译替换换 src 后触发 load）
        relayoutPinTextLayer();
    });

    // ── 原生拖动（Tauri startDragging）─────────────────────────
    // 系统处理鼠标捕获、跨屏边界和高频移动，移除每帧 IPC。
    // 只在图片可见区域按下左键时触发。
    // 移动阈值后再启动原生拖动，避免吞掉 click/dblclick。
    const DRAG_THRESHOLD = 5; // CSS px — 低于此位移视为点击
    let dragCandidate = null;   // { pointerId, x, y } 或 null
    let nativeDragActive = false;
    let dragSession = 0;        // 每次 pointerdown 递增，作废在途 watchdog 的过期结果
    // 吞残余 click 的截止时间。原生拖动（startDragging 模态循环）结束后浏览器
    // 往往根本不派发残余 click——若用永久布尔标志，会滞留吞掉用户下一次真实
    // 点击（表现为"拖完 pin 后第一次左键没反应"）。改为限时窗口，过期自动失效。
    let suppressClickUntil = 0;

    document.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        if (isMiniAnimating()) return;
        // 菜单外按下左键 = 关菜单（Windows 菜单语义：按下即关）。不用 click：
        // click 在松开时才派发且可能被拖动残余逻辑吞掉，手感上"关不掉"。
        if (isCtxOpen && !e.target.closest('#ctx-menu')) {
            hideCtxMenu();
        }
        if (e.target.closest('#ctx-menu')) return;
        // 检查是否点在图片可见区域内
        const imgLeft = PIN_PAD_CSS;
        const imgTop = PIN_PAD_CSS;
        const imgVisW = baseCssW * zoom;
        const imgVisH = baseCssH * zoom;
        if (e.clientX < imgLeft || e.clientX > imgLeft + imgVisW ||
            e.clientY < imgTop || e.clientY > imgTop + imgVisH) {
            return;
        }
        dragCandidate = {pointerId: e.pointerId, x: e.clientX, y: e.clientY};
        nativeDragActive = false;
        dragSession++;
    });

    document.addEventListener('pointermove', (e) => {
        if (!dragCandidate || e.pointerId !== dragCandidate.pointerId) return;
        if (!(e.buttons & 1)) return;
        const dx = e.clientX - dragCandidate.x;
        const dy = e.clientY - dragCandidate.y;
        if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        // 达到阈值，启动系统原生拖动；菜单开着则先收起（拖动即关菜单）
        dragCandidate = null;
        nativeDragActive = true;
        if (isCtxOpen) hideCtxMenu();
        tauriWin?.startDragging?.().catch(() => {
            nativeDragActive = false;
        });
    });

    document.addEventListener('pointerup', () => {
        dragCandidate = null;
        if (!nativeDragActive) return;
        nativeDragActive = false;
        suppressClickUntil = Date.now() + 250;
        dragEndTime = Date.now();
        // 拖动刚结束，reconcile 从后端读真实位置
        reconcileFromBackend();
    });

    document.addEventListener('pointercancel', () => {
        dragCandidate = null;
        nativeDragActive = false;
    });

    // 吞掉原生拖动后浏览器可能产生的残余 click（capture 阶段，限时窗口内仅一次）
    document.addEventListener('click', (e) => {
        if (Date.now() >= suppressClickUntil) {
            suppressClickUntil = 0;
            return;
        }
        suppressClickUntil = 0;
        e.stopPropagation();
        e.preventDefault();
    }, true);

    // ── DPI 变化监听 ──────────────────────────────────────────
    // onScaleChanged: payload 可能有 { scaleFactor } 或直接是 number
    if (tauriWin?.onScaleChanged) {
        tauriWin.onScaleChanged((event) => {
            const payload = event?.payload ?? event;
            const newScaleFactor = payload?.scaleFactor ?? payload;
            if (typeof newScaleFactor === 'number' && newScaleFactor > 0) {
                tracing_debug('onScaleChanged', {newScaleFactor, oldDpr: monitorDpr});
                // 扩窗平移量按旧 DPR 算的物理值，DPI 翻转后语义失效——先还原再 reconcile
                if (isCtxOpen) hideCtxMenu();
                reconcileFromBackend(newScaleFactor);
            }
        }).catch(() => {
        });
    }

    // onMoved: 窗口移动后 debounce reconcile（备份机制，确保拖动后状态正确）
    let movedDebounce = 0;
    // 模态拖动中 pointerup 收不到，安全网只能靠「物理左键是否还按着」判定拖动
    // 是否真正结束。停顿 150ms 可能只是拖动中的暂停——此时清 nativeDragActive
    // 会让滚轮拦截失效（用过期坐标提交窗口，定位闪回归），且中途回读+回设矩形
    // 会跟系统 move loop 打架。所以查到左键仍按住时：继续等，不做 reconcile。
    async function dragEndWatchdog() {
        const session = dragSession;
        if (!nativeDragActive) {
            reconcileFromBackend();
            return;
        }
        let leftDown = true;
        try {
            leftDown = await win32LeftButtonDown();
        } catch (e) {
            const err = normalizeError(e);
            console.error(`win32_left_button_down 失败 [${err.code}] ${err.message}`);
        }
        if (session !== dragSession) return; // 期间开始了新的按下会话，本次结果作废
        if (leftDown) {
            // 先清再挂：await IPC 期间 onMoved 可能又挂了新 timer，不清会产生并行探测链
            clearTimeout(movedDebounce);
            movedDebounce = setTimeout(dragEndWatchdog, 150);
            return;
        }
        nativeDragActive = false;
        suppressClickUntil = Date.now() + 250;
        dragEndTime = Date.now();
        reconcileFromBackend();
    }

    if (tauriWin?.onMoved) {
        tauriWin.onMoved(() => {
            clearTimeout(movedDebounce);
            movedDebounce = setTimeout(dragEndWatchdog, 150);
        }).catch(() => {
        });
    }

    // ── 滚轮缩放（左上角固定锚点）────────────────────────────────
    document.addEventListener('wheel', (e) => {
        if (isMiniAnimating()) return;
        e.preventDefault();
        // 原生拖动（startDragging 模态循环）进行中忽略滚轮：窗口位置由系统控制，
        // JS 的 imageScreenX/Y 已过期，此时 commitWindowRect 会用拖动前旧坐标把
        // 窗口拽回去再被 move loop 拽回，表现为定位闪。WM_MOUSEWHEEL 跟键盘焦点
        // 走、不进鼠标捕获，拖动中仍会派发到页面，必须在此显式忽略。
        // nativeDragActive 由 dragEndWatchdog 用物理左键态维护，拖动中停顿不会误清。
        if (nativeDragActive) return;
        // 缩小态下滚轮：先恢复正常态，本次不叠加缩放
        if (isMinimized) {
            exitMiniMode();
            return;
        }
        const step = e.ctrlKey ? 0.25 : 0.1;
        const delta = e.deltaY > 0 ? -step : step;
        const newZoom = clampZoom(zoom + delta);
        if (newZoom === zoom) return;

        // 左上角固定：imageScreenX/Y 不变，只改 zoom
        zoom = newZoom;
        applyTransformOnly();
        scheduleCommitWindowRect();
        showZoomLabel();
        // 0.23.12：文字图层几何随 zoom 重算（选择状态保留）
        relayoutPinTextLayer();
    }, {passive: false});

    // 双击：切换缩小/还原模式
    document.addEventListener('dblclick', (e) => {
        if (e.target.closest('#ctx-menu')) return;
        if (isMiniAnimating()) return;
        // 翻译中不打断
        const indicator = document.getElementById('pin-translating-indicator');
        if (indicator && !indicator.classList.contains('hidden')) return;

        if (isMinimized) {
            exitMiniMode();
        } else {
            enterMiniMode();
        }
    });

    // ── 右键菜单 ──────────────────────────────────────────────
    document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (isMiniAnimating()) return;
        // 拖动刚结束的极短窗口内忽略右键（防拖动收尾误触；原 200ms 会吃掉
        // "拖完立刻右键"的正常操作节奏，收窄到 80ms）
        if (Date.now() - dragEndTime < 80) return;
        // 右键落在已打开的菜单上同样重定位菜单（小 pin 上菜单可能盖住大部分
        // 图片，静默忽略会让用户以为"没反应"、要按第二次）
        showCtxMenu(e.clientX, e.clientY);
    });

    document.addEventListener('keydown', (e) => {
        // 0.23.12：文字图层划选复制（pin 无输入控件，直接消费）
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
            const sel = getPinTextLayerSelection();
            if (sel) {
                e.preventDefault();
                copyToClipboard(sel).catch((err) => {
                    const nerr = normalizeError(err);
                    console.error(`复制失败 [${nerr.code}] ${nerr.message}`);
                });
            }
            return;
        }
        if (e.key === 'Escape') {
            if (isCtxOpen) {
                hideCtxMenu();
            } else if (isMinimized) {
                exitMiniMode();
            } else if (clearPinTextSelection()) {
                // 划选中 Escape 只清选择，不关 pin（误按保护）
            } else {
                closePin();
            }
        }
    });

    /** 右键菜单显示——窗口放不下完整菜单时临时扩窗；定位钳制在窗口可视区域内，防止越界被裁。
     *  async：扩窗避让需查一次工作区（pin_work_area IPC）。 */
    async function showCtxMenu(x, y) {
        // mini 模式只保留重置缩放 + 关闭
        ctxMenu.classList.toggle('ctx-menu-mini', isMinimized);
        // 0.23.12：文字图层状态化菜单——有划选时提供复制；原文层激活时
        // 「识别文字」变「关闭识别」（译文层激活保持原文语义可重挂）
        const ctxCopyText = document.getElementById('ctx-copy-text');
        if (ctxCopyText) {
            ctxCopyText.classList.toggle('hidden', !getPinTextLayerSelection());
        }
        const ctxOcrBtn = document.getElementById('ctx-ocr');
        if (ctxOcrBtn) {
            ctxOcrBtn.textContent = getPinTextLayerKind() === 'source' ? '关闭识别' : '识别文字';
        }
        ctxMenu.classList.remove('hidden');
        // 先显示才能测量尺寸（菜单 CSS 尺寸不随窗口 resize 变化，此处测量即最终值）
        const rect = ctxMenu.getBoundingClientRect();
        const EDGE = 4;

        let winW = window.innerWidth;
        let winH = window.innerHeight;
        let shiftCssX = menuShiftCss.x;
        let shiftCssY = menuShiftCss.y;
        const needW = Math.ceil(rect.width) + EDGE * 2;
        const needH = Math.ceil(rect.height) + EDGE * 2;
        if (needW > winW || needH > winH) {
            const targetW = Math.max(needW, winW);
            const targetH = Math.max(needH, winH);
            const shift = await computeExpandShift(targetW, targetH);
            // await 期间菜单可能已被关闭（pointerdown dismiss / ESC），过期打开直接放弃
            if (ctxMenu.classList.contains('hidden')) return;
            ctxExpand = {cssW: targetW, cssH: targetH, shiftX: shift.x, shiftY: shift.y};
            menuShiftCss = {x: shift.x / monitorDpr, y: shift.y / monitorDpr};
            shiftCssX = menuShiftCss.x;
            shiftCssY = menuShiftCss.y;
            setImgAnchor();
            applyTransformOnly();
            relayoutPinTextLayer();
            commitWindowRect();
            winW = targetW;
            winH = targetH;
        }
        let mx = x + shiftCssX;
        let my = y + shiftCssY;
        // 右越界 → 左移
        if (mx + rect.width > winW - EDGE) {
            mx = Math.max(EDGE, winW - rect.width - EDGE);
        }
        // 下越界 → 上移
        if (my + rect.height > winH - EDGE) {
            my = Math.max(EDGE, winH - rect.height - EDGE);
        }
        ctxMenu.style.left = mx + 'px';
        ctxMenu.style.top = my + 'px';
        isCtxOpen = true;
    }

    /** 计算菜单扩窗避让屏幕边缘所需的左/上平移（物理像素）。
     *  扩窗默认只向右/下（origin 不动 → 图片物理位置不动）；右/下边界超出
     *  工作区时把窗口左/上移回，平移量不超过扩大量、不越过工作区左/上沿。
     *  查询失败返回 0（只向右/下扩，极端贴边时菜单仍可能被屏缘裁切，可接受降级）。 */
    async function computeExpandShift(targetCssW, targetCssH) {
        const shift = {x: 0, y: 0};
        let wa = null;
        try {
            wa = await pinWorkArea(myLabel);
        } catch (e) {
            const err = normalizeError(e);
            console.warn(`pin_work_area 失败 [${err.code}] ${err.message}，扩窗不做边缘避让`);
        }
        if (!wa) return shift;
        const padPhys = Math.round(PIN_PAD_CSS * monitorDpr);
        const winX = imageScreenX - padPhys;
        const winY = imageScreenY - padPhys;
        const overRight = (winX + Math.round(targetCssW * monitorDpr)) - (wa.x + wa.w);
        shift.x = Math.min(Math.max(0, overRight), Math.max(0, winX - wa.x));
        const overBottom = (winY + Math.round(targetCssH * monitorDpr)) - (wa.y + wa.h);
        shift.y = Math.min(Math.max(0, overBottom), Math.max(0, winY - wa.y));
        return shift;
    }

    function hideCtxMenu() {
        ctxMenu.classList.add('hidden');
        isCtxOpen = false;
        if (ctxExpand) {
            ctxExpand = null;
            menuShiftCss = {x: 0, y: 0};
            setImgAnchor();
            applyTransformOnly();
            relayoutPinTextLayer();
            if (!isMiniAnimating()) commitWindowRect();
        }
    }

    /** 会话重置（__blinkResetPin / __blinkClearPin）时清掉菜单与扩窗状态。
     *  不做还原提交——调用方随后会按新状态提交窗口矩形。 */
    function resetCtxExpansion() {
        ctxMenu.classList.add('hidden');
        isCtxOpen = false;
        ctxExpand = null;
        menuShiftCss = {x: 0, y: 0};
    }

    document.getElementById('ctx-edit-image').addEventListener('click', () => {
        hideCtxMenu();
        // 0.23.12：进编辑器前清文字图层（编辑会改图，层数据失效）
        exitPinTextLayer();
        openImageEditorFromPin(myLabel)
            .catch((e) => {
                const err = normalizeError(e);
                // 0.20.7：同时判断 code 与 detail.reason，避免新增其他 invalid_state 被误判
                if (err.code === 'invalid_state' && err.detail?.reason === 'already_active') {
                    console.info('[pin] 编辑会话已活跃，后端已激活现有编辑器');
                } else if (err.code === 'not_found') {
                    console.warn('[pin] 图片不存在或窗口已关闭');
                } else {
                    console.error(`[pin] 从 pin 图打开编辑器失败 [${err.code}] ${err.message}`);
                }
            });
    });

    document.getElementById('ctx-close').addEventListener('click', () => {
        hideCtxMenu();
        closePin();
    });

    document.getElementById('ctx-reset-zoom').addEventListener('click', () => {
        hideCtxMenu();
        if (isMinimized) {
            exitMiniMode();
            savedZoom = 1;
        } else {
            // 左上角固定：imageScreenX/Y 不变
            zoom = 1;
            cancelPendingCommit();
            applyTransformOnly();
            commitWindowRect();
            showZoomLabel();
            relayoutPinTextLayer();
        }
    });

    document.getElementById('ctx-copy').addEventListener('click', async () => {
        hideCtxMenu();
        try {
            const png = await pinImageToPng();
            await pinSaveClipboard(png);
        } catch (e) {
            const err = normalizeError(e);
            console.error(`保存到剪贴板失败 [${err.code}] ${err.message}`);
        }
    });

    document.getElementById('ctx-save-as').addEventListener('click', async () => {
        hideCtxMenu();
        try {
            const png = await pinImageToPng();
            await pinSaveAs(png);
        } catch (e) {
            const err = normalizeError(e);
            if (!err.message.includes('用户取消了保存')) {
                console.error(`另存为失败 [${err.code}] ${err.message}`);
            }
        }
    });

    // ── pin 窗口内 OCR / 翻译（0.23.12：文字图层化） ─────────────
    // 「识别文字」：OCR → 图上原文划词层（字符级，char_boxes 优先，
    // word 降级）。不再弹文本面板，无文字/失败提示走 toast；
    // 激活后菜单项变「关闭识别」。划词空白放行窗口拖动见 pin-text-layer.js。

    /** 把 pin 窗口图片编码为 PNG bytes(通过 canvas)。
     *  用 img 的资源像素尺寸,不带 zoom scale——OCR 需要原图。 */
    function pinImageToPng() {
        return new Promise((resolve, reject) => {
            if (!sourcePixelW || !sourcePixelH || !img.src) {
                reject(new Error('图片未加载'));
                return;
            }
            const c = document.createElement('canvas');
            c.width = sourcePixelW;
            c.height = sourcePixelH;
            const cc = c.getContext('2d');
            try {
                cc.drawImage(img, 0, 0, sourcePixelW, sourcePixelH);
                c.toBlob((blob) => {
                    if (!blob) {
                        reject(new Error('toBlob 失败'));
                        return;
                    }
                    blob.arrayBuffer().then((buf) => resolve(new Uint8Array(buf))).catch(reject);
                }, 'image/png');
            } catch (e) {
                reject(e);
            }
        });
    }

    async function runPinOcr() {
        if (ocrBusy) return;
        const generation = pinSessionGeneration;
        ocrBusy = true;
        let ocrHandle = null;
        try {
            const png = await pinImageToPng();
            if (generation !== pinSessionGeneration) return;
            // Task 11: ocrImage 返回 handle，不是 promise；用 .promise 取结果
            ocrHandle = ocrImage(png);
            activePinOcrHandle = ocrHandle;
            const {result} = await ocrHandle.promise;
            if (generation !== pinSessionGeneration) return;
            const items = sourceItemsFromOcrResult(result);
            if (items.length === 0) {
                showPinToast('未识别到文字');
                return;
            }
            enterPinTextLayer({
                items,
                fullText: typeof result?.text === 'string' ? result.text : '',
                kind: 'source',
                getGeometry: pinTextLayerGeometry,
            });
        } catch (e) {
            if (generation !== pinSessionGeneration) return;
            const err = normalizeError(e);
            console.error(`[pin OCR] [${err.code}] ${err.message}`);
            showPinToast(`识别失败：${err.message}`);
            // Task 11: 出错时取消在途请求
            if (ocrHandle) ocrHandle.cancel().catch(() => {
            });
        } finally {
            if (activePinOcrHandle === ocrHandle) activePinOcrHandle = null;
            if (generation === pinSessionGeneration) ocrBusy = false;
        }
    }

    document.getElementById('ctx-ocr').addEventListener('click', () => {
        hideCtxMenu();
        // 原文层已激活 → 切换为关闭；译文层激活 → 重挂原文层（翻译后重新识别）
        if (getPinTextLayerKind() === 'source') {
            exitPinTextLayer();
        } else {
            runPinOcr();
        }
    });

    // 0.23.12：右键复制划选文字（菜单项有划选时才显示，见 showCtxMenu）
    document.getElementById('ctx-copy-text').addEventListener('click', () => {
        hideCtxMenu();
        const sel = getPinTextLayerSelection();
        if (!sel) return;
        copyToClipboard(sel).catch((e) => {
            const err = normalizeError(e);
            console.error(`复制失败 [${err.code}] ${err.message}`);
        });
    });

    // ── 0.23.12：右键翻译改为「翻译覆盖」语义 ──────────────────
    // 对当前 pin 图做 OCR + 批量翻译 + annotation-engine 嵌图渲染（与截图
    // 「翻译并钉图」同一渲染引擎），经 screenshot_pin_refresh_by_label 原地
    // 替换注册表与显示；替换后本菜单项变为「还原原图」，点击恢复原图。
    // 原图仅保存在本会话内存中，应用重启后不可还原。
    const ctxTranslateBtn = document.getElementById('ctx-translate');

    /** 菜单项文案跟随状态：未覆盖 → 翻译图片；已覆盖 → 还原原图。 */
    function updateCtxTranslateLabel() {
        ctxTranslateBtn.textContent = pinOverlayBusy
            ? '翻译中…'
            : (pinOriginalPng ? '还原原图' : '翻译图片');
    }

    /** 把 PNG bytes 解码到离屏 canvas（尺寸即图片像素尺寸）。 */
    async function decodePngToCanvas(pngBytes) {
        const blob = new Blob([pngBytes], {type: 'image/png'});
        const bitmap = await createImageBitmap(blob);
        const c = document.createElement('canvas');
        c.width = bitmap.width;
        c.height = bitmap.height;
        const cc = c.getContext('2d', {willReadFrequently: true});
        cc.drawImage(bitmap, 0, 0);
        bitmap.close?.();
        return c;
    }

    async function canvasToPngBytes(c) {
        const blob = await new Promise((resolve) => c.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('toBlob 失败');
        return new Uint8Array(await blob.arrayBuffer());
    }

    /** 翻译覆盖：OCR → 批量翻译（逐行降级）→ 嵌图合成 → 按 label 原地替换。 */
    async function translatePinImageOverlay() {
        if (pinOverlayBusy) return;
        const generation = pinSessionGeneration;
        const expectedSeq = currentPinImageSeq();
        if (expectedSeq === null) {
            showPinToast('图片尚未就绪，请稍后重试');
            return;
        }
        pinOverlayBusy = true;
        updateCtxTranslateLabel();
        showTranslatingIndicator();
        let overlayOcrHandle = null;
        try {
            const originalPng = await pinImageToPng();
            if (generation !== pinSessionGeneration) return;

            // OCR（Task 11 handle 接口）
            const ocrHandle = ocrImage(originalPng);
            overlayOcrHandle = ocrHandle;
            activeOverlayOcrHandle = ocrHandle;
            let result;
            try {
                ({result} = await ocrHandle.promise);
            } catch (e) {
                ocrHandle.cancel().catch(() => {
                });
                throw e;
            }
            if (generation !== pinSessionGeneration) return;
            const lines = annotEngine.toOverlayLines(result);
            if (lines.length === 0) {
                // 无文字：toast 提示，不打断 pin 图（菜单项保持「翻译图片」）
                console.info('[pin] 翻译覆盖：未识别到文字，跳过');
                showPinToast('未识别到文字，跳过翻译');
                return;
            }

            // 批量翻译，失败降级逐行（与截图 doTranslateAndPin 同策略）
            const srcs = lines.map((ln) => ln.srcText);
            let translations;
            try {
                translations = await translateLines(srcs, null);
            } catch (e) {
                console.warn('[pin] 翻译覆盖：批量翻译失败，降级逐行', e);
                translations = [];
                for (const src of srcs) {
                    if (generation !== pinSessionGeneration) return;
                    try {
                        translations.push(await translateText(src, null));
                    } catch (_) {
                        translations.push(src);
                    }
                }
            }
            if (generation !== pinSessionGeneration) return;

            // job-local overlay（与截图 composeTranslatedPinPng 同构）+ 嵌图渲染
            const jobOverlay = {
                lines: lines.map((ln, i) => ({
                    ...ln,
                    dstText: translations[i] || null,
                    bgColor: null,
                    inkColor: null,
                })),
                mode: 'translated',
                bgStrategy: 'average',
                fontScale: 1.0,
                showOriginal: false,
                translationTargetLang: null,
            };
            const baseCanvas = await decodePngToCanvas(originalPng);
            const baseCtx = baseCanvas.getContext('2d');
            // reset 提供底图采样源（背景平均色/字色采样依赖 cropImageData）
            annotEngine.reset(baseCanvas.width, baseCanvas.height,
                baseCtx.getImageData(0, 0, baseCanvas.width, baseCanvas.height));
            annotEngine.renderOverlaySnapshotTo(jobOverlay, baseCtx,
                baseCanvas.width, baseCanvas.height);
            const translatedPng = await canvasToPngBytes(baseCanvas);
            if (generation !== pinSessionGeneration) return;

            // 原地替换：后端注册表 + 显示同步（__blinkRefreshPinImage 换 img.src）
            await screenshotPinRefreshByLabel(translatedPng, myLabel, false, expectedSeq);
            if (generation !== pinSessionGeneration) return;
            pinOriginalPng = originalPng;
            // 0.23.12：译文烧入后挂行级译文划词层（划词取译文文本，
            // 空白放行窗口拖动；原图层若是原文识别层则被替换）
            enterPinTextLayer({
                items: translatedItemsFromLines(lines.map((ln, i) => ({
                    ...ln,
                    dstText: translations[i] || null,
                }))),
                fullText: lines.map((ln, i) => translations[i] || ln.srcText || '').join('\n'),
                kind: 'translated',
                getGeometry: pinTextLayerGeometry,
            });
        } catch (e) {
            if (generation !== pinSessionGeneration) return;
            const err = normalizeError(e);
            console.error(`[pin] 翻译覆盖失败 [${err.code}] ${err.message}`);
            showPinToast(`翻译失败：${err.message}`);
        } finally {
            if (activeOverlayOcrHandle === overlayOcrHandle) activeOverlayOcrHandle = null;
            if (generation === pinSessionGeneration) {
                pinOverlayBusy = false;
                updateCtxTranslateLabel();
                hideTranslatingIndicator();
            }
        }
    }

    /** 还原原图：把覆盖前的 PNG 写回注册表并换回显示。 */
    async function restorePinOriginal() {
        if (pinOverlayBusy || !pinOriginalPng) return;
        const generation = pinSessionGeneration;
        const expectedSeq = currentPinImageSeq();
        if (expectedSeq === null) return;
        const originalPng = pinOriginalPng;
        pinOverlayBusy = true;
        updateCtxTranslateLabel();
        try {
            await screenshotPinRefreshByLabel(originalPng, myLabel, false, expectedSeq);
            if (generation !== pinSessionGeneration) return;
            pinOriginalPng = null;
            // 0.23.12：译文层基于覆盖图，还原原图即清层
            exitPinTextLayer();
        } catch (e) {
            if (generation !== pinSessionGeneration) return;
            const err = normalizeError(e);
            console.error(`[pin] 还原原图失败 [${err.code}] ${err.message}`);
        } finally {
            if (generation === pinSessionGeneration) {
                pinOverlayBusy = false;
                updateCtxTranslateLabel();
            }
        }
    }

    ctxTranslateBtn.addEventListener('click', () => {
        hideCtxMenu();
        if (pinOriginalPng) {
            restorePinOriginal();
        } else {
            translatePinImageOverlay();
        }
    });

    // ── 翻译中指示器 ──────────────────────────────────────────
    function showTranslatingIndicator() {
        const el = document.getElementById('pin-translating-indicator');
        if (el) el.classList.remove('hidden');
        updatePinIndicatorPosition();
        const ctxTranslate = document.getElementById('ctx-translate');
        if (ctxTranslate) ctxTranslate.disabled = true;
    }

    function hideTranslatingIndicator() {
        const el = document.getElementById('pin-translating-indicator');
        if (el) el.classList.add('hidden');
        const ctxTranslate = document.getElementById('ctx-translate');
        if (ctxTranslate) ctxTranslate.disabled = false;
    }

    function closePin() {
        invalidatePinSession();
        exitPinTextLayer();
        invoke('screenshot_pin_hide', {label: myLabel}).catch((e) => {
            const err = normalizeError(e);
            console.error(`screenshot_pin_hide 失败 [${err.code}] ${err.message}`);
        });
    }

    // 必须放在模块末尾：ready 表示 __blinkResetPin、拖动/滚轮监听器等均已安装完成。
    // 提前通知会让后端在模块仍初始化时借出 spare，暴露半初始化窗口。
    if (isPreheat) {
        pinSpareReady().catch((e) => {
            const err = normalizeError(e);
            console.error(`pin_spare_ready 失败 [${err.code}] ${err.message}`);
        });
    }
</script>
</body>
</html>
