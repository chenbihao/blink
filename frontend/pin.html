<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Blink Pin</title>
    <link rel="stylesheet" href="css/entries/pin.css" />
  </head>
  <body>
    <!--
      丝滑缩放架构（transform scale + 左上角固定 + 离散窗口 resize）：
      - 图片固定为原始物理尺寸（width/height 不变），用 transform: scale() 缩放。
        transform 是 GPU 合成层属性，零 reflow，60fps 丝滑无跳变。
      - 左上角固定缩放：窗口位置（imgScreenX/Y）缩放时不动，只改尺寸。
        transformOrigin 固定 0,0，scale 时图片左上不动、右下角伸缩，视觉完全连续。
      - 窗口尺寸跟随 scale，但只在 scale 跨越 ±5% 阈值时 resize 一次（离散），
        避免每次 wheel 都 resize 窗口（Win32 resize 同步重绘，会跳）。
      - 拖动：只改窗口位置（screenshotPinTransform），不改尺寸。
      - 多 Pin N+1：每个 pin 窗口通过 label 标识，IPC 调用传 label 定位目标窗口。
    -->
    <div id="container">
      <img id="pin-img" src="" alt="钉图" draggable="false" />
      <div id="zoom-level">100%</div>
      <!-- 0.18.3：翻译中指示器（不随 img transform: scale 缩放，独立固定视觉大小） -->
      <div id="pin-translating-indicator" class="hidden">
        <div class="pin-spinner"></div>
        <span class="pin-translating-text">翻译中</span>
      </div>
    </div>

    <!-- 右键菜单 -->
    <div id="ctx-menu" class="hidden">
      <button id="ctx-ocr">识别文字</button>
      <button id="ctx-translate">翻译文字</button>
      <div class="ctx-sep"></div>
      <button id="ctx-copy">保存到剪贴板</button>
      <button id="ctx-save-as">另存为</button>
      <div class="ctx-sep"></div>
      <button id="ctx-reset-zoom">重置缩放</button>
      <button id="ctx-close">关闭</button>
    </div>

    <!-- OCR 结果浮层（0.11.9-f：pin 窗口内 OCR 后展示） -->
    <div id="pin-ocr-panel" class="hidden">
      <div class="pin-ocr-header">
        <div class="pin-ocr-tabs">
          <button class="pin-ocr-tab active" data-tab="source">原文</button>
          <button class="pin-ocr-tab" data-tab="translated">译文 <span class="stale-dot" aria-hidden="true"></span></button>
        </div>
        <button id="pin-ocr-close">✕</button>
      </div>
      <textarea id="pin-ocr-source" spellcheck="false"></textarea>
      <textarea id="pin-ocr-translated" spellcheck="false" hidden placeholder="点击"翻译"按钮生成译文"></textarea>
      <div class="pin-ocr-footer">
        <button id="pin-ocr-translate">翻译</button>
        <button id="pin-ocr-copy" class="primary">复制</button>
      </div>
    </div>

    <script type="module">
      import { invoke, screenshotPinTransform, screenshotPinMove, ocrImage, translateText, pinSpareReady, pinSaveClipboard, pinSaveAs } from "./js/shared/api.js";
      import { normalizeError, getCurrentWindow } from "./js/shared/tauri.js";
      import { applyThemeFromConfig } from "./js/shared/theme.js";

      // 应用主题（右键菜单 / OCR 面板的 token 引用随用户主题切换）
      applyThemeFromConfig();

      const PAD = 20;       // 与后端 PIN_PAD 一致（物理像素，给发光留空间）
      const GLOW_RADIUS = 18; // 发光视觉半径（1px spread + 14px blur ≈ 18px）
      const MINI_MAX_SIDE = 160; // 缩小态最长边（CSS 像素）

      const img = document.getElementById('pin-img');
      const zoomLabel = document.getElementById('zoom-level');
      const ctxMenu = document.getElementById('ctx-menu');

      // ── 多 Pin：当前窗口 label ──
      const myLabel = getCurrentWindow()?.label || 'pin-unknown';

      // ── 预热模式：?preheat=1 时不加载图片，只通知后端就绪 ──
      const params = new URLSearchParams(location.search);
      const isPreheat = params.get('preheat') === '1';
      if (isPreheat) {
        pinSpareReady().catch((e) => console.error('pin_spare_ready 失败', e));
      }

      // ── 核心状态 ──
      let physW = 0, physH = 0;             // 图片原始物理尺寸
      let scale = 1;                         // 当前总缩放比例
      let imgScreenX = 0, imgScreenY = 0;   // 图片左上角屏幕物理坐标（按 scale 算）
      let winScale = 1;
      let isMinimized = false;               // 缩小态标志
      let savedScale = 1;                    // 进入缩小态前的 scale

      // 拖动状态
      let isDragging = false;
      let dragLastPhysX = 0, dragLastPhysY = 0;
      let dragMoved = false;
      let dragEndTime = 0;
      let dragRafId = 0;
      let dragIpcInFlight = false;

      let isCtxOpen = false;

      /** 当前窗口应显示的图片物理尺寸（按 winScale 算，含余量）。 */
      function winDispW() { return Math.max(1, Math.round(physW * winScale)); }
      function winDispH() { return Math.max(1, Math.round(physH * winScale)); }

      /** 只更新 img 的 transform（GPU 合成层，丝滑，不动窗口）。
       *  同时反向补偿 box-shadow / border / border-radius：这些在 transform 前渲染，
       *  会被 scale 放大，所以除以 scale 保持视觉大小恒定。
       *  缩小态：虚线边框 + 柔和发光，降低视觉重量。 */
      function applyTransformOnly() {
        img.style.transform = `scale(${scale})`;
        const s = scale;
        if (isMinimized) {
          // 缩小态：虚线边框 + 圆角，无发光（降低视觉重量）
          const bw = 2 / s;     // 虚线边框宽 2px 视觉
          const br = 6 / s;     // 圆角 6px 视觉
          img.style.border = `${bw}px dashed rgba(74, 158, 255, 0.6)`;
          img.style.borderRadius = `${br}px`;
          img.style.boxShadow = 'none';
        } else {
          img.style.border = '';
          img.style.borderRadius = '';
          img.style.boxShadow =
            `0 0 0 ${1/s}px rgba(74, 158, 255, 0.55), ` +
            `0 0 ${14/s}px ${3/s}px rgba(74, 158, 255, 0.28)`;
        }
        updatePinIndicatorPosition();
      }

      function updatePinIndicatorPosition() {
        const dpr = window.devicePixelRatio || 1;
        const cx = (PAD + physW * scale / 2) / dpr;
        const cy = (PAD + physH * scale / 2) / dpr;
        document.documentElement.style.setProperty('--pin-cx', cx + 'px');
        document.documentElement.style.setProperty('--pin-cy', cy + 'px');
      }

      function showTranslatingIndicator() {
        const el = document.getElementById('pin-translating-indicator');
        if (el) el.classList.remove('hidden');
        updatePinIndicatorPosition();
        const ctxTranslate = document.getElementById('ctx-translate');
        if (ctxTranslate) ctxTranslate.disabled = true;
      }

      function hideTranslatingIndicator() {
        const el = document.getElementById('pin-translating-indicator');
        if (el) el.classList.add('hidden');
        const ctxTranslate = document.getElementById('ctx-translate');
        if (ctxTranslate) ctxTranslate.disabled = false;
      }

      function resizeWindowIfNeeded() {
        const padRemaining = (physW * (winScale - scale) + 2 * PAD) / 2;
        if (padRemaining >= GLOW_RADIUS) {
          if (scale < winScale && winScale - scale > 0.25) {
            doResizeWindow();
          }
          return;
        }
        doResizeWindow();
      }

      /** 实际执行窗口 resize（sync winScale → scale，调 screenshotPinTransform）。 */
      function doResizeWindow() {
        winScale = scale;
        const winX = Math.round(imgScreenX - PAD);
        const winY = Math.round(imgScreenY - PAD);
        const winW = winDispW() + 2 * PAD;
        const winH = winDispH() + 2 * PAD;
        screenshotPinTransform(myLabel, winX, winY, winW, winH).catch((e) => {
          console.error('screenshotPinTransform 失败', e);
        });
      }

      function scheduleDragMove() {
        if (dragRafId !== 0) return;
        dragRafId = requestAnimationFrame(() => {
          dragRafId = 0;
          if (dragIpcInFlight) return;
          const winX = Math.round(imgScreenX - PAD);
          const winY = Math.round(imgScreenY - PAD);
          dragIpcInFlight = true;
          screenshotPinMove(myLabel, winX, winY)
            .catch(() => {})
            .finally(() => {
              dragIpcInFlight = false;
              if (isDragging) scheduleDragMove();
            });
        });
      }

      function showZoomLabel() {
        zoomLabel.textContent = Math.round(scale * 100) + '%';
        updateZoomLabelPosition();
        zoomLabel.style.opacity = '1';
        clearTimeout(zoomLabel._hideTimer);
        zoomLabel._hideTimer = setTimeout(() => {
          zoomLabel.style.opacity = '0';
        }, 1200);
      }

      function updateZoomLabelPosition() {
        zoomLabel.style.left = '8px';
        zoomLabel.style.top = '8px';
        zoomLabel.style.right = 'auto';
        zoomLabel.style.bottom = 'auto';
      }

      // ── 缩小/还原模式（双击切换）──────────────────────────────
      function computeMiniScale() {
        const dpr = window.devicePixelRatio || 1;
        const longestCss = Math.max(physW, physH) / dpr;
        if (longestCss <= 0) return 1;
        return Math.min(1, MINI_MAX_SIDE / longestCss);
      }

      function enterMiniMode() {
        if (isMinimized) return;
        savedScale = scale;
        isMinimized = true;
        document.body.classList.add('mini-mode');
        scale = computeMiniScale();
        applyTransformOnly();
        doResizeWindow();
        zoomLabel.style.opacity = '0';
      }

      function exitMiniMode() {
        if (!isMinimized) return;
        isMinimized = false;
        document.body.classList.remove('mini-mode');
        scale = savedScale;
        applyTransformOnly();
        doResizeWindow();
        showZoomLabel();
      }

      // ── 后端 eval 入口 ──────────────────────────────────────

      // 后端复用窗口时通过 eval 调用此函数重置状态
      window.__blinkResetPin = function(dataUrl, pngW, pngH, screenX, screenY, showTranslating) {
        physW = pngW;
        physH = pngH;
        scale = 1;
        winScale = 1;
        isMinimized = false;
        savedScale = 1;
        document.body.classList.remove('mini-mode');
        imgScreenX = screenX || 0;
        imgScreenY = screenY || 0;
        zoomLabel.textContent = '100%';
        zoomLabel.style.opacity = '0';
        updateZoomLabelPosition();
        const dpr = window.devicePixelRatio || 1;
        img.style.width = (pngW / dpr) + 'px';
        img.style.height = (pngH / dpr) + 'px';
        img.style.left = (PAD / dpr) + 'px';
        img.style.top = (PAD / dpr) + 'px';
        img.style.transformOrigin = '0 0';
        img.style.transform = 'scale(1)';
        img.style.boxShadow = '';
        img.style.border = '';
        img.style.borderRadius = '';
        img.src = dataUrl;
        const winX = Math.round(imgScreenX - PAD);
        const winY = Math.round(imgScreenY - PAD);
        screenshotPinTransform(myLabel, winX, winY, pngW + 2 * PAD, pngH + 2 * PAD).catch(() => {});
        if (showTranslating) {
          showTranslatingIndicator();
        } else {
          hideTranslatingIndicator();
        }
        updatePinIndicatorPosition();
      };

      // 原地刷新 pin 图片（不重定位、不重置缩放）
      window.__blinkRefreshPinImage = function(dataUrl, w, h, showTranslating) {
        if (w === physW && h === physH) {
          img.src = dataUrl;
        } else {
          console.warn('[pin] 译文 PNG 尺寸与原图不一致，重置缩放', { old: { w: physW, h: physH }, new: { w, h } });
          physW = w;
          physH = h;
          const dpr = window.devicePixelRatio || 1;
          img.style.width = (w / dpr) + 'px';
          img.style.height = (h / dpr) + 'px';
          img.src = dataUrl;
          updatePinIndicatorPosition();
        }
        if (!showTranslating) {
          hideTranslatingIndicator();
        } else {
          showTranslatingIndicator();
        }
      };

      // N+1 回收时后端 eval 调用，清空图片和状态
      window.__blinkClearPin = function() {
        img.src = '';
        physW = 0;
        physH = 0;
        scale = 1;
        winScale = 1;
        isMinimized = false;
        savedScale = 1;
        document.body.classList.remove('mini-mode');
        img.style.transform = 'scale(1)';
        img.style.boxShadow = '';
        img.style.border = '';
        img.style.borderRadius = '';
        zoomLabel.style.opacity = '0';
        hideTranslatingIndicator();
        // 通知后端：回收完成，可被借用
        pinSpareReady().catch((e) => console.error('pin_spare_ready (recycle) 调用失败:', e));
      };

      img.addEventListener('load', () => {
        if (physW === 0 || physH === 0) {
          physW = img.naturalWidth;
          physH = img.naturalHeight;
          const dpr = window.devicePixelRatio || 1;
          img.style.width = (physW / dpr) + 'px';
          img.style.height = (physH / dpr) + 'px';
        }
        showZoomLabel();
      });

      // ── 拖动 ──────────────────────────────────────────────────
      document.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('#ctx-menu')) return;
        if (e.target.closest('#pin-ocr-panel')) return;
        const dpr = window.devicePixelRatio || 1;
        const imgLeft = PAD / dpr;
        const imgTop = PAD / dpr;
        const imgVisW = (physW * scale) / dpr;
        const imgVisH = (physH * scale) / dpr;
        if (e.clientX < imgLeft || e.clientX > imgLeft + imgVisW ||
            e.clientY < imgTop  || e.clientY > imgTop + imgVisH) {
          return;
        }
        isDragging = true;
        dragMoved = false;
        dragLastPhysX = e.screenX;
        dragLastPhysY = e.screenY;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const curX = e.screenX;
        const curY = e.screenY;
        const dx = curX - dragLastPhysX;
        const dy = curY - dragLastPhysY;
        dragLastPhysX = curX;
        dragLastPhysY = curY;
        if (!dragMoved) {
          if (Math.abs(dx) + Math.abs(dy) > 2) {
            dragMoved = true;
          } else {
            return;
          }
        }
        imgScreenX += dx;
        imgScreenY += dy;
        scheduleDragMove();
      });

      document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        if (dragMoved) {
          dragEndTime = Date.now();
        }
        if (dragRafId !== 0) {
          cancelAnimationFrame(dragRafId);
          dragRafId = 0;
        }
        if (dragMoved) {
          const winX = Math.round(imgScreenX - PAD);
          const winY = Math.round(imgScreenY - PAD);
          screenshotPinMove(myLabel, winX, winY).catch(() => {});
        }
      });

      // ── 滚轮缩放 ──────────────────────────────────────────────
      document.addEventListener('wheel', (e) => {
        e.preventDefault();
        // 缩小态下滚轮：先恢复正常态，本次不叠加缩放
        if (isMinimized) {
          exitMiniMode();
          return;
        }
        const step = e.ctrlKey ? 0.25 : 0.1;
        const delta = e.deltaY > 0 ? -step : step;
        const newScale = Math.max(0.1, Math.min(8, scale + delta));
        if (newScale === scale) return;
        scale = newScale;
        applyTransformOnly();
        resizeWindowIfNeeded();
        showZoomLabel();
      }, { passive: false });

      // 双击：切换缩小/还原模式
      document.addEventListener('dblclick', (e) => {
        if (e.target.closest('#ctx-menu')) return;
        if (e.target.closest('#pin-ocr-panel')) return;
        // 翻译中不打断
        const indicator = document.getElementById('pin-translating-indicator');
        if (indicator && !indicator.classList.contains('hidden')) return;

        if (isMinimized) {
          exitMiniMode();
        } else {
          enterMiniMode();
        }
      });

      // ── 右键菜单 ──────────────────────────────────────────────
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (Date.now() - dragEndTime < 200) return;
        if (e.target.closest('#ctx-menu')) return;
        if (e.target.closest('#pin-ocr-panel')) return;
        showCtxMenu(e.clientX, e.clientY);
      });

      document.addEventListener('click', (e) => {
        if (isCtxOpen && !e.target.closest('#ctx-menu')) {
          hideCtxMenu();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (isCtxOpen) {
            hideCtxMenu();
          } else if (isMinimized) {
            exitMiniMode();
          } else {
            closePin();
          }
        }
      });

      /** 右键菜单显示——钳制在窗口可视区域内，防止越界被裁。 */
      function showCtxMenu(x, y) {
        // mini 模式只保留重置缩放 + 关闭
        ctxMenu.classList.toggle('ctx-menu-mini', isMinimized);
        ctxMenu.classList.remove('hidden');
        // 先显示才能测量尺寸
        const rect = ctxMenu.getBoundingClientRect();
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        let mx = x;
        let my = y;
        // 右越界 → 左移
        if (mx + rect.width > winW) {
          mx = Math.max(0, winW - rect.width - 4);
        }
        // 下越界 → 上移
        if (my + rect.height > winH) {
          my = Math.max(0, winH - rect.height - 4);
        }
        ctxMenu.style.left = mx + 'px';
        ctxMenu.style.top = my + 'px';
        isCtxOpen = true;
      }

      function hideCtxMenu() {
        ctxMenu.classList.add('hidden');
        isCtxOpen = false;
      }

      document.getElementById('ctx-close').addEventListener('click', () => {
        hideCtxMenu();
        closePin();
      });

      document.getElementById('ctx-reset-zoom').addEventListener('click', () => {
        hideCtxMenu();
        if (isMinimized) {
          exitMiniMode();
          savedScale = 1;
        } else {
          scale = 1;
          applyTransformOnly();
          resizeWindowIfNeeded();
          showZoomLabel();
        }
      });

      document.getElementById('ctx-copy').addEventListener('click', async () => {
        hideCtxMenu();
        try {
          const png = await pinImageToPng();
          await pinSaveClipboard(png);
        } catch (e) {
          console.error('保存到剪贴板失败', e);
        }
      });

      document.getElementById('ctx-save-as').addEventListener('click', async () => {
        hideCtxMenu();
        try {
          const png = await pinImageToPng();
          await pinSaveAs(png);
        } catch (e) {
          const err = normalizeError(e);
          if (!err.message.includes('用户取消了保存')) {
            console.error('另存为失败', e);
          }
        }
      });

      // ── pin 窗口内 OCR / 翻译 ──────────────────────────────────

      const pinOcrPanel = document.getElementById('pin-ocr-panel');
      const pinOcrSource = document.getElementById('pin-ocr-source');
      const pinOcrTranslated = document.getElementById('pin-ocr-translated');
      const pinOcrTabs = pinOcrPanel.querySelectorAll('.pin-ocr-tab');
      const pinOcrTranslateBtn = document.getElementById('pin-ocr-translate');
      const pinOcrCopyBtn = document.getElementById('pin-ocr-copy');
      const pinOcrTabTranslated = pinOcrPanel.querySelector('.pin-ocr-tab[data-tab="translated"]');

      let ocrBusy = false;

      /** 把 pin 窗口图片编码为 PNG bytes(通过 canvas)。
       *  用 img 的物理尺寸,不带 zoom scale——OCR 需要原图。 */
      function pinImageToPng() {
        return new Promise((resolve, reject) => {
          if (!physW || !physH || !img.src) {
            reject(new Error('图片未加载'));
            return;
          }
          const c = document.createElement('canvas');
          c.width = physW;
          c.height = physH;
          const cc = c.getContext('2d');
          try {
            cc.drawImage(img, 0, 0, physW, physH);
            c.toBlob((blob) => {
              if (!blob) { reject(new Error('toBlob 失败')); return; }
              blob.arrayBuffer().then((buf) => resolve(new Uint8Array(buf))).catch(reject);
            }, 'image/png');
          } catch (e) {
            reject(e);
          }
        });
      }

      function showPinOcrPanel(text) {
        pinOcrSource.value = text || '（未识别到文字）';
        pinOcrTranslated.value = '';
        pinOcrTabTranslated.removeAttribute('data-stale');
        pinOcrTranslated.removeAttribute('data-stale');
        showPinOcrTab('source');
        pinOcrPanel.classList.remove('hidden');
      }

      function showPinOcrTab(name) {
        const isSource = name === 'source';
        pinOcrTabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
        pinOcrSource.hidden = !isSource;
        pinOcrTranslated.hidden = isSource;
      }

      pinOcrTabs.forEach((t) => {
        t.addEventListener('click', () => showPinOcrTab(t.dataset.tab));
      });

      pinOcrSource.addEventListener('input', () => {
        if (pinOcrTranslated.value) {
          pinOcrTabTranslated.setAttribute('data-stale', 'true');
          pinOcrTranslated.setAttribute('data-stale', 'true');
        }
      });

      document.getElementById('pin-ocr-close').addEventListener('click', () => {
        pinOcrPanel.classList.add('hidden');
      });

      async function doPinTranslate() {
        const src = pinOcrSource.value.trim();
        if (!src || src === '（未识别到文字）') return;
        pinOcrTranslateBtn.disabled = true;
        pinOcrTranslateBtn.textContent = '翻译中…';
        pinOcrTranslated.value = '翻译中,请稍候…';
        showPinOcrTab('translated');
        try {
          const dst = await translateText(src);
          pinOcrTranslated.value = dst;
          pinOcrTabTranslated.removeAttribute('data-stale');
          pinOcrTranslated.removeAttribute('data-stale');
        } catch (e) {
          const err = normalizeError(e);
          pinOcrTranslated.value = `翻译失败：${err.message}`;
        } finally {
          pinOcrTranslateBtn.disabled = false;
          pinOcrTranslateBtn.textContent = '翻译';
        }
      }

      pinOcrTranslateBtn.addEventListener('click', doPinTranslate);

      pinOcrCopyBtn.addEventListener('click', () => {
        const currentTa = pinOcrSource.hidden ? pinOcrTranslated : pinOcrSource;
        const value = currentTa.value;
        if (value) {
          navigator.clipboard.writeText(value).catch((e) => console.error('复制失败', e));
        }
        pinOcrPanel.classList.add('hidden');
      });

      async function runPinOcr(autoTranslate) {
        if (ocrBusy) return;
        ocrBusy = true;
        try {
          const png = await pinImageToPng();
          const result = await ocrImage(png);
          showPinOcrPanel((result && result.text) || '');
          if (autoTranslate) {
            setTimeout(doPinTranslate, 0);
          }
        } catch (e) {
          const err = normalizeError(e);
          console.error(`[pin OCR] [${err.code}] ${err.message}`);
          showPinOcrPanel(`识别失败：${err.message}`);
        } finally {
          ocrBusy = false;
        }
      }

      document.getElementById('ctx-ocr').addEventListener('click', () => {
        hideCtxMenu();
        runPinOcr(false);
      });

      document.getElementById('ctx-translate').addEventListener('click', () => {
        hideCtxMenu();
        runPinOcr(true);
      });

      // 防止面板内交互被外层 mousedown/click 打断
      pinOcrPanel.addEventListener('mousedown', (e) => e.stopPropagation());
      pinOcrPanel.addEventListener('click', (e) => e.stopPropagation());
      pinOcrPanel.addEventListener('contextmenu', (e) => e.stopPropagation());
      pinOcrPanel.addEventListener('dblclick', (e) => e.stopPropagation());
      pinOcrPanel.addEventListener('wheel', (e) => e.stopPropagation());

      function closePin() {
        invoke('screenshot_pin_hide', { label: myLabel }).catch((e) => {
          console.error('screenshot_pin_hide 失败', e);
        });
      }
    </script>
  </body>
</html>
