<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Blink Pin</title>
    <link rel="stylesheet" href="css/entries/pin.css" />
  </head>
  <body>
    <!--
      丝滑缩放架构（transform scale + 左上角固定 + 离散窗口 resize）：
      - 图片固定为原始物理尺寸（width/height 不变），用 transform: scale() 缩放。
        transform 是 GPU 合成层属性，零 reflow，60fps 丝滑无跳变。
      - 左上角固定缩放：窗口位置（imgScreenX/Y）缩放时不动，只改尺寸。
        transformOrigin 固定 0,0，scale 时图片左上不动、右下角伸缩，视觉完全连续。
        （不做鼠标中心缩放——那会同时改位置+尺寸+origin，三者叠加导致跳变。
         用户想看不同部分用拖动，这是 Snipaste 等工具的标准做法。）
      - 窗口尺寸跟随 scale，但只在 scale 跨越 ±5% 阈值时 resize 一次（离散），
        避免每次 wheel 都 resize 窗口（Win32 resize 同步重绘，会跳）。
      - 拖动：只改窗口位置（screenshotPinTransform），不改尺寸。
    -->
    <div id="container">
      <img id="pin-img" src="" alt="钉图" draggable="false" />
      <div id="zoom-level">100%</div>
    </div>

    <!-- 右键菜单（0.11.9-f：加 OCR / 翻译 项） -->
    <div id="ctx-menu" class="hidden">
      <button id="ctx-ocr">识别文字</button>
      <button id="ctx-translate">翻译文字</button>
      <div class="ctx-sep"></div>
      <button id="ctx-close">关闭</button>
    </div>

    <!-- OCR 结果浮层（0.11.9-f：pin 窗口内 OCR 后展示） -->
    <div id="pin-ocr-panel" class="hidden">
      <div class="pin-ocr-header">
        <div class="pin-ocr-tabs">
          <button class="pin-ocr-tab active" data-tab="source">原文</button>
          <button class="pin-ocr-tab" data-tab="translated">译文 <span class="stale-dot" aria-hidden="true"></span></button>
        </div>
        <button id="pin-ocr-close">✕</button>
      </div>
      <textarea id="pin-ocr-source" spellcheck="false"></textarea>
      <textarea id="pin-ocr-translated" spellcheck="false" hidden placeholder="点击"翻译"按钮生成译文"></textarea>
      <div class="pin-ocr-footer">
        <button id="pin-ocr-translate">翻译</button>
        <button id="pin-ocr-copy" class="primary">复制</button>
      </div>
    </div>

    <script type="module">
      import { invoke, screenshotPinTransform, ocrImage, translateText } from "./js/shared/api.js";
import { normalizeError } from "./js/shared/tauri.js";
      import { applyThemeFromConfig } from "./js/shared/theme.js";

      // 应用主题（右键菜单 / OCR 面板的 token 引用随用户主题切换）
      applyThemeFromConfig();

      const PAD = 20;       // 与后端 PIN_PAD 一致（物理像素，给发光留空间）
      const GLOW_RADIUS = 18; // 发光视觉半径（1px spread + 14px blur ≈ 18px）

      const img = document.getElementById('pin-img');
      const zoomLabel = document.getElementById('zoom-level');
      const ctxMenu = document.getElementById('ctx-menu');

      // ── 核心状态 ──
      let physW = 0, physH = 0;             // 图片原始物理尺寸
      let scale = 1;                         // 当前总缩放比例
      let imgScreenX = 0, imgScreenY = 0;   // 图片左上角屏幕物理坐标（按 scale 算）
      // 窗口当前对应的 scale（实际 resize 到的尺寸对应的 scale）
      // 当 |scale - winScale| > RESIZE_THRESHOLD 时才触发新一次 resize
      let winScale = 1;

      // 拖动状态
      let isDragging = false;
      let dragLastPhysX = 0, dragLastPhysY = 0;
      let dragMoved = false;
      let dragEndTime = 0;
      let dragRafId = 0;

      let isCtxOpen = false;

      /** 当前窗口应显示的图片物理尺寸（按 winScale 算，含余量）。 */
      function winDispW() { return Math.max(1, Math.round(physW * winScale)); }
      function winDispH() { return Math.max(1, Math.round(physH * winScale)); }

      /** 只更新 img 的 transform（GPU 合成层，丝滑，不动窗口）。
       *  同时反向补偿 box-shadow：box-shadow 在 transform 前渲染，
       *  会被 scale 放大，所以除以 scale 保持发光大小恒定。 */
      function applyTransformOnly() {
        img.style.transform = `scale(${scale})`;
        const s = scale;
        img.style.boxShadow =
          `0 0 0 ${1/s}px rgba(74, 158, 255, 0.55), ` +
          `0 0 ${14/s}px ${3/s}px rgba(74, 158, 255, 0.28)`;
      }

      /** resize 窗口到当前 scale 对应尺寸（离散调用，不在每次 wheel 触发）。
       *  精确检测：当图片边缘距窗口边缘的剩余 padding < GLOW_RADIUS 时
       *  触发 resize，确保发光不被裁切。 */
      function resizeWindowIfNeeded() {
        // 当前窗口内，图片两侧的剩余 padding（物理像素）
        // 窗口宽 = physW * winScale + 2*PAD，图片视觉宽 = physW * scale
        const padRemaining = (physW * (winScale - scale) + 2 * PAD) / 2;
        if (padRemaining >= GLOW_RADIUS) return;
        winScale = scale;
        const winX = Math.round(imgScreenX - PAD);
        const winY = Math.round(imgScreenY - PAD);
        const winW = winDispW() + 2 * PAD;
        const winH = winDispH() + 2 * PAD;
        screenshotPinTransform(winX, winY, winW, winH).catch((e) => {
          console.error('screenshotPinTransform 失败', e);
        });
      }

      /** 拖动时只改窗口位置（尺寸不变）。 */
      function scheduleDragMove() {
        if (dragRafId !== 0) return;
        dragRafId = requestAnimationFrame(() => {
          dragRafId = 0;
          const winX = Math.round(imgScreenX - PAD);
          const winY = Math.round(imgScreenY - PAD);
          const winW = winDispW() + 2 * PAD;
          const winH = winDispH() + 2 * PAD;
          screenshotPinTransform(winX, winY, winW, winH).catch(() => {});
        });
      }

      function showZoomLabel() {
        zoomLabel.textContent = Math.round(scale * 100) + '%';
        // 0.15.5：贴图视觉右下角定位（不贴窗口右下角）
        updateZoomLabelPosition();
        zoomLabel.style.opacity = '1';
        clearTimeout(zoomLabel._hideTimer);
        zoomLabel._hideTimer = setTimeout(() => {
          zoomLabel.style.opacity = '0';
        }, 1200);
      }

  /** 0.15.13：zoom label 固定左上角——不随窗口缩放变动，丝滑 */
  function updateZoomLabelPosition() {
    zoomLabel.style.left = '8px';
    zoomLabel.style.top = '8px';
    zoomLabel.style.right = 'auto';
    zoomLabel.style.bottom = 'auto';
  }

      // 后端复用窗口时通过 eval 调用此函数重置状态
      window.__blinkResetPin = function(dataUrl, pngW, pngH, screenX, screenY) {
        physW = pngW;
        physH = pngH;
        scale = 1;
        winScale = 1;
        imgScreenX = screenX || 0;
        imgScreenY = screenY || 0;
        zoomLabel.textContent = '100%';
        zoomLabel.style.opacity = '0';
        updateZoomLabelPosition(); // 0.15.5：初始化 label 位置，防止 hover 闪位
        // img 固定为原始物理尺寸对应的 CSS 尺寸（physW/dpr），保证 1:1 像素清晰。
        // transform: scale 承载所有缩放（GPU 合成层，丝滑）。
        const dpr = window.devicePixelRatio || 1;
        img.style.width = (pngW / dpr) + 'px';
        img.style.height = (pngH / dpr) + 'px';
        img.style.left = (PAD / dpr) + 'px';
        img.style.top = (PAD / dpr) + 'px';
        img.style.transformOrigin = '0 0';
        img.style.transform = 'scale(1)';
        // 清除内联 box-shadow，让 CSS 默认值生效（scale=1 时无需补偿）
        img.style.boxShadow = '';
        img.src = dataUrl;
        // 立即 resize 窗口到原始尺寸
        const winX = Math.round(imgScreenX - PAD);
        const winY = Math.round(imgScreenY - PAD);
        screenshotPinTransform(winX, winY, pngW + 2 * PAD, pngH + 2 * PAD).catch(() => {});
      };

      img.addEventListener('load', () => {
        if (physW === 0 || physH === 0) {
          physW = img.naturalWidth;
          physH = img.naturalHeight;
          const dpr = window.devicePixelRatio || 1;
          img.style.width = (physW / dpr) + 'px';
          img.style.height = (physH / dpr) + 'px';
        }
        showZoomLabel();
      });

      // ── 拖动（document 级，mousedown/move/up）─────────────────────────
      document.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('#ctx-menu')) return;
        isDragging = true;
        dragMoved = false;
        const dpr = window.devicePixelRatio || 1;
        dragLastPhysX = e.screenX * dpr;
        dragLastPhysY = e.screenY * dpr;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dpr = window.devicePixelRatio || 1;
        const curX = e.screenX * dpr;
        const curY = e.screenY * dpr;
        const dx = curX - dragLastPhysX;
        const dy = curY - dragLastPhysY;
        dragLastPhysX = curX;
        dragLastPhysY = curY;
        if (!dragMoved) {
          if (Math.abs(dx) + Math.abs(dy) > 2) {
            dragMoved = true;
          } else {
            return;
          }
        }
        imgScreenX += dx;
        imgScreenY += dy;
        scheduleDragMove();
      });

      document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        if (dragMoved) {
          dragEndTime = Date.now();
        }
        if (dragRafId !== 0) {
          cancelAnimationFrame(dragRafId);
          dragRafId = 0;
          const winX = Math.round(imgScreenX - PAD);
          const winY = Math.round(imgScreenY - PAD);
          screenshotPinTransform(winX, winY, winDispW() + 2 * PAD, winDispH() + 2 * PAD).catch(() => {});
        }
      });

      // ── 滚轮缩放（左上角固定，只动 transform，离散 resize 尺寸）─────────
      // 不做鼠标中心缩放——那会同时改窗口位置 + 尺寸 + transform origin，
      // 三者叠加导致跳变。改为左上角固定：窗口位置不变，只往右下扩展/收缩，
      // 视觉完全连续。用户想看不同部分用拖动。
      document.addEventListener('wheel', (e) => {
        e.preventDefault();
        const step = e.ctrlKey ? 0.25 : 0.1;
        const delta = e.deltaY > 0 ? -step : step;
        const newScale = Math.max(0.1, Math.min(8, scale + delta));
        if (newScale === scale) return;

        // 只改 scale，imgScreenX/Y 不动（窗口左上角固定）
        scale = newScale;
        applyTransformOnly();
        resizeWindowIfNeeded();
        showZoomLabel();
      }, { passive: false });

      // 双击重置缩放到 100%（位置不变）
      document.addEventListener('dblclick', (e) => {
        if (e.target.closest('#ctx-menu')) return;
        if (scale === 1) return;
        scale = 1;
        applyTransformOnly();
        resizeWindowIfNeeded();
        showZoomLabel();
      });

      // ── 右键菜单 ──────────────────────────────────────────────────────
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (Date.now() - dragEndTime < 200) return;
        if (e.target.closest('#ctx-menu')) return;
        showCtxMenu(e.clientX, e.clientY);
      });

      document.addEventListener('click', (e) => {
        if (isCtxOpen && !e.target.closest('#ctx-menu')) {
          hideCtxMenu();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (isCtxOpen) {
            hideCtxMenu();
          } else {
            closePin();
          }
        }
      });

      function showCtxMenu(x, y) {
        ctxMenu.classList.remove('hidden');
        ctxMenu.style.left = x + 'px';
        ctxMenu.style.top = y + 'px';
        isCtxOpen = true;
      }

      function hideCtxMenu() {
        ctxMenu.classList.add('hidden');
        isCtxOpen = false;
      }

      document.getElementById('ctx-close').addEventListener('click', () => {
        hideCtxMenu();
        closePin();
      });

      // ── 0.11.9-f：pin 窗口内 OCR / 翻译 ──────────────────────────
      //
      // pin 窗口不做完整"阅读模式 word 拖选",只提供"识别文字"和"翻译"两个
      // 二等入口——用户 workflow 是"钉图→比对→需要文字时点右键"。要完整
      // word 交互请 Alt+A 重新截图。

      const pinOcrPanel = document.getElementById('pin-ocr-panel');
      const pinOcrSource = document.getElementById('pin-ocr-source');
      const pinOcrTranslated = document.getElementById('pin-ocr-translated');
      const pinOcrTabs = pinOcrPanel.querySelectorAll('.pin-ocr-tab');
      const pinOcrTranslateBtn = document.getElementById('pin-ocr-translate');
      const pinOcrCopyBtn = document.getElementById('pin-ocr-copy');
      const pinOcrTabTranslated = pinOcrPanel.querySelector('.pin-ocr-tab[data-tab="translated"]');

      let ocrBusy = false;

      /** 把 pin 窗口图片的 CSS 元素编码为 PNG bytes(通过 canvas)。
       *  用 img 的物理尺寸,不带 zoom scale——OCR 需要原图。 */
      function pinImageToPng() {
        return new Promise((resolve, reject) => {
          if (!physW || !physH || !img.src) {
            reject(new Error('图片未加载'));
            return;
          }
          const c = document.createElement('canvas');
          c.width = physW;
          c.height = physH;
          const cc = c.getContext('2d');
          try {
            cc.drawImage(img, 0, 0, physW, physH);
            c.toBlob((blob) => {
              if (!blob) { reject(new Error('toBlob 失败')); return; }
              blob.arrayBuffer().then((buf) => resolve(new Uint8Array(buf))).catch(reject);
            }, 'image/png');
          } catch (e) {
            reject(e);
          }
        });
      }

      function showPinOcrPanel(text) {
        pinOcrSource.value = text || '（未识别到文字）';
        pinOcrTranslated.value = '';
        pinOcrTabTranslated.removeAttribute('data-stale');
        pinOcrTranslated.removeAttribute('data-stale');
        showPinOcrTab('source');
        pinOcrPanel.classList.remove('hidden');
      }

      function showPinOcrTab(name) {
        const isSource = name === 'source';
        pinOcrTabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
        pinOcrSource.hidden = !isSource;
        pinOcrTranslated.hidden = isSource;
      }

      pinOcrTabs.forEach((t) => {
        t.addEventListener('click', () => showPinOcrTab(t.dataset.tab));
      });

      pinOcrSource.addEventListener('input', () => {
        if (pinOcrTranslated.value) {
          pinOcrTabTranslated.setAttribute('data-stale', 'true');
          pinOcrTranslated.setAttribute('data-stale', 'true');
        }
      });

      document.getElementById('pin-ocr-close').addEventListener('click', () => {
        pinOcrPanel.classList.add('hidden');
      });

      async function doPinTranslate() {
        const src = pinOcrSource.value.trim();
        if (!src || src === '（未识别到文字）') return;
        pinOcrTranslateBtn.disabled = true;
        pinOcrTranslateBtn.textContent = '翻译中…';
        pinOcrTranslated.value = '翻译中,请稍候…';
        showPinOcrTab('translated');
        try {
          const dst = await translateText(src);
          pinOcrTranslated.value = dst;
          pinOcrTabTranslated.removeAttribute('data-stale');
          pinOcrTranslated.removeAttribute('data-stale');
        } catch (e) {
          const err = normalizeError(e);
          pinOcrTranslated.value = `翻译失败：${err.message}`;
        } finally {
          pinOcrTranslateBtn.disabled = false;
          pinOcrTranslateBtn.textContent = '翻译';
        }
      }

      pinOcrTranslateBtn.addEventListener('click', doPinTranslate);

      pinOcrCopyBtn.addEventListener('click', () => {
        const currentTa = pinOcrSource.hidden ? pinOcrTranslated : pinOcrSource;
        const value = currentTa.value;
        if (value) {
          navigator.clipboard.writeText(value).catch((e) => console.error('复制失败', e));
        }
        pinOcrPanel.classList.add('hidden');
      });

      async function runPinOcr(autoTranslate) {
        if (ocrBusy) return;
        ocrBusy = true;
        try {
          const png = await pinImageToPng();
          const result = await ocrImage(png);
          showPinOcrPanel((result && result.text) || '');
          if (autoTranslate) {
            setTimeout(doPinTranslate, 0);
          }
        } catch (e) {
          const err = normalizeError(e);
          console.error(`[pin OCR] [${err.code}] ${err.message}`);
          showPinOcrPanel(`识别失败：${err.message}`);
        } finally {
          ocrBusy = false;
        }
      }

      document.getElementById('ctx-ocr').addEventListener('click', () => {
        hideCtxMenu();
        runPinOcr(false);
      });

      document.getElementById('ctx-translate').addEventListener('click', () => {
        hideCtxMenu();
        runPinOcr(true);
      });

      // 防止面板内交互被外层 mousedown/click 打断
      pinOcrPanel.addEventListener('mousedown', (e) => e.stopPropagation());
      pinOcrPanel.addEventListener('click', (e) => e.stopPropagation());
      pinOcrPanel.addEventListener('contextmenu', (e) => e.stopPropagation());
      pinOcrPanel.addEventListener('dblclick', (e) => e.stopPropagation());
      pinOcrPanel.addEventListener('wheel', (e) => e.stopPropagation());

      function closePin() {
        invoke('screenshot_pin_hide').catch((e) => {
          console.error('screenshot_pin_hide 失败', e);
        });
      }
    </script>
  </body>
</html>
