<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>Blink Pin</title>
    <link href="css/entries/pin.css" rel="stylesheet"/>
</head>
<body>
<!--
  统一几何模型（多屏混合 DPI 安全）：
  - 图片 CSS 尺寸 = baseCss × zoom，跨屏保持视觉大小不变。
  - 窗口物理矩形由 pin-geometry.js::computeWindowRect 算出，随目标屏 DPR 变化。
  - 拖动用 Tauri 原生 startDragging()，系统处理鼠标捕获和跨屏移动。
  - DPI 变化通过 onScaleChanged 监听，reconcile 回读窗口实际物理矩形。
  - 滚轮缩放围绕鼠标锚点，鼠标下内容保持稳定。
  - 窗口尺寸和位置在同一 rAF 内合并提交，无透明空壳。
-->
<div id="container">
    <img alt="钉图" draggable="false" id="pin-img" src=""/>
    <div id="zoom-level">100%</div>
    <!-- 0.18.3：翻译中指示器（不随 img transform: scale 缩放，独立固定视觉大小） -->
    <div class="hidden" id="pin-translating-indicator">
        <div class="pin-spinner"></div>
        <span class="pin-translating-text">翻译中</span>
    </div>
</div>

<!-- 右键菜单 -->
<div class="hidden" id="ctx-menu">
    <button id="ctx-edit-image">编辑图片</button>
    <div class="ctx-sep"></div>
    <button id="ctx-ocr">识别文字</button>
    <button id="ctx-translate">翻译文字</button>
    <div class="ctx-sep"></div>
    <button id="ctx-copy">保存到剪贴板</button>
    <button id="ctx-save-as">另存为</button>
    <div class="ctx-sep"></div>
    <button id="ctx-reset-zoom">重置缩放</button>
    <button id="ctx-close">关闭</button>
</div>

<!-- OCR 结果浮层（0.11.9-f：pin 窗口内 OCR 后展示） -->
<div class="hidden" id="pin-ocr-panel">
    <div class="pin-ocr-header">
        <div class="pin-ocr-tabs">
            <button class="pin-ocr-tab active" data-tab="source">原文</button>
            <button class="pin-ocr-tab" data-tab="translated">译文 <span aria-hidden="true" class="stale-dot"></span>
            </button>
        </div>
        <button id="pin-ocr-close">✕</button>
    </div>
    <textarea id="pin-ocr-source" spellcheck="false"></textarea>
    <textarea hidden id="pin-ocr-translated" placeholder="点击" spellcheck="false" 翻译"按钮生成译文"></textarea>
    <div class="pin-ocr-footer">
        <button id="pin-ocr-translate">翻译</button>
        <button class="primary" id="pin-ocr-copy">复制</button>
    </div>
</div>

<script type="module">
    import {
        invoke,
        screenshotPinTransform,
        screenshotPinGetRect,
        ocrImage,
        translateText,
        pinSpareReady,
        pinSaveClipboard,
        pinSaveAs,
        openImageEditorFromPin
    } from "./js/shared/api.js";
    import {normalizeError, getCurrentWindow} from "./js/shared/tauri.js";
    import {applyThemeFromConfig} from "./js/shared/theme.js";
    import {
        PIN_PAD_CSS,
        baseCssSize,
        computeWindowRect,
        reconcileDpi,
        clampZoom,
    } from "./js/pin/pin-geometry.js";

    // 应用主题（右键菜单 / OCR 面板的 token 引用随用户主题切换）
    applyThemeFromConfig();

    const MINI_MAX_SIDE = 160; // 缩小态最长边（CSS 像素）
    const MINI_ENTER_MS = 140;  // 进入 mini 动画时长
    const MINI_EXIT_MS = 170;   // 退出 mini 动画时长
    const MINI_EASING = 'cubic-bezier(.2, .8, .2, 1)';

    const img = document.getElementById('pin-img');
    const zoomLabel = document.getElementById('zoom-level');
    const ctxMenu = document.getElementById('ctx-menu');

    // ── 多 Pin：当前窗口 label ──
    const myLabel = getCurrentWindow()?.label || 'pin-unknown';
    const tauriWin = getCurrentWindow();

    // ── 预热模式：?preheat=1 时不加载图片，只通知后端就绪 ──
    const params = new URLSearchParams(location.search);
    const isPreheat = params.get('preheat') === '1';
    if (isPreheat) {
        pinSpareReady().catch((e) => {
            const err = normalizeError(e);
            console.error(`pin_spare_ready 失败 [${err.code}] ${err.message}`);
        });
    }

    // ── 统一几何状态 ──
    // 图片资源像素（只读）
    let sourcePixelW = 0, sourcePixelH = 0;
    // 100% zoom 时的视觉 CSS 尺寸（只读，= sourcePixel / sourceDpr）
    let baseCssW = 0, baseCssH = 0;
    // 用户显式缩放 (0.1..8)
    let zoom = 1;
    // 图片左上角屏幕物理坐标
    let imageScreenX = 0, imageScreenY = 0;
    // 当前窗口目标屏 DPR
    let monitorDpr = 1;
    // 缩小态
    let isMinimized = false;
    let savedZoom = 1;
    // reconcile generation（防止旧异步回调覆盖新状态）
    let reconcileGen = 0;
    // 窗口尺寸提交 generation
    let commitGen = 0;

    // mini mode 动画状态机：normal → entering → mini → exiting → normal
    let miniState = 'normal';
    let miniAnimGen = 0;
    let pendingReconcileDpr = null; // 动画期间延后的 reconcile

    let isCtxOpen = false;
    let dragEndTime = 0;

    // ── 几何计算辅助 ──────────────────────────────────────────

    /** 只更新 img 的 transform（GPU 合成层，丝滑，不动窗口）。
     *  同时反向补偿 box-shadow / border / border-radius。 */
    function applyTransformOnly() {
        img.style.transform = `scale(${zoom})`;
        const s = zoom;
        if (isMinimized) {
            const bw = 2 / s;
            const br = 6 / s;
            img.style.border = `${bw}px dashed rgba(74, 158, 255, 0.6)`;
            img.style.borderRadius = `${br}px`;
            img.style.boxShadow = 'none';
        } else {
            img.style.border = '';
            img.style.borderRadius = '';
            img.style.boxShadow =
                `0 0 0 ${1 / s}px rgba(74, 158, 255, 0.55), ` +
                `0 0 ${14 / s}px ${3 / s}px rgba(74, 158, 255, 0.28)`;
        }
        updatePinIndicatorPosition();
    }

    function updatePinIndicatorPosition() {
        const cx = PIN_PAD_CSS + baseCssW * zoom / 2;
        const cy = PIN_PAD_CSS + baseCssH * zoom / 2;
        document.documentElement.style.setProperty('--pin-cx', cx + 'px');
        document.documentElement.style.setProperty('--pin-cy', cy + 'px');
    }

    /** 一步提交窗口位置和尺寸（物理像素，通过 SetWindowPos 原子设置）。
     *  @param {number} [zoomOverride] 显式 zoom（用于 mini 动画期间提交不同 zoom 的窗口尺寸）
     *  @returns {Promise<void>} */
    function commitWindowRect(zoomOverride) {
        const myGen = ++commitGen;
        const z = zoomOverride ?? zoom;
        const rect = computeWindowRect(
            {baseCssW, baseCssH, zoom: z, imageScreenX, imageScreenY},
            monitorDpr,
        );
        return screenshotPinTransform(myLabel, rect.winX, rect.winY, rect.winW, rect.winH).catch((e) => {
            const err = normalizeError(e);
            console.error(`screenshotPinTransform 失败 [${err.code}] ${err.message}`);
            throw e;
        });
    }

    function isMiniAnimating() {
        return miniState === 'entering' || miniState === 'exiting';
    }

    /** 从后端回读窗口实际物理矩形并 reconcile 状态。
     *  用于 DPI 变化、原生拖动结束后、或任何需要与 Win32 真源对齐的场景。
     *  @param {number} [newDprOverride] 如果已知新 DPR（如 onScaleChanged payload），直接传入。 */
    async function reconcileFromBackend(newDprOverride) {
        if (isMiniAnimating()) {
            pendingReconcileDpr = newDprOverride ?? null;
            return;
        }
        const myGen = ++reconcileGen;
        try {
            const rect = await screenshotPinGetRect(myLabel);
            if (!rect || myGen !== reconcileGen) return;

            const newDpr = newDprOverride ?? rect.dpr;
            monitorDpr = newDpr;

            const result = reconcileDpi(
                {baseCssW, baseCssH, zoom},
                newDpr,
                {winX: rect.x, winY: rect.y, winW: rect.w, winH: rect.h},
            );

            imageScreenX = result.imageScreenX;
            imageScreenY = result.imageScreenY;

            // 用新矩形重设窗口（Windows 可能已改了位置但尺寸可能不对）
            screenshotPinTransform(myLabel, result.winX, result.winY, result.winW, result.winH).catch(() => {
            });

            // 刷新 CSS（baseCss 不变，只刷 transform 和 indicator）
            applyTransformOnly();

            if (rect.dpr !== newDpr || newDprOverride) {
                tracing_debug('reconcile', {oldDpr: monitorDpr, newDpr, rect});
            }
        } catch (e) {
            const err = normalizeError(e);
            console.error(`reconcileFromBackend 失败 [${err.code}] ${err.message}`);
        }
    }

    function tracing_debug(label, data) {
        // 开发诊断日志（生产不输出）
        console.debug(`[pin] ${label}`, data);
    }

    function showZoomLabel() {
        zoomLabel.textContent = Math.round(zoom * 100) + '%';
        zoomLabel.style.left = '8px';
        zoomLabel.style.top = '8px';
        zoomLabel.style.right = 'auto';
        zoomLabel.style.bottom = 'auto';
        zoomLabel.style.opacity = '1';
        clearTimeout(zoomLabel._hideTimer);
        zoomLabel._hideTimer = setTimeout(() => {
            zoomLabel.style.opacity = '0';
        }, 1200);
    }

    // ── 缩小/还原模式（双击切换）──────────────────────────────
    function computeMiniZoom() {
        const longestCss = Math.max(baseCssW, baseCssH);
        if (longestCss <= 0) return 1;
        return Math.min(1, MINI_MAX_SIDE / longestCss);
    }

    function enterMiniMode() {
        if (miniState !== 'normal') return;
        const gen = ++miniAnimGen;
        miniState = 'entering';
        savedZoom = zoom;
        const miniZoom = computeMiniZoom();

        // 左上角固定：imageScreenX/Y 不变，只改 zoom 和窗口尺寸

        // reduced-motion：直接到最终状态
        if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) {
            zoom = miniZoom;
            isMinimized = true;
            miniState = 'mini';
            document.body.classList.add('mini-mode');
            applyTransformOnly();
            commitWindowRect();
            zoomLabel.style.opacity = '0';
            return;
        }

        // Phase 1：CSS transform 纯 scale 动画（窗口不动，左上角固定）
        img.style.transition = `transform ${MINI_ENTER_MS}ms ${MINI_EASING}`;
        img.style.transform = `scale(${miniZoom})`;

        // Phase 2：动画结束后收窗口（只裁右侧和下侧透明区域）
        const finishEnter = () => {
            if (gen !== miniAnimGen) return;
            img.removeEventListener('transitionend', onTransEnd);
            clearTimeout(fallback);
            img.style.transition = '';
            zoom = miniZoom;
            isMinimized = true;
            miniState = 'mini';
            document.body.classList.add('mini-mode');
            applyTransformOnly();
            commitWindowRect();
            zoomLabel.style.opacity = '0';
            if (pendingReconcileDpr !== null) {
                const dpr = pendingReconcileDpr;
                pendingReconcileDpr = null;
                reconcileFromBackend(dpr);
            }
        };
        const onTransEnd = (e) => {
            if (e.target !== img || e.propertyName !== 'transform') return;
            finishEnter();
        };
        img.addEventListener('transitionend', onTransEnd);
        const fallback = setTimeout(finishEnter, MINI_ENTER_MS + 250);
    }

    function exitMiniMode() {
        if (miniState !== 'mini') return;
        const gen = ++miniAnimGen;
        miniState = 'exiting';

        const targetZoom = savedZoom;

        // 左上角固定：imageScreenX/Y 不变，只改 zoom 和窗口尺寸

        // reduced-motion：直接到最终状态
        if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) {
            zoom = targetZoom;
            isMinimized = false;
            miniState = 'normal';
            document.body.classList.remove('mini-mode');
            applyTransformOnly();
            commitWindowRect();
            showZoomLabel();
            return;
        }

        // Phase 1：先扩窗口（位置不变，imageScreenX/Y 不变）
        // transform 保持 scale(miniZoom)，用显式 zoom 提交大窗口
        img.style.transition = '';
        // 切换边框为 normal 补偿（基于 targetZoom）
        const s = targetZoom;
        img.style.border = '';
        img.style.borderRadius = '';
        img.style.boxShadow =
            `0 0 0 ${1 / s}px rgba(74, 158, 255, 0.55), ` +
            `0 0 ${14 / s}px ${3 / s}px rgba(74, 158, 255, 0.28)`;
        commitWindowRect(targetZoom);

        // Phase 2：等窗口稳定后 CSS transform 纯 scale 展开
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                if (gen !== miniAnimGen) return;
                zoom = targetZoom;
                img.style.transition = `transform ${MINI_EXIT_MS}ms ${MINI_EASING}`;
                img.style.transform = `scale(${targetZoom})`;
                const finishExit = () => {
                    if (gen !== miniAnimGen) return;
                    img.removeEventListener('transitionend', onTransEnd);
                    clearTimeout(fallback);
                    img.style.transition = '';
                    isMinimized = false;
                    miniState = 'normal';
                    document.body.classList.remove('mini-mode');
                    applyTransformOnly();
                    showZoomLabel();
                    if (pendingReconcileDpr !== null) {
                        const dpr = pendingReconcileDpr;
                        pendingReconcileDpr = null;
                        reconcileFromBackend(dpr);
                    }
                };
                const onTransEnd = (e) => {
                    if (e.target !== img || e.propertyName !== 'transform') return;
                    finishExit();
                };
                img.addEventListener('transitionend', onTransEnd);
                const fallback = setTimeout(finishExit, MINI_EXIT_MS + 250);
            });
        });
    }

    // ── 后端 eval 入口 ──────────────────────────────────────

    // 后端复用窗口时通过 eval 调用此函数重置状态
    // sourceDpr 由后端从图片初始落点显示器算出，不依赖 window.devicePixelRatio
    window.__blinkResetPin = function (dataUrl, pngW, pngH, screenX, screenY, showTranslating, sourceDpr) {
        sourcePixelW = pngW;
        sourcePixelH = pngH;
        const sdpr = sourceDpr || 1;
        monitorDpr = sdpr;
        const {baseCssW: bw, baseCssH: bh} = baseCssSize(pngW, pngH, sdpr);
        baseCssW = bw;
        baseCssH = bh;
        zoom = 1;
        isMinimized = false;
        savedZoom = 1;
        miniState = 'normal';
        miniAnimGen++;
        pendingReconcileDpr = null;
        reconcileGen = 0;
        commitGen = 0;
        img.style.transition = '';
        document.body.classList.remove('mini-mode');
        imageScreenX = screenX || 0;
        imageScreenY = screenY || 0;
        zoomLabel.textContent = '100%';
        zoomLabel.style.opacity = '0';
        // CSS 布局：left/top = padding（CSS 逻辑像素），width/height = baseCss
        img.style.width = baseCssW + 'px';
        img.style.height = baseCssH + 'px';
        img.style.left = PIN_PAD_CSS + 'px';
        img.style.top = PIN_PAD_CSS + 'px';
        img.style.transformOrigin = '0 0';
        img.style.transform = 'scale(1)';
        img.style.boxShadow = '';
        img.style.border = '';
        img.style.borderRadius = '';
        img.src = dataUrl;
        commitWindowRect();
        if (showTranslating) {
            showTranslatingIndicator();
        } else {
            hideTranslatingIndicator();
        }
        updatePinIndicatorPosition();
    };

    // 原地刷新 pin 图片（不重定位、不重置缩放）
    window.__blinkRefreshPinImage = function (dataUrl, w, h, showTranslating) {
        if (w === sourcePixelW && h === sourcePixelH) {
            img.src = dataUrl;
        } else {
            console.warn('[pin] 译文 PNG 尺寸与原图不一致，重置缩放', {
                old: {w: sourcePixelW, h: sourcePixelH},
                new: {w, h}
            });
            sourcePixelW = w;
            sourcePixelH = h;
            const {baseCssW: bw, baseCssH: bh} = baseCssSize(w, h, monitorDpr);
            baseCssW = bw;
            baseCssH = bh;
            img.style.width = baseCssW + 'px';
            img.style.height = baseCssH + 'px';
            img.src = dataUrl;
            updatePinIndicatorPosition();
        }
        if (!showTranslating) {
            hideTranslatingIndicator();
        } else {
            showTranslatingIndicator();
        }
    };

    // N+1 回收时后端 eval 调用，清空图片和状态
    window.__blinkClearPin = function () {
        img.src = '';
        sourcePixelW = 0;
        sourcePixelH = 0;
        baseCssW = 0;
        baseCssH = 0;
        zoom = 1;
        isMinimized = false;
        savedZoom = 1;
        miniState = 'normal';
        miniAnimGen++;
        pendingReconcileDpr = null;
        monitorDpr = 1;
        document.body.classList.remove('mini-mode');
        img.style.transition = '';
        img.style.transform = 'scale(1)';
        img.style.boxShadow = '';
        img.style.border = '';
        img.style.borderRadius = '';
        zoomLabel.style.opacity = '0';
        hideTranslatingIndicator();
        // 通知后端：回收完成，可被借用
        pinSpareReady().catch((e) => {
            const err = normalizeError(e);
            console.error(`pin_spare_ready (recycle) 调用失败: [${err.code}] ${err.message}`);
        });
    };

    img.addEventListener('load', () => {
        if (sourcePixelW === 0 || sourcePixelH === 0) {
            sourcePixelW = img.naturalWidth;
            sourcePixelH = img.naturalHeight;
            const dpr = monitorDpr || 1;
            const {baseCssW: bw, baseCssH: bh} = baseCssSize(sourcePixelW, sourcePixelH, dpr);
            baseCssW = bw;
            baseCssH = bh;
            img.style.width = baseCssW + 'px';
            img.style.height = baseCssH + 'px';
        }
        showZoomLabel();
    });

    // ── 原生拖动（Tauri startDragging）─────────────────────────
    // 系统处理鼠标捕获、跨屏边界和高频移动，移除每帧 IPC。
    // 只在图片可见区域按下左键时触发。
    // 移动阈值后再启动原生拖动，避免吞掉 click/dblclick。
    const DRAG_THRESHOLD = 5; // CSS px — 低于此位移视为点击
    let dragCandidate = null;   // { pointerId, x, y } 或 null
    let nativeDragActive = false;
    let suppressClick = false;  // 拖动后吞掉一次残余 click

    document.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        if (isMiniAnimating()) return;
        if (e.target.closest('#ctx-menu')) return;
        if (e.target.closest('#pin-ocr-panel')) return;
        // 检查是否点在图片可见区域内
        const imgLeft = PIN_PAD_CSS;
        const imgTop = PIN_PAD_CSS;
        const imgVisW = baseCssW * zoom;
        const imgVisH = baseCssH * zoom;
        if (e.clientX < imgLeft || e.clientX > imgLeft + imgVisW ||
            e.clientY < imgTop || e.clientY > imgTop + imgVisH) {
            return;
        }
        dragCandidate = {pointerId: e.pointerId, x: e.clientX, y: e.clientY};
        nativeDragActive = false;
    });

    document.addEventListener('pointermove', (e) => {
        if (!dragCandidate || e.pointerId !== dragCandidate.pointerId) return;
        if (!(e.buttons & 1)) return;
        const dx = e.clientX - dragCandidate.x;
        const dy = e.clientY - dragCandidate.y;
        if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        // 达到阈值，启动系统原生拖动
        dragCandidate = null;
        nativeDragActive = true;
        tauriWin?.startDragging?.().catch(() => {
            nativeDragActive = false;
        });
    });

    document.addEventListener('pointerup', () => {
        dragCandidate = null;
        if (!nativeDragActive) return;
        nativeDragActive = false;
        suppressClick = true;
        dragEndTime = Date.now();
        // 拖动刚结束，reconcile 从后端读真实位置
        reconcileFromBackend();
    });

    document.addEventListener('pointercancel', () => {
        dragCandidate = null;
        nativeDragActive = false;
    });

    // 吞掉原生拖动后浏览器可能产生的残余 click（capture 阶段，仅一次）
    document.addEventListener('click', (e) => {
        if (suppressClick) {
            suppressClick = false;
            e.stopPropagation();
            e.preventDefault();
        }
    }, true);

    // ── DPI 变化监听 ──────────────────────────────────────────
    // onScaleChanged: payload 可能有 { scaleFactor } 或直接是 number
    if (tauriWin?.onScaleChanged) {
        tauriWin.onScaleChanged((event) => {
            const payload = event?.payload ?? event;
            const newScaleFactor = payload?.scaleFactor ?? payload;
            if (typeof newScaleFactor === 'number' && newScaleFactor > 0) {
                tracing_debug('onScaleChanged', {newScaleFactor, oldDpr: monitorDpr});
                reconcileFromBackend(newScaleFactor);
            }
        }).catch(() => {
        });
    }

    // onMoved: 窗口移动后 debounce reconcile（备份机制，确保拖动后状态正确）
    let movedDebounce = 0;
    if (tauriWin?.onMoved) {
        tauriWin.onMoved(() => {
            clearTimeout(movedDebounce);
            movedDebounce = setTimeout(() => {
                // 安全网：若 pointerup 未被系统触发（startDragging 接管鼠标），
                // 在此清理拖动状态并标记 dragEndTime 供 contextmenu 判断。
                if (nativeDragActive) {
                    nativeDragActive = false;
                    suppressClick = true;
                    dragEndTime = Date.now();
                }
                reconcileFromBackend();
            }, 150);
        }).catch(() => {
        });
    }

    // ── 滚轮缩放（左上角固定锚点）────────────────────────────────
    document.addEventListener('wheel', (e) => {
        // 右键菜单 / OCR 面板内 wheel 不触发图片缩放
        if (e.target.closest('#pin-ocr-panel')) return;
        if (isMiniAnimating()) return;
        e.preventDefault();
        // 缩小态下滚轮：先恢复正常态，本次不叠加缩放
        if (isMinimized) {
            exitMiniMode();
            return;
        }
        const step = e.ctrlKey ? 0.25 : 0.1;
        const delta = e.deltaY > 0 ? -step : step;
        const newZoom = clampZoom(zoom + delta);
        if (newZoom === zoom) return;

        // 左上角固定：imageScreenX/Y 不变，只改 zoom
        zoom = newZoom;
        applyTransformOnly();
        commitWindowRect();
        showZoomLabel();
    }, {passive: false});

    // 双击：切换缩小/还原模式
    document.addEventListener('dblclick', (e) => {
        if (e.target.closest('#ctx-menu')) return;
        if (e.target.closest('#pin-ocr-panel')) return;
        if (isMiniAnimating()) return;
        // 翻译中不打断
        const indicator = document.getElementById('pin-translating-indicator');
        if (indicator && !indicator.classList.contains('hidden')) return;

        if (isMinimized) {
            exitMiniMode();
        } else {
            enterMiniMode();
        }
    });

    // ── 右键菜单 ──────────────────────────────────────────────
    document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (isMiniAnimating()) return;
        if (Date.now() - dragEndTime < 200) return;
        if (e.target.closest('#ctx-menu')) return;
        if (e.target.closest('#pin-ocr-panel')) return;
        showCtxMenu(e.clientX, e.clientY);
    });

    document.addEventListener('click', (e) => {
        if (isCtxOpen && !e.target.closest('#ctx-menu')) {
            hideCtxMenu();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (isCtxOpen) {
                hideCtxMenu();
            } else if (isMinimized) {
                exitMiniMode();
            } else {
                closePin();
            }
        }
    });

    /** 右键菜单显示——钳制在窗口可视区域内，防止越界被裁。 */
    function showCtxMenu(x, y) {
        // mini 模式只保留重置缩放 + 关闭
        ctxMenu.classList.toggle('ctx-menu-mini', isMinimized);
        ctxMenu.classList.remove('hidden');
        // 先显示才能测量尺寸
        const rect = ctxMenu.getBoundingClientRect();
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        let mx = x;
        let my = y;
        // 右越界 → 左移
        if (mx + rect.width > winW) {
            mx = Math.max(0, winW - rect.width - 4);
        }
        // 下越界 → 上移
        if (my + rect.height > winH) {
            my = Math.max(0, winH - rect.height - 4);
        }
        ctxMenu.style.left = mx + 'px';
        ctxMenu.style.top = my + 'px';
        isCtxOpen = true;
    }

    function hideCtxMenu() {
        ctxMenu.classList.add('hidden');
        isCtxOpen = false;
    }

    document.getElementById('ctx-edit-image').addEventListener('click', () => {
        hideCtxMenu();
        openImageEditorFromPin(myLabel)
            .catch((e) => {
                const err = normalizeError(e);
                // 0.20.7：同时判断 code 与 detail.reason，避免新增其他 invalid_state 被误判
                if (err.code === 'invalid_state' && err.detail?.reason === 'already_active') {
                    console.info('[pin] 编辑会话已活跃，后端已激活现有编辑器');
                } else if (err.code === 'not_found') {
                    console.warn('[pin] 图片不存在或窗口已关闭');
                } else {
                    console.error(`[pin] 从 pin 图打开编辑器失败 [${err.code}] ${err.message}`);
                }
            });
    });

    document.getElementById('ctx-close').addEventListener('click', () => {
        hideCtxMenu();
        closePin();
    });

    document.getElementById('ctx-reset-zoom').addEventListener('click', () => {
        hideCtxMenu();
        if (isMinimized) {
            exitMiniMode();
            savedZoom = 1;
        } else {
            // 左上角固定：imageScreenX/Y 不变
            zoom = 1;
            applyTransformOnly();
            commitWindowRect();
            showZoomLabel();
        }
    });

    document.getElementById('ctx-copy').addEventListener('click', async () => {
        hideCtxMenu();
        try {
            const png = await pinImageToPng();
            await pinSaveClipboard(png);
        } catch (e) {
            const err = normalizeError(e);
            console.error(`保存到剪贴板失败 [${err.code}] ${err.message}`);
        }
    });

    document.getElementById('ctx-save-as').addEventListener('click', async () => {
        hideCtxMenu();
        try {
            const png = await pinImageToPng();
            await pinSaveAs(png);
        } catch (e) {
            const err = normalizeError(e);
            if (!err.message.includes('用户取消了保存')) {
                console.error(`另存为失败 [${err.code}] ${err.message}`);
            }
        }
    });

    // ── pin 窗口内 OCR / 翻译 ──────────────────────────────────

    const pinOcrPanel = document.getElementById('pin-ocr-panel');
    const pinOcrSource = document.getElementById('pin-ocr-source');
    const pinOcrTranslated = document.getElementById('pin-ocr-translated');
    const pinOcrTabs = pinOcrPanel.querySelectorAll('.pin-ocr-tab');
    const pinOcrTranslateBtn = document.getElementById('pin-ocr-translate');
    const pinOcrCopyBtn = document.getElementById('pin-ocr-copy');
    const pinOcrTabTranslated = pinOcrPanel.querySelector('.pin-ocr-tab[data-tab="translated"]');

    let ocrBusy = false;

    /** 把 pin 窗口图片编码为 PNG bytes(通过 canvas)。
     *  用 img 的资源像素尺寸,不带 zoom scale——OCR 需要原图。 */
    function pinImageToPng() {
        return new Promise((resolve, reject) => {
            if (!sourcePixelW || !sourcePixelH || !img.src) {
                reject(new Error('图片未加载'));
                return;
            }
            const c = document.createElement('canvas');
            c.width = sourcePixelW;
            c.height = sourcePixelH;
            const cc = c.getContext('2d');
            try {
                cc.drawImage(img, 0, 0, sourcePixelW, sourcePixelH);
                c.toBlob((blob) => {
                    if (!blob) {
                        reject(new Error('toBlob 失败'));
                        return;
                    }
                    blob.arrayBuffer().then((buf) => resolve(new Uint8Array(buf))).catch(reject);
                }, 'image/png');
            } catch (e) {
                reject(e);
            }
        });
    }

    function showPinOcrPanel(text) {
        pinOcrSource.value = text || '（未识别到文字）';
        pinOcrTranslated.value = '';
        pinOcrTabTranslated.removeAttribute('data-stale');
        pinOcrTranslated.removeAttribute('data-stale');
        showPinOcrTab('source');
        pinOcrPanel.classList.remove('hidden');
    }

    function showPinOcrTab(name) {
        const isSource = name === 'source';
        pinOcrTabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
        pinOcrSource.hidden = !isSource;
        pinOcrTranslated.hidden = isSource;
    }

    pinOcrTabs.forEach((t) => {
        t.addEventListener('click', () => showPinOcrTab(t.dataset.tab));
    });

    pinOcrSource.addEventListener('input', () => {
        if (pinOcrTranslated.value) {
            pinOcrTabTranslated.setAttribute('data-stale', 'true');
            pinOcrTranslated.setAttribute('data-stale', 'true');
        }
    });

    document.getElementById('pin-ocr-close').addEventListener('click', () => {
        pinOcrPanel.classList.add('hidden');
    });

    async function doPinTranslate() {
        const src = pinOcrSource.value.trim();
        if (!src || src === '（未识别到文字）') return;
        pinOcrTranslateBtn.disabled = true;
        pinOcrTranslateBtn.textContent = '翻译中…';
        pinOcrTranslated.value = '翻译中,请稍候…';
        showPinOcrTab('translated');
        try {
            const dst = await translateText(src);
            pinOcrTranslated.value = dst;
            pinOcrTabTranslated.removeAttribute('data-stale');
            pinOcrTranslated.removeAttribute('data-stale');
        } catch (e) {
            const err = normalizeError(e);
            pinOcrTranslated.value = `翻译失败：${err.message}`;
        } finally {
            pinOcrTranslateBtn.disabled = false;
            pinOcrTranslateBtn.textContent = '翻译';
        }
    }

    pinOcrTranslateBtn.addEventListener('click', doPinTranslate);

    pinOcrCopyBtn.addEventListener('click', () => {
        const currentTa = pinOcrSource.hidden ? pinOcrTranslated : pinOcrSource;
        const value = currentTa.value;
        if (value) {
            navigator.clipboard.writeText(value).catch((e) => {
                const err = normalizeError(e);
                console.error(`复制失败 [${err.code}] ${err.message}`);
            });
        }
        pinOcrPanel.classList.add('hidden');
    });

    async function runPinOcr(autoTranslate) {
        if (ocrBusy) return;
        ocrBusy = true;
        try {
            const png = await pinImageToPng();
            const result = await ocrImage(png);
            showPinOcrPanel((result && result.text) || '');
            if (autoTranslate) {
                setTimeout(doPinTranslate, 0);
            }
        } catch (e) {
            const err = normalizeError(e);
            console.error(`[pin OCR] [${err.code}] ${err.message}`);
            showPinOcrPanel(`识别失败：${err.message}`);
        } finally {
            ocrBusy = false;
        }
    }

    document.getElementById('ctx-ocr').addEventListener('click', () => {
        hideCtxMenu();
        runPinOcr(false);
    });

    document.getElementById('ctx-translate').addEventListener('click', () => {
        hideCtxMenu();
        runPinOcr(true);
    });

    // 防止面板内交互被外层 mousedown/click 打断
    pinOcrPanel.addEventListener('mousedown', (e) => e.stopPropagation());
    pinOcrPanel.addEventListener('click', (e) => e.stopPropagation());
    pinOcrPanel.addEventListener('contextmenu', (e) => e.stopPropagation());
    pinOcrPanel.addEventListener('dblclick', (e) => e.stopPropagation());
    pinOcrPanel.addEventListener('wheel', (e) => e.stopPropagation());

    // ── 翻译中指示器 ──────────────────────────────────────────
    function showTranslatingIndicator() {
        const el = document.getElementById('pin-translating-indicator');
        if (el) el.classList.remove('hidden');
        updatePinIndicatorPosition();
        const ctxTranslate = document.getElementById('ctx-translate');
        if (ctxTranslate) ctxTranslate.disabled = true;
    }

    function hideTranslatingIndicator() {
        const el = document.getElementById('pin-translating-indicator');
        if (el) el.classList.add('hidden');
        const ctxTranslate = document.getElementById('ctx-translate');
        if (ctxTranslate) ctxTranslate.disabled = false;
    }

    function closePin() {
        invoke('screenshot_pin_hide', {label: myLabel}).catch((e) => {
            const err = normalizeError(e);
            console.error(`screenshot_pin_hide 失败 [${err.code}] ${err.message}`);
        });
    }
</script>
</body>
</html>
