<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>Blink GIF</title>
    <link href="css/entries/gif-recorder.css" rel="stylesheet"/>
</head>
<body>
<!--
  0.28.7 GIF 录制控制条（gif-control 窗口）。
  - 只展示状态 + 发指令（暂停/继续/停止/取消）；状态真源在后端
    `blink://gif-recorder-state` 事件 + `gif_recorder_state` 拉取。
  - 窗口由后端定位在选区下方（避让选区——控制条不入成品）；
    倒计时数字大显示（COUNTDOWN_MS>0 时），录制中显示有效时长（暂停剔除）。
-->
<div id="gif-control">
    <div class="state">
        <!-- 倒计时大数字（phase=countdown）；默认显示占位，避免页面加载到首个
             状态事件之间是纯灰空窗（后端 250ms ticker 到达后由 renderState 纠正） -->
        <div class="countdown" id="countdown">…</div>
        <!-- 录制状态行（phase=recording/paused） -->
        <div class="rec-line hidden" id="rec-line">
            <span class="rec-dot paused" id="rec-dot"></span>
            <span class="rec-time" id="rec-time">00:00.0</span>
            <span class="rec-frames" id="rec-frames">0 帧</span>
        </div>
    </div>
    <div class="actions">
        <button class="ctl-btn" id="btn-pause" title="暂停/继续" type="button">
            <svg aria-hidden="true" class="icon"><use href="#icon-pause"/></svg>
            <svg aria-hidden="true" class="icon hidden"><use href="#icon-play"/></svg>
        </button>
        <button class="ctl-btn ctl-primary" id="btn-stop" title="停止并编辑" type="button">
            <svg aria-hidden="true" class="icon"><use href="#icon-square"/></svg>
            <span>停止</span>
        </button>
        <button class="ctl-btn" id="btn-cancel" title="取消并丢弃" type="button">
            <svg aria-hidden="true" class="icon"><use href="#icon-x"/></svg>
        </button>
    </div>
</div>
<script src="js/gif/recorder.js" type="module"></script>
</body>
</html>
