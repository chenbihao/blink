<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Blink Voice</title>
    <link href="css/entries/voice-overlay.css" rel="stylesheet"/>
</head>
<body>
<!-- 0.23.3 通用浮窗：同一窗口按 target/mode/phase 投影（§5.4）。
     g2 hold 模式 = 既有布局；editor 连续听写模式 = 拖拽条 + 波形 + 预览 + 控制。
     0.23.7：editor 模式进入即用固定稳定尺寸（js/voice-overlay/layout.js），预览区
     内部滚动，窗口不再随识别文本跳动；三个控制按钮图标化，"返回编辑器"有足够宽度。 -->
<div id="overlay" class="mode-g2">
    <!-- editor 模式拖拽条（mini/展开切换 + 语音设置入口）。
         整条都是 data-tauri-drag-region，标题占满剩余宽度，拖拽热区不再只有窄窄一条；
         两个图标按钮是交互控件，Tauri 拖拽判定只命中带属性的元素本身，按钮天然 no-drag。 -->
    <div class="editor-strip hidden" data-tauri-drag-region id="editor-strip">
        <span aria-label="" class="editor-dot" id="editor-dot" role="img"></span>
        <span class="editor-strip-title" data-i18n="voice.overlay.dictation" data-tauri-drag-region>连续听写</span>
        <button aria-label="语音设置" class="editor-strip-btn" data-i18n-aria-label="voice.overlay.settings"
                data-i18n-title="voice.overlay.settings" id="btn-settings" title="语音设置" type="button">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-settings"/>
            </svg>
        </button>
        <button aria-label="收起" class="editor-strip-btn" data-i18n-aria-label="voice.overlay.collapse"
                data-i18n-title="voice.overlay.collapse" id="btn-toggle-size" title="收起" type="button">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-chevron-down"/>
            </svg>
        </button>
    </div>
    <div aria-hidden="true" class="voice-wave" id="wave">
        <div class="vw-bar"></div>
        <div class="vw-bar"></div>
        <div class="vw-bar"></div>
        <div class="vw-bar"></div>
        <div class="vw-bar"></div>
    </div>
    <div aria-atomic="true" aria-live="polite" class="text" id="partial-text" role="status">语音输入中…</div>
    <div class="hint" data-i18n="voice.overlay.hint" id="hint">松开结束 · ESC 取消</div>
    <div class="editor-controls hidden" id="editor-controls">
        <!-- 暂停/继续：图标 + title 提示（文案随 phase 切换，由 JS 维护 aria-label） -->
        <button aria-label="暂停" class="editor-ctl editor-ctl-icon" id="btn-pause" title="暂停" type="button">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-pause"/>
            </svg>
        </button>
        <!-- 结束：图标 + title 提示 -->
        <button aria-label="结束" class="editor-ctl editor-ctl-icon editor-ctl-stop" id="btn-stop" title="结束"
                type="button">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-square"/>
            </svg>
        </button>
        <!-- 返回编辑器：主操作，图标 + 完整文案（flex 撑开剩余宽度，不再溢出） -->
        <button class="editor-ctl editor-ctl-back" id="btn-back" type="button">
            <svg aria-hidden="true" class="icon">
                <use href="#icon-arrow-left"/>
            </svg>
            <span data-i18n="voice.overlay.backToEditor">返回编辑器</span>
        </button>
    </div>
</div>
<script type="module">
    import {invoke, listen} from "./js/shared/tauri.js";
    import {EVENTS} from "./js/shared/event-names.js";
    import {t, applyI18nFromConfig, onLangChange} from "./js/i18n/index.js";
    import {applyThemeFromConfig} from "./js/shared/theme.js";
    import {ensureSpriteLoaded} from "./js/shared/icon.js";
    import {resolveOverlaySize} from "./js/voice-overlay/layout.js";
    import {
        focusContentEditor,
        pauseEditorVoice,
        resumeEditorVoice,
        stopEditorVoice,
    } from "./js/shared/api.js";
    // 应用主题（与主窗口/设置页统一）
    ensureSpriteLoaded();
    applyThemeFromConfig();

    const overlayEl = document.getElementById("overlay");
    const textEl = document.getElementById("partial-text");
    const waveEl = document.getElementById("wave");
    const bars = waveEl.querySelectorAll(".vw-bar");
    const hintEl = document.getElementById("hint");
    const stripEl = document.getElementById("editor-strip");
    const dotEl = document.getElementById("editor-dot");
    const controlsEl = document.getElementById("editor-controls");
    const pauseBtn = document.getElementById("btn-pause");
    const stopBtn = document.getElementById("btn-stop");
    const backBtn = document.getElementById("btn-back");
    const toggleSizeBtn = document.getElementById("btn-toggle-size");
    const toggleSizeIconUse = toggleSizeBtn.querySelector("use");
    const pauseIconUse = pauseBtn.querySelector("use");

    // textEl 当前是否显示默认文案（非 partial / status / error 文本）
    // 用于语言切换时判断是否需要更新默认文案
    let isDefaultText = true;

    // ── 模式与状态（0.23.3 §5.4 投影）────────────────────────────────
    // mode: "g2" | "editor"；editorPhase: recording/paused/finalizing/error/null
    let mode = "g2";
    let editorPhase = null;
    let mini = false;
    // G2 事件竞态墙：旧录音 epoch、旧 Preview request 不得覆盖当前显示。
    let voiceEpoch = 0;
    let latestPreviewRequest = 0;
    let displayedConfirmed = "";

    function setMode(next) {
        mode = next;
        overlayEl.classList.toggle("mode-g2", mode === "g2");
        overlayEl.classList.toggle("mode-editor", mode === "editor");
        stripEl.classList.toggle("hidden", mode !== "editor");
        controlsEl.classList.toggle("hidden", mode !== "editor" || mini);
        hintEl.classList.toggle("hidden", mode === "editor");
        textEl.classList.toggle("hidden", mode === "editor" && mini);
    }

    const PHASE_TITLE_KEYS = {
        recording: "voice.overlay.recording",
        paused: "voice.overlay.paused",
        finalizing: "voice.overlay.finalizing",
        error: "voice.overlay.paused",
        ended: "voice.overlay.stop",
    };

    function setEditorPhase(phase) {
        editorPhase = phase;
        overlayEl.classList.remove("editor-recording", "editor-paused", "editor-finalizing", "editor-error");
        if (phase) overlayEl.classList.add(`editor-${phase}`);
        const titleKey = PHASE_TITLE_KEYS[phase];
        dotEl.title = titleKey ? t(titleKey) : "";
        dotEl.setAttribute("aria-label", dotEl.title);
        controlsEl.classList.toggle("hidden", mode !== "editor" || mini);
        const busy = phase === "finalizing";
        pauseBtn.disabled = busy;
        stopBtn.disabled = busy;
        const paused = phase === "paused";
        // 暂停/继续是图标按钮：图标、title 与 aria-label 三者随 phase 同步切换
        //（非颜色单通道：图标形状 + 可访问名称双通道表达状态）
        pauseIconUse.setAttribute("href", paused ? "#icon-play" : "#icon-pause");
        const pauseLabel = t(paused ? "voice.overlay.resume" : "voice.overlay.pause");
        pauseBtn.title = pauseLabel;
        pauseBtn.setAttribute("aria-label", pauseLabel);
    }

    /** 文本区渲染：confirmed（保留窗口定稿）+ preview 双层，与 G2 模式同构。
     *  0.23.13：保留窗口外的定稿已进正文，浮窗只显示窗口内最新 1 段 + 实时预览 */
    function setEditorText(preview, confirmed) {
        if (preview || confirmed) {
            textEl.innerHTML = '<span class="voice-confirmed"></span>' +
                '<span class="voice-preview"></span>';
            textEl.querySelector(".voice-confirmed").textContent = confirmed || "";
            textEl.querySelector(".voice-preview").textContent = preview || "";
            // 预览区固定高度内部滚动：最新文本在底部，每次更新滚到底，
            // 避免录制中超出的内容被藏在可视区外
            textEl.scrollTop = textEl.scrollHeight;
            isDefaultText = false;
        } else {
            textEl.textContent = editorPhase === "paused"
                ? t("voice.overlay.paused")
                : t("voice.overlay.recording");
            isDefaultText = true;
        }
    }

    // ── 窗口尺寸（0.10.6 内容撑高 + 0.23.7 editor 固定稳定尺寸）────────
    // g2：rAF 后测量内容高度撑高（§5.2 窗体尺寸稳定）；
    // editor：固定尺寸（layout.js），预览文本内部滚动，窗口不随识别文本跳动。
    let lastSize = {width: -1, height: -1};
    // editor 模式尺寸断言标记：首个状态事件上再强制应用一次，
    // 覆盖后端 show/复用窗口时序把尺寸重置回默认值的竞态。
    let editorSizeAsserted = false;

    function sendSize(width, height, {force = false} = {}) {
        if (!force
            && Math.abs(width - lastSize.width) < 1
            && Math.abs(height - lastSize.height) <= 2) {
            return;
        }
        lastSize = {width, height};
        invoke("resize_voice_overlay", {height, width}).catch(() => {
        });
    }

    /** 应用当前模式的目标尺寸；force 时绕过缓存强制下发。 */
    function applySize({force = false} = {}) {
        if (force) lastSize = {width: -1, height: -1};
        if (mode === "editor") {
            const {width, height} = resolveOverlaySize({mode, mini});
            sendSize(width, height);
            return;
        }
        // 文本更新后测量内容高度：必须在 rAF 内读 scrollHeight，否则拿到旧 layout
        requestAnimationFrame(() => {
            const {width, height} = resolveOverlaySize({
                mode,
                contentHeight: document.body.scrollHeight,
            });
            sendSize(width, height);
        });
    }

    function resetWave() {
        bars.forEach((bar) => (bar.style.height = "4px"));
        waveEl.classList.remove("voice-loading", "voice-error");
    }

    function resetHint() {
        hintEl.textContent = t("voice.overlay.hint");
        hintEl.classList.remove("voice-hint-error");
    }

    function resetToDefaultText() {
        textEl.textContent = t("voice.overlay.recording");
        isDefaultText = true;
    }

    // ── 控制按钮（仅 editor 模式）────────────────────────────────────
    pauseBtn.addEventListener("click", () => {
        if (editorPhase === "paused") {
            resumeEditorVoice().catch(() => {});
        } else {
            pauseEditorVoice().catch(() => {});
        }
    });

    // ── G2 模式整体可拖动（0.23.x 跟随光标落点可能不理想，允许手动挪动）──
    // 浮窗是小尺寸 HUD，除按钮外整面都是拖拽热区（按下即进系统拖拽循环，
    // 不做文本选择）；editor 模式保持 strip 拖拽，按钮/预览滚动区不受影响。
    overlayEl.addEventListener("mousedown", (event) => {
        if (mode !== "g2" || event.button !== 0) return;
        if (event.target.closest("button")) return;
        event.preventDefault();
        invoke("plugin:window|start_dragging").catch(() => {});
    });

    stopBtn.addEventListener("click", () => {
        stopEditorVoice().catch(() => {});
    });

    backBtn.addEventListener("click", () => {
        focusContentEditor().catch(() => {});
    });

    toggleSizeBtn.addEventListener("click", () => {
        mini = !mini;
        overlayEl.classList.toggle("mini", mini);
        toggleSizeIconUse.setAttribute("href", mini ? "#icon-square" : "#icon-chevron-down");
        toggleSizeBtn.title = t(mini ? "voice.overlay.expand" : "voice.overlay.collapse");
        toggleSizeBtn.setAttribute("aria-label", toggleSizeBtn.title);
        controlsEl.classList.toggle("hidden", mode !== "editor" || mini);
        textEl.classList.toggle("hidden", mode === "editor" && mini);
        applySize({force: true});
    });

    document.getElementById("btn-settings").addEventListener("click", () => {
        invoke("open_settings_tab", {tab: "voice"}).catch(() => {});
    });

    // ── i18n 初始化 ──────────────────────────────────────────────────
    applyI18nFromConfig().then(() => {
        if (isDefaultText) resetToDefaultText();
    });

    onLangChange(() => {
        if (isDefaultText) resetToDefaultText();
        // 语言切换会改变按钮文案宽度，editor 模式为固定尺寸（预留了余量），
        // g2 模式按内容重新撑高一次。
        applySize({force: true});
    });

    // ── 音量级别 → 波形（g2 / editor 都驱动）────────────────────────
    listen(EVENTS.VOICE_LEVEL, (event) => {
        const {level, target} = event.payload ?? {};
        if (target !== "g2" && target !== "editor") return;
        const lv = Math.max(0, Math.min(1, level || 0));
        bars.forEach((bar, i) => {
            const factor = [0.6, 0.85, 1.0, 0.85, 0.6][i] || 0.7;
            // jitter 独立于 lv：即使安静时也有微妙呼吸感
            const jitter = (Math.sin(Date.now() / 80 + i * 1.3) + 1) * 0.08;
            const h = Math.max(4, (lv * factor + jitter) * 20);
            bar.style.height = h + "px";
        });
    });

    // ── 录音开始：按 target 切换模式 ─────────────────────────────────
    listen(EVENTS.VOICE_RECORDING_START, (event) => {
        const {target, epoch} = event.payload ?? {};
        if (target === "g2" && Number.isFinite(Number(epoch))) {
            voiceEpoch = Number(epoch);
            latestPreviewRequest = 0;
            displayedConfirmed = "";
        }
        resetWave();
        resetHint();
        if (target === "editor") {
            setMode("editor");
            setEditorPhase("recording");
            setEditorText("");
            // 0.23.7：进入 editor 模式立即设定稳定尺寸，不等第一条预览文本；
            // force 覆盖后端 show/复用时重置默认尺寸的时序。
            editorSizeAsserted = false;
            applySize({force: true});
        } else {
            setMode("g2");
            resetToDefaultText();
            applySize({force: true});
        }
    });

    // ── editor 听写状态（phase 投影 + preview 装饰层）────────────────
    listen(EVENTS.EDITOR_VOICE_STATUS, (event) => {
        const p = event.payload ?? {};
        if (p.phase === undefined && p.preview === undefined) return;
        if (p.phase) setEditorPhase(p.phase);
        if (p.phase === "ended") {
            // 后端随之隐藏窗口；页面复位等待下次复用
            setMode("g2");
            resetToDefaultText();
            resetWave();
            applySize({force: true});
            return;
        }
        if (p.phase === "error") {
            textEl.textContent = t("voice.overlay.error");
            isDefaultText = false;
            waveEl.classList.add("voice-error");
            applySize();
            return;
        }
        setEditorText(p.preview || "", p.confirmed || "");
        if (mode === "editor") {
            if (!editorSizeAsserted) {
                editorSizeAsserted = true;
                applySize({force: true});
            }
            // editor 模式此后不再随预览文本调整窗口，预览区内部滚动
            return;
        }
        applySize();
    });

    // ── 录音结束 → 复位（g2 / editor 兜底路径）───────────────────────
    listen(EVENTS.VOICE_RECORDING_END, () => {
        setMode("g2");
        displayedConfirmed = "";
        latestPreviewRequest = 0;
        resetToDefaultText();
        resetWave();
        resetHint();
        applySize({force: true});
    });

    // ── g2 流式 partial 文本 ─────────────────────────────────────────
    listen(EVENTS.VOICE_PARTIAL, (event) => {
        const payload = event.payload ?? {};
        if (payload.target !== "g2") return;

        const eventEpoch = Number(payload.epoch ?? 0);
        if (eventEpoch && voiceEpoch && eventEpoch < voiceEpoch) return;
        if (eventEpoch > voiceEpoch) {
            voiceEpoch = eventEpoch;
            latestPreviewRequest = 0;
            displayedConfirmed = "";
        }
        const requestId = Number(payload.previewRequestId ?? payload.requestId ?? 0);
        if (requestId && requestId < latestPreviewRequest) return;
        if (requestId) latestPreviewRequest = requestId;

        // 优先使用 confirmed + preview 双字段（伪流式）
        if (payload.confirmed !== undefined || payload.preview !== undefined || Array.isArray(payload.drafts)) {
            const confirmed = payload.confirmed !== undefined
                ? String(payload.confirmed || "")
                : Array.isArray(payload.drafts)
                    ? payload.drafts.map((draft) => draft?.text || "").join("")
                    : displayedConfirmed;
            const preview = payload.preview || "";
            displayedConfirmed = confirmed;
            if (confirmed || preview) {
                // 双色渲染：confirmed 白色 + preview 灰色半透明
                textEl.innerHTML =
                    '<span class="voice-confirmed"></span>' +
                    '<span class="voice-preview"></span>';
                textEl.querySelector(".voice-confirmed").textContent = confirmed;
                textEl.querySelector(".voice-preview").textContent = preview;
                isDefaultText = false;
                applySize();
            } else {
                // Draft 覆盖后 Preview 可能被明确清空；不保留旧虚字。
                textEl.textContent = "";
                isDefaultText = false;
                applySize();
            }
        } else if (payload.text) {
            // 兼容旧格式（真流式 / 非流式引擎）
            textEl.textContent = payload.text;
            isDefaultText = false;
            applySize();
        }
    });

    // ── 语音状态提示（g2 模型加载中等）──────────────────────────────
    listen(EVENTS.VOICE_STATUS, (event) => {
        const {message, target} = event.payload ?? {};
        if (target !== "g2" || !message) return;
        textEl.textContent = message;
        isDefaultText = false;
        // 模型加载中：波形转蓝色（清除可能残留的错误态红色）
        waveEl.classList.remove("voice-error");
        waveEl.classList.add("voice-loading");
        applySize();
    });

    // ── 语音错误提示（STT 未配置 / 服务未启动等）────────────────────
    listen(EVENTS.VOICE_ERROR, (event) => {
        const {message, target} = event.payload ?? {};
        if ((target !== "g2" && target !== "editor") || !message) return;
        waveEl.classList.remove("voice-loading"); // 清除可能残留的加载态
        waveEl.classList.add("voice-error");
        if (target === "editor") {
            textEl.textContent = t("voice.overlay.error");
            isDefaultText = false;
            setEditorPhase("error");
            applySize();
            return;
        }
        // G2 录音中出错且已有 confirmed 转写：保留正文（0.23.9 §3.9
        // "保留已成功 Draft 供用户查看"），错误信息改挂 hint 行；
        // 无转写（配置错误等）维持旧行为：正文区直接显示错误。
        const hasTranscript = !isDefaultText && !!textEl.querySelector(".voice-confirmed");
        if (hasTranscript) {
            hintEl.textContent = message;
            hintEl.classList.add("voice-hint-error");
        } else {
            textEl.textContent = message;
            isDefaultText = false;
        }
        applySize();
    });
</script>
</body>
</html>
