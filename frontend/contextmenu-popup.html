<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Menu</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg); /* 避免透明时的白色闪烁 */
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .context-menu {
      min-width: 170px;
      padding: 6px;
      background: var(--bg);
      border: 1px solid var(--surface-2);
      border-radius: 8px;
      box-shadow: 0 8px 32px var(--shadow);
      font-size: 13px;
      user-select: none;
      color: var(--text);
    }

    .context-menu-item {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .context-menu-item:hover {
      background: var(--surface);
    }

    .context-menu-item.danger {
      color: var(--red);
    }

    .context-menu-item.danger:hover {
      background: var(--danger-hover-bg);
    }

    .context-menu-sep {
      height: 1px;
      margin: 4px 6px;
      background: var(--surface);
    }
  </style>
</head>
<body>
  <div id="menu" class="context-menu"></div>

  <script>
    // 同步渲染，避免任何异步延迟
    const TAU = window.__TAURI__;
    const invoke = TAU?.core?.invoke ?? TAU?.invoke;

    // 从 URL 参数解析菜单数据
    // 注意：URLSearchParams.get() 已自动做 URL 解码，不要再 decodeURIComponent！
    const params = new URLSearchParams(window.location.search);

    // 应用主题（URL 参数透传 AppConfig.theme；auto 由 matchMedia resolve）
    // 同步执行，在菜单渲染前完成，避免主题闪烁
    (function applyTheme(mode) {
      let resolved = mode;
      if (mode === "auto") {
        resolved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
      else document.documentElement.removeAttribute("data-theme");
    })(params.get("theme") || "auto");

    const itemsRaw = params.get('items');
    let items = [];
    try {
      items = JSON.parse(itemsRaw || '[]');
    } catch (e) {
      console.error('右键菜单 JSON 解析失败:', e, itemsRaw);
    }

    let isClickingItem = false; // 菜单项 mousedown → click 期间置为 true，阻止 blur 关闭

    // 渲染菜单（同步执行，DOM 立即完成）
    const menuEl = document.getElementById('menu');
    const fragment = document.createDocumentFragment();
    items.forEach((item, index) => {
      if (item.separator) {
        const sep = document.createElement('div');
        sep.className = 'context-menu-sep';
        fragment.appendChild(sep);
        return;
      }
      const row = document.createElement('div');
      row.className = 'context-menu-item' + (item.danger ? ' danger' : '');
      row.textContent = item.label;
      row.addEventListener('mousedown', (e) => {
        isClickingItem = true; // 标记正在点击菜单项，blur 时不立即关闭
      });
      row.addEventListener('click', (e) => {
        if (invoke) invoke('context_menu_action', { actionId: index });
        isClickingItem = false;
      });
      fragment.appendChild(row);
    });
    menuEl.appendChild(fragment);

    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && invoke) invoke('hide_context_menu');
    });

    // 失焦关闭：点击菜单项时不立即关闭（等 click 事件执行）
    window.addEventListener('blur', () => {
      if (isClickingItem) {
        // 正在点击菜单项，延迟关闭确保 action 先执行
        setTimeout(() => {
          if (invoke) invoke('hide_context_menu');
        }, 100);
      } else {
        if (invoke) invoke('hide_context_menu');
      }
    });
  </script>
</body>
</html>
