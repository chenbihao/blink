<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Menu</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/themes-nvchad.css" />
  <link rel="stylesheet" href="css/themes-genshin.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg); /* 避免透明时的白色闪烁 */
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .context-menu {
      min-width: 170px;
      padding: 6px;
      background: var(--bg);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 32px var(--shadow), 0 0 0 1px var(--border-glow);
      font-size: 13px;
      user-select: none;
      color: var(--text);
    }

    .context-menu-item {
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
    }

    .context-menu-item:hover {
      background: var(--surface);
    }

    .context-menu-item.danger {
      color: var(--red);
    }

    .context-menu-item.danger:hover {
      background: var(--danger-hover-bg);
    }

    .context-menu-sep {
      height: 1px;
      margin: 4px 6px;
      background: var(--surface);
    }
  </style>
</head>
<body>
  <div id="menu" class="context-menu"></div>

  <script>
    const TAU = window.__TAURI__;
    const invoke = TAU?.core?.invoke ?? TAU?.invoke;
    const listen = TAU?.event?.listen;

    /** 应用主题（后端已 resolve auto → light/dark，此处只设属性）。 */
    function applyTheme(theme) {
      if (theme === "dark") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", theme);
    }

    /** 渲染菜单项（复用窗口时可反复调用）。 */
    function renderMenu(items) {
      const menuEl = document.getElementById('menu');
      menuEl.innerHTML = '';
      const fragment = document.createDocumentFragment();
      items.forEach((item, index) => {
        if (item.separator) {
          const sep = document.createElement('div');
          sep.className = 'context-menu-sep';
          fragment.appendChild(sep);
          return;
        }
        const row = document.createElement('div');
        row.className = 'context-menu-item' + (item.danger ? ' danger' : '');
        row.textContent = item.label;
        row.addEventListener('mousedown', () => { isClickingItem = true; });
        row.addEventListener('click', () => {
          if (invoke) invoke('context_menu_action', { actionId: index });
          isClickingItem = false;
        });
        fragment.appendChild(row);
      });
      menuEl.appendChild(fragment);
    }

    /** 后端复用窗口时通过 eval 直接调用此入口（emit 在隐藏态会被 WebView2 丢弃）。 */
    window.__renderContextMenu = function (itemsArray, theme) {
      if (theme) applyTheme(theme);
      renderMenu(itemsArray);
    };

    let isClickingItem = false;

    // ── 初始渲染（从 URL 参数，首次创建窗口时）──
    const params = new URLSearchParams(window.location.search);
    applyTheme(params.get("theme") || "dark");
    try {
      const initialItems = JSON.parse(params.get('items') || '[]');
      renderMenu(initialItems);
    } catch (e) {
      console.error('右键菜单 JSON 解析失败:', e);
    }

    // ── 复用窗口：后端 hide → emit 新数据 → show，此处监听并重新渲染 ──
    if (listen) {
      listen("blink://context-menu-data", (event) => {
        const { items, theme } = event.payload;
        if (theme) applyTheme(theme);
        try {
          renderMenu(JSON.parse(items || '[]'));
        } catch (e) {
          console.error('context-menu-data JSON 解析失败:', e, items);
        }
      });
    }

    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && invoke) invoke('hide_context_menu');
    });

    // 失焦关闭：点击菜单项时不立即关闭（等 click 事件执行）
    window.addEventListener('blur', () => {
      if (isClickingItem) {
        setTimeout(() => { if (invoke) invoke('hide_context_menu'); }, 100);
      } else {
        if (invoke) invoke('hide_context_menu');
      }
    });
  </script>
</body>
</html>
