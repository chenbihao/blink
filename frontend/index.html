<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- #app 整张卡片：只有容器本身可拖动，可点击元素（input/结果项）明确排除。
         不用 deep 模式，避免第一次点击被拖动检测吞掉导致"需要双击" -->
    <div id="app" data-tauri-drag-region>
      <div id="search-bar">
        <input id="query" type="text" placeholder="输入应用名、计算…" autocomplete="off" spellcheck="false" />
      </div>
      <ul id="results"></ul>
      <div id="statusbar"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
