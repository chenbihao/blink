<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/themes-nvchad.css" />
    <link rel="stylesheet" href="css/themes-genshin.css" />
    <link rel="stylesheet" href="css/kbd.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/chord.css" />
  </head>
  <body>
    <!-- #app 整张卡片：只有容器本身可拖动，可点击元素（input/结果项）明确排除。
         不用 deep 模式，避免第一次点击被拖动检测吞掉导致"需要双击" -->
    <div id="app" data-tauri-drag-region>
      <div id="search-bar">
        <div class="input-wrap">
          <!-- Ghost overlay：0.8.1 §2.6 双层 DOM。ghost-typed 与用户输入等宽同字体但透明（占位对齐），
               ghost-suggest 灰色半透明显示 "→ fanyi" 类补全后缀。overlay 与 input 完全对齐 padding/字体。 -->
          <div id="ghost-overlay" aria-hidden="true"><span class="ghost-typed"></span><span class="ghost-suggest"></span></div>
          <input id="query" type="text" data-i18n-ph="search.placeholder" placeholder="输入应用名、计算…" autocomplete="off" spellcheck="false" />
        </div>
      </div>
      <div id="chord-menu" aria-hidden="true"></div>
      <ul id="results"></ul>
      <div id="clipboard-panel" aria-hidden="true"></div>
      <div id="statusbar"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
