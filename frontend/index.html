<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Blink</title>
    <link href="css/entries/main.css" rel="stylesheet"/>
    <!-- 0.17.6: Cherry Markdown Stream 版（主窗口 AI 展示区渲染） -->
    <link href="vendor/cherry-markdown.min.css" rel="stylesheet"/>
    <script src="vendor/cherry-markdown.stream.min.js"></script>
</head>
<body>
<!-- #app 整张卡片：只有容器本身可拖动，可点击元素（input/结果项）明确排除。
     不用 deep 模式，避免第一次点击被拖动检测吞掉导致"需要双击" -->
<div data-tauri-drag-region id="app">
    <!-- ModeHeader（0.24.4 §5.5）：持续模式的唯一呈现（AI / 命令 / 剪贴板）。
         无模式时隐藏，不占高度；mode-header.js 投影。 -->
    <div class="hidden" data-tauri-drag-region id="mode-header">
        <!-- drag-region：徽章行无交互，兼作拖动热区（非 deep 模式按 target 命中，
             子元素同加属性；icon 由 CSS pointer-events:none 穿透） -->
        <span class="mode-icon" data-tauri-drag-region></span>
        <span class="mode-label" data-tauri-drag-region></span>
        <span class="mode-hint" data-tauri-drag-region></span>
    </div>

    <!-- 搜索模式（0.17.6: 独立容器，与 AI 模式 display 切换） -->
    <div id="search-mode">
        <div id="search-bar">
            <div class="input-wrap">
                <!-- CompletionGhost overlay（0.24.4 收窄为输入延伸）：.ghost-typed 与用户输入
                     等宽同字体但透明（占位对齐），.ghost-suggest 灰色半透明显示 "-> fanyi" 类
                     补全后缀与语音转写预览。.ghost-chord 是空 query + Alt 按住时的待命键帽
                     影子（0.24.7 回退恢复）。Translate/AskAi 建议走 #suggestion-bar。 -->
                <div aria-hidden="true" id="ghost-overlay"><span class="ghost-typed"></span><span
                        class="ghost-suggest"></span><span class="ghost-chord"></span></div>
                <input autocomplete="off" id="query" spellcheck="false" type="text"/>
                <!-- 0.10 G1 录音指示器：录音中显示音量波动条 + "语音输入中" -->
                <div class="voice-indicator hidden" id="voice-indicator">
                    <div class="voice-wave">
                        <div class="vw-bar"></div>
                        <div class="vw-bar"></div>
                        <div class="vw-bar"></div>
                        <div class="vw-bar"></div>
                        <div class="vw-bar"></div>
                    </div>
                    <span class="voice-label" data-i18n="voice.indicator.recording">语音输入中</span>
                </div>
            </div>
        </div>
        <!-- SuggestionBar（0.24.4 §5.2 双槽位）：Primary → Tab / Secondary → Shift+Tab，
             只渲染非 Completion 槽位（Completion 走 ghost 影子，同一建议不在两个视觉区
             重复出现）。suggestion-bar.js 投影；query 非空期间槽位粘性保留。 -->
        <div id="suggestion-bar"></div>
        <ul id="results"></ul>
    </div>

    <!-- AI 模式（0.17.6: 独立容器，Tab on AI Ghost 进入，ESC 退出）。
         0.24.4: 模式徽章统一走 #mode-header，输入条只留输入框。 -->
    <div hidden id="ai-mode">
        <div id="ai-input-bar">
            <input autocomplete="off" data-i18n-placeholder="ai.followup_placeholder" id="ai-query" placeholder="追问…"
                   spellcheck="false" type="text"/>
            <!-- 0.25.13 AI 听写指示器：录音中显示音量波动条 + "语音输入中"。
                 与搜索模式的 #voice-indicator 同 class 样式，各输入面自持实例，
                 dictation.js 按活跃 sink 解析。 -->
            <div class="voice-indicator hidden" id="ai-voice-indicator">
                <div class="voice-wave">
                    <div class="vw-bar"></div>
                    <div class="vw-bar"></div>
                    <div class="vw-bar"></div>
                    <div class="vw-bar"></div>
                    <div class="vw-bar"></div>
                </div>
                <span class="voice-label" data-i18n="voice.indicator.recording">语音输入中</span>
            </div>
        </div>
        <div id="ai-display">
            <div id="ai-tool-line"></div>
            <div id="ai-rounds">
                <!-- 上一轮折叠摘要条（多个，旧的在上） -->
                <!-- 当前轮正文 -->
                <div id="ai-content"></div>
            </div>
        </div>
        <div class="hidden" id="ai-footer">
            <span id="ai-model-label"></span>
        </div>
    </div>

    <!-- ResultFooter（0.24.4 §5.5）：结果导航/动作/分页 + 空 query 闲置态 Chord 一行提示 -->
    <div id="statusbar"></div>

    <!-- TransientFeedback（0.24.4 §5.5）：loading/success/error 瞬态反馈，
         底部覆盖层不占布局。transient-feedback.js 投影。 -->
    <div class="hidden" id="transient-feedback"></div>
</div>
<script src="js/main-window/main.js" type="module"></script>
</body>
</html>
