[package]
name = "blink"
version = "0.9.8"
edition = "2024"
description = "Blink — Windows Universal Action Layer"
license = "MIT"
repository = "https://github.com/chenbihao/blink"

[workspace]
members = ["plugins/examples/echo", "plugins/examples/ip", "plugins/examples/weather", "xtask"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# dev 构建下把压缩/编解码热路径的依赖也开满优化——这些 crate 我们不 debug，
# 但它们是截图/图标提取的热路径。debug 编译时慢约 5%，运行时 5-30x 加速。
# png 依赖 miniz_oxide 做 DEFLATE，miniz_oxide 依赖 adler2。
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3

[workspace.lints.clippy]
string_slice = "deny"  # 禁止直接按字节切片字符串（会导致中文 panic）

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4.45"
dirs-next = "2.0"
evalexpr = "13.1.0"
futures = "0.3"
# 链接期自动注册（0.9.7 Capability 层）——新增能力只需 `inventory::submit!`，注册表零改动
inventory = "0.3"
nucleo = "0.5.0"
png = "0.17"
open = "5.3.5"
pinyin = "0.11.0"
regex = "1.11"
# rig-core 0.39 只用作 tool schema 类型来源(ToolDefinition);0.9.0 阶段不构造 Client、不调用 LLM。
# default features 已含 derive+reqwest+rustls;额外加 rmcp 让 0.11 MCP schema 投影零适配。
rig-core = { version = "0.39", features = ["rmcp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["sync", "time", "process", "io-util", "net", "macros", "rt"] }
once_cell = "1.21"
# reqwest 0.13 与 tauri 2.11 内部对齐,默认 TLS 后端 rustls+aws-lc-rs;项目内 4 处调用只用基础 API(builder/get/send/json),零代码破坏面。
reqwest = { version = "0.13", features = ["json", "stream"] }
urlencoding = "2.1"
# 密钥内存清零(0.9.1 Phase 2):SecretString 落存前从内存抹掉,防止 core dump / 内存快照泄漏
zeroize = { version = "1.9", features = ["derive"] }
winreg = "0.55"
walkdir = "2.5"
# cpal: 跨平台音频 I/O（0.10 语音输入麦克风采集，Windows 上走 WASAPI）
cpal = "0.18"
# imekit: 跨平台 IME 协议封装（0.10.5 G2 文本注入，Windows 上走 TSF Composition + IMM32 + SendInput 三级回退）
imekit = "0.2"
# zip: 纯 Rust zip 解压（uv 二进制安装，替代 PowerShell Expand-Archive）
zip = "2.2"
# sherpa-onnx 引擎通过 Windows 自带 tar.exe 解压 .tar.bz2，无需额外 Rust 依赖
# imekit 0.2.3 依赖 windows 0.59，与 Blink 的 0.62.2 可共存（仅调 imekit 公开 API，不共享 TSF 类型）
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Security_Credentials",
] }

[features]
default = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
