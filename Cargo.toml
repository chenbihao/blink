[package]
name = "blink"
version = "0.25.16"
edition = "2024"
description = "Blink — Windows Universal Action Layer"
license = "MIT"
repository = "https://github.com/chenbihao/blink"

[workspace]
members = ["crates/blink-domain", "crates/blink-domain-capability", "crates/blink-domain-config", "crates/blink-domain-local-engine", "crates/blink-domain-stt", "crates/blink-infra", "plugins/examples/ip", "plugins/examples/translate", "plugins/examples/weather", "xtask"]

# dev/test 只保留行号表级调试信息：每轮验证都要全量重链接 ~100MB 的 debug 二进制，
# line-tables-only 让 obj/PDB 明显变小、链接更快，panic 回溯仍带行号。
# 需要在调试器里查看变量值时临时改回 debug = 2。
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# dev 构建下把压缩/编解码热路径的依赖也开满优化——这些 crate 我们不 debug，
# 但它们是截图/图标提取的热路径。debug 编译时慢约 5%，运行时 5-30x 加速。
# png 依赖 miniz_oxide 做 DEFLATE，miniz_oxide 依赖 adler2。
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3

[workspace.lints.clippy]
string_slice = "deny"  # 禁止直接按字节切片字符串（会导致中文 panic）

[dependencies]
# blink-infra: 基础设施层 crate（0.25.1 拆出；src/infra/mod.rs 为 re-export shim）
blink-infra = { path = "crates/blink-infra" }
# blink-domain: 领域层主体 crate（0.25.4 拆出）
blink-domain = { path = "crates/blink-domain" }
# blink-domain-capability: Capability 协议错误词汇 crate（0.25.1 拆出）
blink-domain-capability = { path = "crates/blink-domain-capability" }
# blink-domain-config: 配置域 crate（0.25.2 拆出：stt_config + store）
blink-domain-config = { path = "crates/blink-domain-config" }
# blink-domain-local-engine: 本地引擎领域协议 crate（0.25.2 拆出，零出边汇点）
blink-domain-local-engine = { path = "crates/blink-domain-local-engine" }
# blink-domain-stt: STT 语音转文字域 crate（0.25.3 拆出，热点域样板）
blink-domain-stt = { path = "crates/blink-domain-stt" }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4.45"
dirs-next = "2.0"
evalexpr = "13.1.0"
futures = "0.3"
# http: HeaderName/HeaderValue 类型（rmcp Streamable HTTP transport 需要，已作为传递依赖在树中）
http = "1"
# bytes: HTTP 请求/响应体日志包装（infra/utils/http_log.rs）用，rig-core 的 HttpClientExt 依赖
bytes = "1"
# sse-stream: SSE 事件流解析（rmcp 依赖，0.13.8 直接用——旧版 SSE transport 实现）
sse-stream = "0.2.5"
# thiserror: 错误类型 derive（rmcp 依赖树中已有，0.13.8 直接用——SSE transport 错误类型）
thiserror = "1"
# 链接期自动注册（0.9.7 Capability 层）——新增能力只需 `inventory::submit!`，注册表零改动
inventory = "0.3"
# getrandom: OS CSPRNG（0.23.12 ResourceStore token——ref 是 bearer capability，
# ≥128 位熵；跨平台且 domain 分层安全，不走 windows crate）
getrandom = "0.3"
nucleo = "0.5.0"
png = "0.17"
open = "5.3.5"
pinyin = "0.11.0"
regex = "1.11"
# rig-core 0.43:portable provider/message/tool contracts。0.42 起 Agent runtime 拆到 rig-agent，
# 0.43 起默认 HTTP transport 拆到 rig-reqwest（rig-core 不再自带 reqwest/tokio）。
# default features 已含 derive;test-utils 供单测 mock 模型。
rig-core = { version = "0.43", features = ["test-utils"] }
# rig-agent 0.43:Agent runtime（builder/stream/hook/tool registry）。0.43 起 MCP 集成拆到 rig-rmcp。
# test-utils: mock 模型/工具供单测。
rig-agent = { version = "0.43", features = ["test-utils"] }
# rig-rmcp 0.43:MCP tool 适配（McpTool/McpClientHandler/tools_from_server + AgentBuilder 扩展注册），
# 依赖 rmcp 2——0.43 起 rig-agent 不再有 rmcp feature，rmcp_tools 注册路径由本 crate 提供。
rig-rmcp = { version = "0.43" }
# rmcp 2.x: MCP 协议 Rust 实现（rig-rmcp 0.43 依赖 rmcp 2；MCP client/server 双向共用）。
# - client + transport-child-process: MCP client 拉起外部 server 子进程走 stdio JSON-RPC
# - server + transport-io: MCP server 暴露 Blink 能力给外部 client（stdio 传输）
# - transport-streamable-http-client-reqwest: MCP client 支持 Streamable HTTP 远程 server
# - transport-streamable-http-server: MCP server Streamable HTTP transport（主进程托管）
rmcp = { version = "2", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
# hyper + hyper-util: HTTP 服务器（0.19.13 MCP Streamable HTTP transport 需要）
# hyper 已作为 reqwest 传递依赖在树中；这里显式启用 server + http1 feature 供主进程 HTTP listener 使用
hyper = { version = "1", features = ["server", "http1"] }
# hyper-util: HTTP 服务器工具（0.19.13 MCP Streamable HTTP transport 需要）
# service: TowerToHyperService 适配 Tower Service → hyper Service
hyper-util = { version = "0.1", features = ["server", "tokio", "service"] }
# tokio-util: CancellationToken（0.19.13 MCP Streamable HTTP server 优雅关闭）
tokio-util = "0.7"
# clap: 命令行参数解析（0.13.5 CLI 化——blink chat/search/screenshot/mcp-server）
clap = { version = "4.5", features = ["derive"] }
# semver: 语义化版本比较（检查更新用），支持 pre-release / build metadata
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
# sha2: SHA-256 哈希（0.16.4 剪贴板图片去重——按内容哈希删旧留新）
sha2 = "0.10"
# unicode-normalization: CER 归一化用 Unicode NFKC（0.22.9 Handoff 07E-R）
unicode-normalization = "0.1"
serde_json = "1.0.150"
toml = "0.9.12"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.1"
# 0.25.10 应用内一键更新：检测/下载/验签/静默安装（NSIS passive）。
# 2.13 起要求 tauri ^2.12，当前 tauri 2.11.5 锁 2.12.0（要求 ^2.10）
tauri-plugin-updater = "2.12.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["sync", "time", "process", "io-util", "net", "macros", "rt", "test-util"] }
once_cell = "1.21"
# reqwest 0.13 与 tauri 2.11 内部对齐,默认 TLS 后端 rustls+aws-lc-rs;项目内 4 处调用只用基础 API(builder/get/send/json),零代码破坏面。
reqwest = { version = "0.13", features = ["json", "stream"] }
urlencoding = "2.1"
# jsonpath-rust: JSONPath 取值（0.14 Cap 协议分层——manifest 投影规则用 JSONPath 从插件 data 取值）
jsonpath-rust = "0.7"
# 密钥内存清零(0.9.1 Phase 2):SecretString 落存前从内存抹掉,防止 core dump / 内存快照泄漏
zeroize = { version = "1.9", features = ["derive"] }
# keyring: 跨平台密钥存储(0.17.11 替换自写 unsafe FFI)。v1 feature 启用 v1 兼容 API +
# 自动拉入 windows-native-keyring-store(Windows 走 Credential Manager,安全模型不变)
keyring = { version = "4", features = ["v1"] }
winreg = "0.55"
walkdir = "2.5"
# cpal: 跨平台音频 I/O（0.10 语音输入麦克风采集，Windows 上走 WASAPI）
cpal = "0.18"
# zip: 纯 Rust zip 解压（uv 二进制安装，替代 PowerShell Expand-Archive）
zip = "2.2"
# ort: ONNX Runtime Rust binding（0.22.8 OCR ONNX 迁移）
# - default-features = false + load-dynamic: 运行时通过 ort::init_from(path) 加载 onnxruntime.dll，
#   不在编译期链接 DLL，不下载预编译 binary（禁止 download-binaries feature）
# - std + ndarray: Session I/O 使用 ndarray 类型
# - tracing: ORT 内部日志桥接到 tracing
# 锁定版本 2.0.0-rc.13（spike onnx-spike/followup/decision.md §2.1 验证通过）
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "tracing"] }
# ndarray: ort Session I/O 直接使用（0.22.8 onnx_validate CLI 隔离验证）
ndarray = "0.17"
# kaldi-native-fbank: Kaldi-compatible fbank extractor (pure Rust, no external deps)
# 用于 ParaformerOnline runner 的前端特征提取（fbank → LFR → CMVN）
kaldi-native-fbank = "0.1"
# oar-ocr: PP-OCRv6 pipeline（det → crop → rec）Rust 实现（0.22.8 OCR ONNX 迁移）
# - default-features = false: 禁用 download-binaries，不构建期下载 ORT
# - simd: 启用 SIMD 优化（spike 验证的 feature 组合）
# 锁定版本 0.9.2（spike onnx-spike/followup/decision.md §2.1 验证通过）
oar-ocr = { version = "=0.9.2", default-features = false, features = ["simd"] }
# image: PNG 解码（0.22.8 ONNX OCR executor 需要将 PNG bytes 解码为 RgbImage 传给 oar-ocr）
image = { version = "0.25", default-features = false, features = ["png"] }
# sherpa-onnx 引擎通过 Windows 自带 tar.exe 解压 .tar.bz2，无需额外 Rust 依赖
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Devices_Bluetooth",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Security_Credentials",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Globalization",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

[features]
default = []

[dev-dependencies]
# keyring-core: 供 store.rs 单测访问 mock store + set_default_store（0.17.11 单测隔离核心）
keyring-core = "1"
# tempfile: 单测独占临时目录（FunASR hotwords/server script 落盘测试，不写真实 %APPDATA%）
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
