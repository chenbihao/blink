[package]
name = "blink"
version = "0.19.17"
edition = "2024"
description = "Blink — Windows Universal Action Layer"
license = "MIT"
repository = "https://github.com/chenbihao/blink"

[workspace]
members = ["plugins/examples/echo", "plugins/examples/ip", "plugins/examples/translate", "plugins/examples/weather", "xtask"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# dev 构建下把压缩/编解码热路径的依赖也开满优化——这些 crate 我们不 debug，
# 但它们是截图/图标提取的热路径。debug 编译时慢约 5%，运行时 5-30x 加速。
# png 依赖 miniz_oxide 做 DEFLATE，miniz_oxide 依赖 adler2。
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3

[workspace.lints.clippy]
string_slice = "deny"  # 禁止直接按字节切片字符串（会导致中文 panic）

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4.45"
dirs-next = "2.0"
evalexpr = "13.1.0"
futures = "0.3"
# http: HeaderName/HeaderValue 类型（rmcp Streamable HTTP transport 需要，已作为传递依赖在树中）
http = "1"
# sse-stream: SSE 事件流解析（rmcp 依赖，0.13.8 直接用——旧版 SSE transport 实现）
sse-stream = "0.2.5"
# thiserror: 错误类型 derive（rmcp 依赖树中已有，0.13.8 直接用——SSE transport 错误类型）
thiserror = "1"
# 链接期自动注册（0.9.7 Capability 层）——新增能力只需 `inventory::submit!`，注册表零改动
inventory = "0.3"
nucleo = "0.5.0"
png = "0.17"
open = "5.3.5"
pinyin = "0.11.0"
regex = "1.11"
# rig-core 0.39:tool schema(ToolDefinition) + Provider 接入(0.9.2 起) + 对话窗口 Agent(0.12.1)。
# default features 已含 derive+reqwest+rustls;额外加 rmcp 让 0.11 MCP schema 投影零适配。
# test-utils 供 0.12.1 spike 验证 rig Agent API(Phase 6 后随 spike 移除)。
rig-core = { version = "0.39", features = ["rmcp", "test-utils"] }
# rmcp: MCP 协议 Rust 实现。
# - client + transport-child-process: 0.13.0 MCP client 拉起外部 server 子进程走 stdio JSON-RPC
# - server + transport-io: 0.13.4 MCP server 暴露 Blink 能力给外部 client（stdio 传输）
# - transport-streamable-http-client-reqwest: 0.13.6 MCP client 支持 Streamable HTTP 远程 server
# - transport-streamable-http-server: 0.19.13 MCP server Streamable HTTP transport（主进程托管）
rmcp = { version = "1.8", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
# hyper + hyper-util: HTTP 服务器（0.19.13 MCP Streamable HTTP transport 需要）
# hyper 已作为 reqwest 传递依赖在树中；这里显式启用 server + http1 feature 供主进程 HTTP listener 使用
hyper = { version = "1", features = ["server", "http1"] }
# hyper-util: HTTP 服务器工具（0.19.13 MCP Streamable HTTP transport 需要）
# service: TowerToHyperService 适配 Tower Service → hyper Service
hyper-util = { version = "0.1", features = ["server", "tokio", "service"] }
# tokio-util: CancellationToken（0.19.13 MCP Streamable HTTP server 优雅关闭）
tokio-util = "0.7"
# clap: 命令行参数解析（0.13.5 CLI 化——blink chat/search/screenshot/mcp-server）
clap = { version = "4.5", features = ["derive"] }
# semver: 语义化版本比较（检查更新用），支持 pre-release / build metadata
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
# sha2: SHA-256 哈希（0.16.4 剪贴板图片去重——按内容哈希删旧留新）
sha2 = "0.10"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["sync", "time", "process", "io-util", "net", "macros", "rt"] }
once_cell = "1.21"
# reqwest 0.13 与 tauri 2.11 内部对齐,默认 TLS 后端 rustls+aws-lc-rs;项目内 4 处调用只用基础 API(builder/get/send/json),零代码破坏面。
reqwest = { version = "0.13", features = ["json", "stream"] }
urlencoding = "2.1"
# jsonpath-rust: JSONPath 取值（0.14 Cap 协议分层——manifest 投影规则用 JSONPath 从插件 data 取值）
jsonpath-rust = "0.7"
# 密钥内存清零(0.9.1 Phase 2):SecretString 落存前从内存抹掉,防止 core dump / 内存快照泄漏
zeroize = { version = "1.9", features = ["derive"] }
# keyring: 跨平台密钥存储(0.17.11 替换自写 unsafe FFI)。v1 feature 启用 v1 兼容 API +
# 自动拉入 windows-native-keyring-store(Windows 走 Credential Manager,安全模型不变)
keyring = { version = "4", features = ["v1"] }
winreg = "0.55"
walkdir = "2.5"
# cpal: 跨平台音频 I/O（0.10 语音输入麦克风采集，Windows 上走 WASAPI）
cpal = "0.18"
# zip: 纯 Rust zip 解压（uv 二进制安装，替代 PowerShell Expand-Archive）
zip = "2.2"
# sherpa-onnx 引擎通过 Windows 自带 tar.exe 解压 .tar.bz2，无需额外 Rust 依赖
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
"Win32_Devices_HumanInterfaceDevice",
"Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Security_Credentials",
    "Globalization",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

[features]
default = []

[dev-dependencies]
# keyring-core: 供 store.rs 单测访问 mock store + set_default_store（0.17.11 单测隔离核心）
keyring-core = "1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
