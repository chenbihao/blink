[package]
name = "blink"
version = "0.1.0"
edition = "2024"
description = "Blink — Windows Universal Launcher"

[workspace]
members = ["plugins/examples/echo", "plugins/examples/ip", "plugins/examples/weather", "xtask"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.lints.clippy]
string_slice = "deny"  # 禁止直接按字节切片字符串（会导致中文 panic）

[dependencies]
async-trait = "0.1"
chrono = "0.4.45"
dirs-next = "2.0"
evalexpr = "13.1.0"
nucleo = "0.5.0"
png = "0.17"
open = "5.3.5"
pinyin = "0.11.0"
regex = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.4"
tauri-plugin-dialog = "2.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["sync", "time", "process", "io-util"] }
once_cell = "1.21"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
winreg = "0.55"
walkdir = "2.5"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
